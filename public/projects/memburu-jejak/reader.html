ak ramai orang? Eh, kau jangan nak buat benda pelik-pelik, Khalid. Ni sekolah weh.”</p>\n<p>Khalid ketawa kecil. “Aku seriuslah.”</p>\n<p>Saiful termenung sebentar, kemudian jari telunjuknya terangkat.</p>\n<p class=\"dialogue\">“Ha! Aku tahu tempatnya.”</p>\n<p class=\"dialogue\">“Dekat mana?” tanya Khalid cepat.</p>\n<p>Saiful tersenyum lebar. “Library.”</p>\n<p>Khalid mengangguk perlahan, senyuman kecil mula terukir di bibirnya.</p>\n<p class=\"dialogue\">“Bagus. Kita jumpa balik dekat tempat semuanya bermula.”</p>", "wordCount": 1016}, {"num": 10, "fullTitle": "Bab 10 – Pintu yang Terbuka", "title": "Pintu yang Terbuka", "content": "<p>Telah menjadi rutin Khalid sejak berpindah ke sekolah ini untuk menunaikan solat di surau sebelum pulang ke rumah. Hatinya sentiasa tenang selepas beribadah. Baginya, solat bukan sekadar kewajipan, tetapi juga sumber kekuatan.</p>\n<p>‘Kejayaan manusia dan jin di atas muka bumi ini hanyalah dalam agama yang sempurna — taat perintah Allah, ikut cara Nabi Muhammad S.A.W.’</p>\n<p>Itulah pesan seorang gurunya dahulu. Pesanan yang tidak pernah pudar daripada ingatannya.</p>\n<p>Khalid pernah mengajak Saiful menemaninya bersolat berjemaah, namun ajakannya sering ditolak dengan alasan pemandu peribadi sudah menunggu. Khalid tidak berkecil hati. Dia faham sahabat barunya itu hidup dalam dunia yang berbeza, tetapi tetap berharap suatu hari nanti, Saiful akan membuka hatinya.</p>\n<p>Khalid menanggalkan kasut dan menaiki tangga menuju ke surau. Langkahnya perlahan, tenang, tetapi fikirannya ligat bertanya:</p>\n<p class=\"dialogue\">“Ke mana semua orang? Takkan tak ada yang solat di sini?”</p>\n<p>Tiada jawapan.</p>\n<p>Selepas mengambil wuduk, Khalid melaungkan azan dengan suara yang merdu, bergema lembut di ruang surau yang sunyi. Waktu Zuhur sudah masuk.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Di luar surau, Saiful masih berdiri memandang langkah Khalid yang semakin jauh. Dia berasa aneh.</p>\n<p class=\"dialogue\">“Kenapa aku lari?” bisiknya kepada diri sendiri.</p>\n<p class=\"dialogue\">“Kenapa aku malu bila diajak sujud kepada Tuhan? Kenapa aku takut?”</p>\n<p>Hatinya mahu, tapi lidahnya menolak.</p>\n<p>Inilah kali pertama ada orang yang betul-betul mengajaknya bersolat.</p>\n<p>Dia menunduk. “Kenapa aku tolak sesuatu yang baik?”</p>\n<p>Saiful berjalan perlahan ke arah kereta mewah ayahnya. Seperti biasa, pemandu peribadinya sudah menunggu. Dia melangkah masuk dan menghempaskan tubuh ke kerusi depan di sebelah pemandu. Dia tidak suka duduk di belakang — baginya, hubungan mereka lebih daripada sekadar majikan dan pekerja.</p>\n<p class=\"dialogue\">“Kenapa, encik? Muka macam banyak fikir,” tegur pemandunya, Nadzmi, seorang lelaki muda lewat 20-an.</p>\n<p>Saiful diam seketika, lalu bertanya, “Nadzmi, aku boleh tanya kau sesuatu?”</p>\n<p class=\"dialogue\">“Silakan, encik.”</p>\n<p class=\"dialogue\">“Kau tahu, aku lahir dalam keluarga kaya. Semua benda aku boleh dapat. Tapi aku tak rasa bahagia pun. Macam… ada sesuatu yang hilang. Kau faham maksud aku?”</p>\n<p>Nadzmi tersenyum kecil, matanya fokus ke jalan. “Saya rasa, semua tu memang tak cukup untuk buat kita bahagia.”</p>\n<p class=\"dialogue\">“Maksudnya?”</p>\n<p class=\"dialogue\">“Kaya, pandai, popular — semua tu sementara. Bahagia datang bila kita bersyukur dengan apa yang kita ada.”</p>\n<p>Saiful mengangguk perlahan. “Bersyukur… maksud kau ucap Alhamdulillah sahaja?”</p>\n<p class=\"dialogue\">“Itu satu cara,” jawab Nadzmi, “tapi yang paling penting — bersyukur dengan perbuatan. Gunakan nikmat yang Tuhan bagi untuk dekat dengan Dia. Solat, berbuat baik, tinggalkan yang dilarang. Dari situ, hati akan tenang. Kekosongan tu hilang.”</p>\n<p>Saiful terdiam lama. Kata-kata itu seperti mengetuk pintu hatinya.</p>\n<p class=\"dialogue\">“Mungkin… aku memang patut cuba,” katanya perlahan.</p>\n<p>Senyum mula terukir di bibirnya.</p>\n<p class=\"dialogue\">“Esok, aku nak teman Khalid solat.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sementara itu, Khalid baru selesai menunaikan solat di surau. Dia solat bersendirian, tapi anehnya — setiap kali sujud, terasa seperti ada seseorang di belakangnya.</p>\n<p>Apabila dia berpaling, ruang surau tetap kosong.</p>\n<p>Namun Khalid tidak gentar. Dia pernah mendengar daripada seorang ustaz, kadang-kadang jin Islam juga menyertai manusia solat berjemaah, walaupun kita tidak dapat melihat mereka.</p>\n<p class=\"dialogue\">“Mungkin dia juga hamba Allah yang sedang beribadah,” bisik Khalid sambil tersenyum kecil.</p>\n<p>Dia melangkah keluar dari surau. Udara petang yang redup menyambutnya, memberi rasa damai. Namun langkahnya terhenti apabila seseorang tiba-tiba menegurnya.</p>\n<p>Lelaki itu berpakaian seragam biru — jelas pengawal keselamatan sekolah. Wajahnya berumur, tetapi pandangannya tajam.</p>\n<p class=\"dialogue\">“Budak, kau yang azan dan solat tadi?”</p>\n<p class=\"dialogue\">“Ya, saya,” jawab Khalid sopan.</p>\n<p class=\"dialogue\">“Budak baru ya?”</p>\n<p>Khalid mengangguk lagi.</p>\n<p>Lelaki itu menarik nafas panjang sebelum berkata dengan suara perlahan tapi tegas,</p>\n<p class=\"dialogue\">“Hati-hati dengan tempat ni, nak. Tempat ni… bukan tempat kau.”</p>\n<p>Khalid terkejut. “Kenapa, pakcik? Saya cuma solat.”</p>\n<p class=\"dialogue\">“Kalau kau nak selamat, ikut nasihat aku — jangan datang ke sini lagi.”</p>\n<p>Tanpa menjelaskan apa-apa, lelaki itu berlalu pergi meninggalkan Khalid terpinga-pinga di tangga surau.</p>\n<p class=\"dialogue\">“Bukan tempat aku? Apa maksudnya tu?”</p>\n<p>Namun Khalid hanya memandang langkah lelaki itu hilang di selekoh, lalu menunduk.</p>\n<p class=\"dialogue\">“Mungkin dia cuma bergurau…”</p>\n<p>Dia cuba menenangkan hatinya, tapi entah kenapa — suara itu bergema lama dalam kepalanya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Saiful, sebaliknya, sudah pulang ke rumah. Beg sekolahnya dilontar ke atas katil sebelum dia terus menekan suis komputer di meja belajarnya. Sementara sistemnya hidup, dia mencapai tuala dan mandi.</p>\n<p>Tidak lama kemudian, dia kembali ke meja dengan hanya bertuala, mata terus tertumpu ke skrin.</p>\n<p class=\"dialogue\">“Oh, man! Kena serang lagi!” jeritnya kecewa melihat game dalam talian yang sedang berlangsung. Jarinya pantas menggerakkan tetikus, seperti seorang panglima medan perang.</p>\n<p>Beberapa minit kemudian, dia bersorak kecil. “Heh, padan muka! Cuba serang lagi kalau berani.”</p>\n<p>Usai bermain, dia tersenyum puas lalu mengenakan pakaian dan turun ke dapur.</p>\n<p>Ibunya sedang memasak. Wajah wanita itu berseri-seri melihat anak tunggalnya.</p>\n<p class=\"dialogue\">“Ibu masak apa hari ni?” tanya Saiful manja, menghampiri sambil mencium tangan ibunya.</p>\n<p class=\"dialogue\">“Ibu masak lauk kegemaran Saiful,” jawab ibunya dengan senyuman lembut.</p>\n<p class=\"dialogue\">“Wah, lapar dah ni,” balasnya riang sambil menepuk perut.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selesai makan malam, Saiful kembali ke komputernya. Dunia nyata terasa membosankan, tapi dunia maya — “Dunia Kedua” — membuatkan dia rasa hidup.</p>\n<p>Dalam permainan itu, dia bukan lagi pelajar sekolah biasa. Dia seorang pemimpin, seorang wira. Segala kebosanan, kekosongan dan kesedihan di dunia sebenar hilang di sana.</p>\n<p>Dia bermain tanpa sedar waktu berlalu. Dari petang ke malam, dari satu game ke game lain — DOTA, Need for Speed, Left 4 Dead. Dunia maya menggantikan realiti.</p>\n<p>Menjelang tengah malam, matanya mula berat. Dia menutup komputer dan terus ke katil.</p>\n<p class=\"dialogue\">“Esok aku nak cuba berubah,” bisiknya perlahan sebelum terlelap.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid pula di kamarnya sedang membaca novel yang baru dipinjam dari perpustakaan.</p>\n<p class=\"dialogue\">“Ramlee Awang Murshid,” dia membaca nama itu perlahan. “Novelis thriller nombor satu negara.”</p>\n<p>Tajuk novel itu — 9 Nyawa.</p>\n<p>Tajuk yang menggugah rasa ingin tahu. Khalid tahu, di sebalik kisah mitos, penulis ini sering menyelitkan nilai agama dan falsafah kehidupan. Itu yang menarik minatnya.</p>\n<p>Helaian demi helaian diselak. Waktu berlalu tanpa disedari.</p>\n<p>Di ruang tamu, kedengaran suara ayahnya, Tarmizi, berbual dengan seorang rakan. Khalid hanya mendengar samar-samar, tidak terganggu.</p>\n<p>Menjelang tengah malam, dia tersedar bahawa kerja sekolah Kimia masih belum disiapkan.</p>\n<p class=\"dialogue\">“Alamak, ada Kimia lepas rehat esok!” keluhnya.</p>\n<p>Dia segera menutup novel, mencapai buku latihan dan mula menulis. Namun sepuluh minit kemudian, matanya mula layu. Kepala direhatkan di atas meja, dan tanpa sedar — dia tertidur di situ juga.</p>\n<p>Beberapa minit selepas itu, Khalid separuh sedar, bangun perlahan dan melangkah ke katil.</p>\n<p>Dia membaringkan diri, menarik selimut, dan dalam beberapa saat, lena kembali menyelubunginya.</p>", "wordCount": 1028}, {"num": 11, "fullTitle": "Bab 11 – Manusia Tidak Mampu Meramal Masa Depan", "title": "Manusia Tidak Mampu Meramal Masa Depan", "content": "<p>Khalid terjaga dari tidurnya. Entah mimpi apa yang baru dialaminya malam tadi. Dia mengesat mata, merenung siling, sebelum tangannya meraba jam loceng di atas meja.</p>\n<p>6.45 pagi.</p>\n<p>Serentak itu juga, tubuhnya yang tadi lesu terus segar. Dia melompat turun dari katil, mencapai tuala dan kelengkapan mandinya. “Aduh, lewat lagi!” rungutnya kecil.</p>\n<p>Malam tadi dia berjaga lama menyiapkan kerja sekolah. Akibatnya, dia tertidur di meja belajar — tengkuknya masih terasa sengal. Selesai mandi, dia mengenakan uniform sekolah dan menyusun buku ke dalam beg. Namun, baru sahaja dia mahu keluar bilik, matanya terpandang jam tangan.</p>\n<p>7.10 pagi.</p>\n<p>Khalid tersentak. “Alamak, belum solat Subuh lagi!” katanya cemas.</p>\n<p>Namun dia tidak berganjak.</p>\n<p class=\"dialogue\">“Biar kena denda... asalkan tak dapat dosa,”</p>\n<p>tekadnya dalam hati.</p>\n<p>Dia menghampar sejadah dan mengangkat takbir. Solatnya khusyuk, meskipun masa semakin suntuk. Bagi Khalid, solat yang tergesa-gesa hanya menjadikan manusia jauh daripada erti sebenar ibadah.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid tiba di sekolah tepat 7.35 pagi — lewat lima minit. Walaupun ayahnya menghantarnya dengan kereta, masa tetap tidak berpihak kepadanya. Di depan pondok pengawal, beberapa pelajar sudah berbaris menunggu hukuman.</p>\n<p>Nama mereka dicatat di dalam buku kecil — buku rekod pelajar lewat. Dan setiap kesalahan yang berulang, akan digandakan hukumannya.</p>\n<p class=\"dialogue\">“Hai, datang lewat juga?” tegur satu suara dari sebelah.</p>\n<p>Khalid menoleh — Munir. Rakan sekelasnya yang jarang muncul di kelas, tapi selalu kelihatan di tempat-tempat yang “tak rasmi”.</p>\n<p>Khalid hanya tersenyum malu. “Ha’ah, pertama kali ini. Terlewat bangun.”</p>\n<p>Munir menyengih. “Relaks lah. Aku dah biasa. Denda tak berat pun.”</p>\n<p class=\"dialogue\">“Denda macam mana?” tanya Khalid.</p>\n<p class=\"dialogue\">“Cikgu Bakar ambil nama, lepas tu suruh jumpa pengetua. Biasanya kena ceramah sikit atau kutip sampah depan bengkel.”</p>\n<p class=\"dialogue\">“Lepas tu?”</p>\n<p class=\"dialogue\">“Lepas tu bebas lah.” Munir mengangkat bahu. “Lagipun, dia kata jumpa pengetua, bukan pengetua nak jumpa. Faham-faham saja lah.”</p>\n<p>Khalid terdiam. Bukan saja terkejut, tapi kagum dengan cara Munir berfikir.</p>\n<p class=\"dialogue\">“Speaking juga mamat ni,”</p>\n<p>bisiknya dalam hati sambil tersenyum kecil.</p>\n<p>Munir menoleh, matanya sedikit tajam.</p>\n<p class=\"dialogue\">“Banyak lagi benda kau tak tahu pasal sekolah ni, Khalid.”</p>\n<p>Nada suaranya seperti menyimpan makna yang dalam — sebelum sempat Khalid bertanya, Cikgu Bakar sudah muncul. Semua pelajar berdiri tegak menanti ‘ceramah pagi’ dan rotan yang setia di tangan cikgu garang itu.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas hukuman selesai, Khalid ingin terus ke kelas. Namun Munir menahan langkahnya.</p>\n<p class=\"dialogue\">“Kau tahu sekarang kelas apa?” tanya Munir.</p>\n<p class=\"dialogue\">“Kelas Kimia.”</p>\n<p>Munir mendengus kecil. “Dan kau tahu siapa ajar?”</p>\n<p class=\"dialogue\">“Cikgu Fatimah.”</p>\n<p>Munir memusingkan badan, menatap Khalid dengan wajah serius.</p>\n<p class=\"dialogue\">“Kalau kau nak masa depan kau gelap, masuklah kelas tu.</p>\n<p>Tapi kalau kau masih sayang waktu muda kau, ikut aku.”</p>\n<p>Khalid terpinga. “Kenapa dengan Cikgu Fatimah?”</p>\n<p>Munir tersenyum sinis. “Fikir sendiri, budak bijak.”</p>\n<p>Khalid menimbang. Dalam hati, dia tahu — dia sudah melakukan dua kesalahan hari ini: lewat ke sekolah dan tidak menemui pengetua. Adakah dia sanggup menambah satu lagi dengan ponteng kelas?</p>\n<p class=\"dialogue\">“Munir, boleh aku tanya sesuatu?”</p>\n<p class=\"dialogue\">“Tanyalah. Aku tak caj pun.”</p>\n<p class=\"dialogue\">“Kenapa kau tolong aku? Kenapa ajak aku elak semua peraturan ni? Kita pun jarang bertegur di kelas.”</p>\n<p>Munir berhenti melangkah. Bibirnya terukir senyum nipis.</p>\n<p class=\"dialogue\">“Sebab kau istimewa, Khalid.”</p>\n<p>Jawapan itu pendek, tapi cukup untuk membungkam lidah Khalid.</p>\n<p class=\"dialogue\">“Ikut aku. Kau akan tahu kenapa aku cakap begitu.”</p>\n<p>Khalid hanya mampu menurut.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Mereka berjalan menyusuri blok lama sekolah — bahagian belakang yang jarang dikunjungi pelajar. Setelah melalui lorong sempit yang sedikit berdebu, Munir berhenti di depan sebuah pintu kayu berwarna kelabu.</p>\n<p class=\"dialogue\">“Inilah tempat aku selalu lepak bila bosan,” katanya.</p>\n<p>Khalid memandang sekeliling — terpegun.</p>\n<p>Ruang itu seperti bengkel mini. Ada meja kerja, alat elektronik, serpihan wayar, dan model-model robot kecil tersusun di atas rak.</p>\n<p class=\"dialogue\">“Dah berapa lama kau buat semua ni?” tanya Khalid, matanya masih liar menjelajah setiap sudut.</p>\n<p class=\"dialogue\">“Sejak aku masuk sekolah ni.”</p>\n<p>Khalid mengangguk perlahan, masih kagum. Tiba-tiba, pintu bilik kecil di hujung ruangan terbuka. Seorang lelaki berpakaian lusuh keluar sambil mengelap tangannya.</p>\n<p class=\"dialogue\">“Eh Munir, awal datang hari ni. Selalu waktu rehat baru nampak muka,” tegurnya bersahaja. “Kau bawa kawan baru ke?”</p>\n<p>Munir tersenyum dan menghulurkan tangan. “Abang Kadir, ini Khalid. Budak baru sekolah kita.”</p>\n<p>Lelaki itu — Abang Kadir — berjabat tangan dengan Khalid sambil memerhatikannya dari kepala ke kaki. “Wah, pandai kau, Munir. Dah mula rekrut budak baru.”</p>\n<p>Munir ketawa kecil. “Tak ada lah. Dia ini kesian, baru masuk dah kena denda. Jadi aku bawa dia ke sini. Lagi pun dia ini…”</p>\n<p>Munir mendekatkan mulut ke telinga Abang Kadir, membisikkan sesuatu. Suaranya perlahan, tapi cukup membuat Khalid tertanya-tanya.</p>\n<p>Dia tidak menyoal. Sebaliknya, matanya tertarik kepada satu robot kecil di rak kaca. Ia kelihatan seperti kereta kawalan jauh — tapi rekaannya unik. Khalid mengambilnya perlahan-lahan.</p>\n<p class=\"dialogue\">“Eh Khalid, tengok boleh, sentuh jangan,” tegur Munir pantas.</p>\n<p>Khalid segera meletakkannya semula. “Maaf, aku tak tahu. Cantik rekaan dia.”</p>\n<p>Abang Kadir tersenyum. “Itu hasil tangan Munir. Dia dah lama usahakan benda itu.”</p>\n<p class=\"dialogue\">“Hebat,” balas Khalid ikhlas.</p>\n<p class=\"dialogue\">“Tak apa, biar dia tahu sikit-sikit,” kata Munir lembut kali ini.</p>\n<p>Tak lama kemudian, Abang Kadir meninggalkan mereka dengan alasan mahu sambung kerjanya. Tinggallah dua sahabat baru itu di bengkel kecil itu, membetulkan beberapa komponen robot yang terbengkalai.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Dua jam berlalu tanpa disedari.</p>\n<p>Munir melihat jam di pergelangan tangannya. “Pukul sembilan. Jom masuk kelas.”</p>\n<p>Khalid terkejut. “Awal kau ajak masuk kelas kali ini?”</p>\n<p>Munir ketawa kecil. “Sebab lepas ini Fizik. Cikgu dia sempoi habis.”</p>\n<p>Khalid tersenyum sambil menggeleng kepala. “Kalau aku tahu, tak payah aku tanya.”</p>\n<p>Mereka mengemas meja kerja, mengucap terima kasih kepada Abang Kadir dan meninggalkan tempat itu.</p>\n<p>Dalam perjalanan ke kelas, Munir tidak henti-henti bercerita tentang guru Fizik mereka. Khalid hanya mendengar sambil sesekali bertanya. Namun ketika tiba di depan kelas, langkah mereka terhenti.</p>\n<p>Kelas 5 Alfa kelihatan riuh-rendah seperti biasa. Tapi sebaik Munir menolak daun pintu dan melangkah masuk — suasana terus berubah.</p>\n<p>Senyap.</p>\n<p>Begitu senyap hingga bunyi kipas siling dan cengkerik di luar pun kedengaran.</p>\n<p>Sebuah suara bergema dari depan kelas. Tenang, tapi tajam.</p>\n<p class=\"dialogue\">“Baru sampai? Jauh berjalan?”</p>\n<p>Munir terpaku. Suara itu milik seseorang yang tidak dijangka.</p>\n<p>Khalid menelan liur.</p>\n<p>Udara terasa berat.</p>\n<p>Dan kemudian, suara itu menyusul lagi, kali ini perlahan tapi menusuk:</p>\n<p class=\"dialogue\">“Manusia tidak mampu meramal masa depan mereka.”</p>\n<p>Waktu seolah-olah terhenti.</p>\n<p>Khalid kaku di tempatnya.</p>\n<p>Munir tunduk — wajahnya berubah serius.</p>\n<p>Sesiapa pun lelaki di hadapan mereka itu, dia tahu terlalu banyak.</p>", "wordCount": 1023}, {"num": 12, "fullTitle": "Bab 12 – Di Balik Bisikan Koridor", "title": "Di Balik Bisikan Koridor", "content": "<p>Khalid dan Munir tertunduk kaku.</p>\n<p>Suara Cikgu Fatimah bergema di ruang kelas — garau, tajam, dan penuh sindiran. Tiada seorang pun berani menyampuk.</p>\n<p class=\"dialogue\">“Kamu berdua fikir kamu bijak? Ponteng kelas, lepas tu masuk macam tiada apa berlaku?”</p>\n<p>Tangan Cikgu Fatimah menggenggam pen marker seperti mahu melemparnya. Khalid hanya menunduk, menahan malu dan kesal. Munir pula menatap lantai, tapi wajahnya jelas menyimpan bara.</p>\n<p>Hukuman tidak berhenti dengan kata-kata. Nama mereka dicatat dalam buku kedatangan — sebagai tidak hadir ke sekolah. Dan sebatang rotan hinggap di tangan mereka.</p>\n<p class=\"dialogue\">“Keluar kelas. Berdiri di luar sampai saya izinkan masuk.”</p>\n<p>Khalid akur. Dia menerima semuanya sebagai balasan atas kesilapannya. Namun, di dalam hati, ada rasa pedih yang tidak tertulis.</p>\n<p>Munir pula tidak dapat menahan marah. Dia merenung pintu kelas seketika, lalu berpaling kepada Khalid.</p>\n<p class=\"dialogue\">“Anggap aku dah tak wujud dekat sekolah ni. Anggap persahabatan kita tamat hari ni.”</p>\n<p>Kata-kata itu menusuk jauh.</p>\n<p>Munir terus melangkah pergi — tanpa menoleh lagi.</p>\n<p>Khalid terpaku.</p>\n<p>Antara kesal dan hairan, dia hanya mampu memandang bayang Munir yang semakin hilang di hujung koridor.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Beberapa minit kemudian, dua orang pengawas melintas di hadapan kelas. Mereka berbual perlahan, namun cukup jelas di telinga Khalid yang berdiri di luar.</p>\n<p class=\"dialogue\">“Eh kau tahu, kes kecurian semalam tu… aku rasa dalang dia orang dalam sekolah ni juga.”</p>\n<p class=\"dialogue\">“Orang dalam?” balas rakannya. “Macam mana kau tahu?”</p>\n<p class=\"dialogue\">“Mestilah. Macam mana pencuri boleh tahu tempat barang disimpan? Kelas tu dikawal pengawas tau.”</p>\n<p class=\"dialogue\">“Hmm… teori kau ni macam masuk akal.”</p>\n<p>Khalid memasang telinga. Hatinya berdebar.</p>\n<p>Kecurian? Barang hilang?</p>\n<p class=\"dialogue\">“Cikgu Bakar kata nak umumkan siasatan nanti,” sambung salah seorang pengawas.</p>\n<p class=\"dialogue\">“Harap-harap bukan geng Ramli atau Hadi lagi.”</p>\n<p>Kedua-duanya ketawa kecil sebelum menuruni tangga.</p>\n<p>Khalid termenung. Potongan maklumat itu bergema di fikirannya.</p>\n<p>Ada sesuatu yang sedang berlaku di sekolah ini — sesuatu yang pelik.</p>\n<p>Dan entah kenapa, hatinya berkata Munir tahu lebih banyak daripada yang dia tunjukkan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p class=\"dialogue\">“Khalid!” suara tegas memecah lamunannya.</p>\n<p>Dia menoleh.</p>\n<p>Cikgu Fatimah berdiri di depan pintu kelas dengan wajah masih tegas, tapi nada suaranya sudah berubah.</p>\n<p class=\"dialogue\">“Masuklah. Saya izinkan.”</p>\n<p>Khalid segera mengemas barang dan melangkah masuk.</p>\n<p class=\"dialogue\">“Munir mana?” tanya Cikgu Fatimah tanpa menoleh.</p>\n<p class=\"dialogue\">“Tak tahu, cikgu.” jawab Khalid perlahan.</p>\n<p>Cikgu Fatimah menarik nafas panjang. “Baiklah. Oleh sebab kamu masih mahu belajar walaupun saya hukum tadi, saya tarik balik catatan tadi. Kamu dianggap hadir hari ini.”</p>\n<p>Khalid terpinga. “Terima kasih, cikgu. Saya minta maaf.”</p>\n<p>Senyuman muncul di wajah wanita itu. “Saya dah maafkan kamu. Cuma… jangan ulang lagi.”</p>\n<p>Suasana kelas menjadi hening. Pelajar 5 Alfa saling berpandangan, terkejut melihat perubahan mendadak dalam nada suara cikgu paling digeruni di sekolah itu.</p>\n<p class=\"dialogue\">“Err... cikgu,” suara Khalid perlahan, “kenapa tiba-tiba—”</p>\n<p>Cikgu Fatimah tersenyum tipis.</p>\n<p class=\"dialogue\">“Sebab kamu istimewa, Khalid.”</p>\n<p>Wajah Khalid merah padam. Dia cepat-cepat kembali ke tempat duduk, disambut pandangan pelik Saiful di sebelahnya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Waktu berlalu perlahan. Cikgu Fatimah akhirnya menamatkan pengajaran dan meninggalkan kelas selepas memberi tugasan baharu.</p>\n<p class=\"dialogue\">“Fuh, lega!” Haziq mengeluh kuat. “Dua jam dengar dia bercakap rasa macam dua tahun.”</p>\n<p>Saiful terus menoleh ke arah Khalid.</p>\n<p class=\"dialogue\">“Eh, kau pergi mana tadi? Kena denda ke dengan Cikgu Bakar?”</p>\n<p>Khalid hanya menjawab tenang, “Tak ada apa-apa.”</p>\n<p class=\"dialogue\">“Ha? Aku tanya panjang, kau jawab pendek sangat,” rungut Saiful.</p>\n<p>Khalid senyum kecil. “Tanya pendek, jawapan pun pendeklah.”</p>\n<p class=\"dialogue\">“Okay, pendek — kenapa lewat?”</p>\n<p class=\"dialogue\">“Tak ada apa-apa,” jawab Khalid lagi, sambil menunduk.</p>\n<p>Saiful mengangkat tangan tanda kalah. “I give up.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Ketika waktu rehat tiba, semua pelajar berpusu ke kafeteria. Khalid kekal di tempat duduknya, termenung.</p>\n<p>Banyak yang berlaku hari ini — terlalu banyak untuk dihadam.</p>\n<p>Datang lewat, ponteng kelas, dimarahi guru, kehilangan Munir, dan berita tentang kecurian di sekolah.</p>\n<p class=\"dialogue\">“Munir...”</p>\n<p>nama itu berputar dalam fikirannya.</p>\n<p>Boleh jadi… dia terlibat?</p>\n<p>Namun sebelum fikirannya jauh melayang, suara lembut menyapa dari belakang.</p>\n<p class=\"dialogue\">“Kau tak ke perpustakaan hari ni?”</p>\n<p>Khalid tersentak. “Mariam?”</p>\n<p>Gadis itu sedang menyusun buku dari begnya.</p>\n<p class=\"dialogue\">“Tak ada mood,” jawab Khalid jujur.</p>\n<p>Mariam tersenyum, lembut tapi tegas.</p>\n<p class=\"dialogue\">“Kau tak perlu jadi Shinichi Kudo untuk selesaikan masalah. Kadang-kadang, jadi diri sendiri pun dah cukup.”</p>\n<p>Khalid terdiam. Kata-kata itu seperti menyentuh terus ke hatinya.</p>\n<p class=\"dialogue\">“Fikirlah baik-baik, Khalid. Jangan sia-siakan apa yang kau ada,” tambah Mariam sebelum beredar.</p>\n<p>Khalid hanya mampu memandang.</p>\n<p class=\"dialogue\">“Tunggu, Mariam!”</p>\n<p>Namun gadis itu sudah hilang di sebalik pintu kelas.</p>\n<p>Dia memegang kepalanya — keliru.</p>\n<p class=\"dialogue\">“Macam mana dia tahu aku fikir benda tu? Aku tak pernah cakap pada sesiapa…”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Tuk! Tuk! Tuk!</p>\n<p>Ketukan di pintu mengejutkannya. Dua pengawas berdiri di muka pintu.</p>\n<p class=\"dialogue\">“Pelajar tak boleh berada di kelas waktu rehat,” ujar salah seorang.</p>\n<p>Khalid mengangguk patuh. Dia mengemas buku dan berkata sopan, “Baiklah, saya minta maaf.”</p>\n<p>Sebelum keluar, salah seorang pengawas bertanya,</p>\n<p class=\"dialogue\">“Nama kamu?”</p>\n<p class=\"dialogue\">“Khalid.”</p>\n<p>Nama itu dicatat di dalam buku kecil. Khalid perasan seorang lagi pengawas berbisik sesuatu pada rakannya. Tapi dia buat tak tahu, terus berjalan keluar menuju perpustakaan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>10.45 pagi.</p>\n<p>Hanya tinggal lima belas minit sebelum rehat tamat.</p>\n<p>Di perpustakaan, Mariam masih di situ — wajahnya tenang, menulis sesuatu di buku catatan.</p>\n<p class=\"dialogue\">“Hai, Mariam,” sapa Khalid.</p>\n<p class=\"dialogue\">“Hai.” Gadis itu tersenyum kecil. “Tadi kata tak ada mood, sekarang rajin pula.”</p>\n<p>Khalid ketawa kecil. “Dah kena halau dari kelas, jadi datanglah sini. Takkan nak duduk bawah pokok.”</p>\n<p>Mariam hanya menggeleng, lucu dengan alasan itu.</p>\n<p class=\"dialogue\">“Okay. Let’s finish the work,” kata Khalid, menamatkan perbualan.</p>\n<p>Dia duduk di meja berhampiran dan mula menyiapkan kerja Sejarah.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Rehat tamat.</p>\n<p>Semua pelajar kembali ke kelas masing-masing. Kelas 5 Alfa kini sunyi, menunggu kedatangan Cikgu Bakar.</p>\n<p>Khalid masih tekun menulis. Saiful menjeling.</p>\n<p class=\"dialogue\">“Rajin betul kau hari ni. Baru kena denda terus insaf ke?”</p>\n<p>Khalid pura-pura tak dengar. Dia hanya fokus menyiapkan kerja rumahnya.</p>\n<p class=\"dialogue\">“Eh, Cikgu Bakar datang!” jerit Tinesh dari luar.</p>\n<p>Semua pelajar cepat-cepat berdiri.</p>\n<p class=\"dialogue\">“Assalamualaikum kelas.”</p>\n<p class=\"dialogue\">“Waalaikumussalam, cikgu,” jawab mereka serentak.</p>\n<p>Sesi pengajaran bermula. Suara Cikgu Bakar tenang — jauh berbeza daripada wajah tegasnya di luar kelas. Khalid sempat mencuri masa menyiapkan kerja yang tertinggal.</p>\n<p>Apabila selesai, dia menghela nafas lega. Sekurang-kurangnya, hari ini tak akan ditambah lagi dengan denda baru.</p>\n<p>Cikgu Bakar menutup bukunya lalu berkata,</p>\n<p class=\"dialogue\">“Ingat, sejarah akan berulang kalau kita tak belajar daripadanya. Manusia yang lupa asal-usulnya akan ulang kesilapan sama.”</p>\n<p>Khalid terdiam. Kata-kata itu seperti mempunyai dua makna — satu tentang pelajaran, satu lagi tentang kehidupan sebenar.</p>\n<p>Belum sempat dia menyerahkan buku kerjanya, Saiful menahannya.</p>\n<p class=\"dialogue\">“Tak payah, Khalid. Cikgu Bakar tak pernah kutip kerja rumah pun.”</p>\n<p>Khalid menoleh pantas. “Apa?”</p>\n<p>Saiful ketawa kecil. “Dah lama aku nak cakap. Tapi kau buat tak dengar.”</p>\n<p>Khalid menghela nafas panjang dan menepuk dahinya.</p>\n<p class=\"dialogue\">“Ahh, hari ni memang bukan hari aku.”</p>", "wordCount": 1065}, {"num": 13, "fullTitle": "Bab 13 – Tuduhan", "title": "Tuduhan", "content": "<p class=\"dialogue\">“Cikgu Bakar!”</p>\n<p>Suara lantang seorang pelajar perempuan menahan langkah guru itu di muka pintu. Sebelah kaki Cikgu Bakar sudahpun di luar kelas, namun dia berpaling semula.</p>\n<p class=\"dialogue\">“Kenapa, Yana?”</p>\n<p class=\"dialogue\">“Cikgu, barang Suria… kena curi!”</p>\n<p>Kelas yang tadi riuh rendah tiba-tiba senyap. Suria di sisi Yana menunduk, hampir menangis. Semua mata memandang mereka berdua.</p>\n<p>Cikgu Bakar melangkah masuk semula. “Barang apa yang hilang, Suria?”</p>\n<p class=\"dialogue\">“Telefon bimbit saya, cikgu…” Suaranya tersekat. Air mata bergenang di hujung mata.</p>\n<p>Khalid terpaku. Kata “curi,” itu membuat fikirannya berpusing. Ingatannya melayang ke pagi tadi — ke saat dia sendirian di dalam kelas.</p>\n<p class=\"dialogue\">“Sebelum rehat saya letak dalam beg,” Suria menerangkan, “lepas rehat saya periksa… dah tak ada.”</p>\n<p>Cikgu Bakar berkerut dahi. Beberapa pelajar lain mula memeriksa beg masing-masing.</p>\n<p class=\"dialogue\">“Fuh! Nasib baik tablet aku masih ada,” bisik Amri lega.</p>\n<p>Cikgu Bakar menepuk meja guru kuat-kuat.</p>\n<p class=\"dialogue\">“Saya tanya sekarang — siapa yang masih berada dalam kelas waktu rehat tadi? Cepat mengaku!”</p>\n<p>Kelas kaku. Tiada siapa bersuara. Khalid menunduk, jantungnya berdetak laju. Saiful di sebelahnya menatap dengan wajah risau.</p>\n<p class=\"dialogue\">“Saya ulang sekali lagi,” suara Cikgu Bakar meninggi. “Siapa yang tinggal di kelas waktu rehat? Kalau tak mengaku, saya akan arahkan pengawas periksa semua beg!”</p>\n<p>Khalid menggenggam meja. Dia tahu — hanya dia yang ada waktu itu. Tapi bagaimana dia mahu mengaku tanpa bukti?</p>\n<p>Dia sempat mengerling ke arah Mariam. Gadis itu memandangnya tenang, tapi ada sesuatu dalam renungannya yang sukar ditafsir.</p>\n<p>Khalid menelan liur. Dalam hatinya berkecamuk. Kalau aku mengaku, aku akan disangka pencuri. Tapi kalau aku diam, aku tetap akan disyaki.</p>\n<p>Dia mengangkat tangan perlahan, namun Saiful cepat menahan.</p>\n<p class=\"dialogue\">“Jangan, Khalid,” bisik Saiful. “Belum masanya.”</p>\n<p>Tangan Khalid perlahan-lahan turun semula.</p>\n<p class=\"dialogue\">“Siapa anak buah Cikgu Bakar?” bisiknya pula pada Saiful.</p>\n<p class=\"dialogue\">“Pengawas disiplin. Mereka jaga semua hal sekolah.”</p>\n<p>Khalid tersentak. Pengawas!</p>\n<p>Dia segera teringat dua orang pengawas yang menahannya keluar dari kelas tadi. Kalau mereka yang bertugas menjaga kelas, macam mana kecurian boleh berlaku?</p>\n<p class=\"dialogue\">“Takkanlah…” Khalid berbisik sendiri. Mariam yang masih memerhati dari jauh mengangkat sedikit kening — seolah-olah tahu apa yang bermain dalam fikirannya.</p>\n<p>Cikgu Bakar akhirnya menghela nafas panjang.</p>\n<p class=\"dialogue\">“Baik. Kalau tiada yang mengaku, saya siasat sendiri. Fahmi! Jumpa saya sekejap lagi di bilik guru. Suria, kamu ikut sama.”</p>\n<p class=\"dialogue\">“Baik, cikgu…” Suara Suria lemah.</p>\n<p>Belum sempat mereka melangkah, Yati pula bangun sambil teresak.</p>\n<p class=\"dialogue\">“Cikgu! Barang saya pun hilang…”</p>\n<p>Suasana kelas kembali kecoh.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Tidak lama kemudian, Cikgu Bakar keluar bersama Suria dan Yati, meninggalkan kelas 5 Alfa yang kini dipenuhi bisik-bisik. Setiap pelajar mula mencipta teori sendiri — siapa pencuri sebenar?</p>\n<p>Fahmi, ketua pengawas, segera mengemaskan bukunya lalu bergegas menuju ke bilik Cikgu Bakar.</p>\n<p>Saiful memandang Khalid. “Kau ada dalam kelas waktu rehat tadi, kan?”</p>\n<p>Khalid mengangguk perlahan. “Aku tak buat apa-apa. Tak ada siapa masuk kecuali… dua orang pengawas.”</p>\n<p class=\"dialogue\">“Pengawas? Mustahil! Itu orang kepercayaan sekolah,” Saiful menolak.</p>\n<p class=\"dialogue\">“Tapi kalau bukan aku, bukan pengawas… siapa?”</p>\n<p>Saiful diam sejenak, kemudian bersuara dengan nada serius, “Aku tahu siapa.”</p>\n<p>Khalid menelan liur. “Siapa?”</p>\n<p>Saiful mendekat dan berbisik, “Hantu.”</p>\n<p>PANG!</p>\n<p>Kepala Saiful ditepuk Khalid.</p>\n<p class=\"dialogue\">“Aku serius, kau main-main pula!” Khalid separuh marah.</p>\n<p>Saiful ketawa kecil, menggosok kepalanya. Tapi Khalid tidak ketawa. Dia kelihatan cemas.</p>\n<p class=\"dialogue\">“Aku dalam bahaya, Saiful. Kalau Cikgu Bakar dapat tahu aku satu-satunya yang tinggal dalam kelas, dia akan tuduh aku.”</p>\n<p class=\"dialogue\">“Relaks, Khalid. Kalau kau tak salah, jangan takut.” Saiful menepuk bahunya. “Aku percaya kau.”</p>\n<p>Khalid menarik nafas panjang. “Tapi aku tak boleh duduk diam. Aku kena cari bukti.”</p>\n<p>Dia berpaling ke belakang.</p>\n<p>Tempat duduk Mariam kosong.</p>\n<p class=\"dialogue\">“Mariam…,” gumamnya perlahan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Tuk! Tuk!</p>\n<p>Bunyi ketukan di pintu bilik Cikgu Bakar memecah suasana.</p>\n<p class=\"dialogue\">“Masuk,” arah Cikgu Bakar.</p>\n<p>Fahmi muncul bersama dua orang pengawas — Affendi dan Zamani. Di hadapan meja guru sudah duduk Suria dan Yati, masih murung.</p>\n<p class=\"dialogue\">“Cikgu, ini pengawas yang bertugas di kelas 5 Alfa waktu rehat tadi,” jelas Fahmi.</p>\n<p>Cikgu Bakar menatap mereka lama. “Saya nak tahu. Apa yang kamu nampak semasa bertugas tadi?”</p>\n<p>Affendi menjawab yakin, “Tak ada apa-apa berlaku, cikgu. Semuanya terkawal.”</p>\n<p class=\"dialogue\">“Betul? Kamu pasti?”</p>\n<p>Affendi mengangguk. “Ya, cikgu. Tapi… kenapa cikgu tanya?”</p>\n<p class=\"dialogue\">“Kerana ada kecurian di kelas itu!” suara Cikgu Bakar meninggi. Suria dan Yati tersentak.</p>\n<p>Wajah Affendi dan Zamani bertukar tegang.</p>\n<p>Zamani cepat-cepat bersuara, “Kami tak perasan apa-apa, cikgu. Cuma…”</p>\n<p class=\"dialogue\">“Cuma apa?” potong Cikgu Bakar pantas.</p>\n<p class=\"dialogue\">“Cuma… sebelum kami masuk, ada seorang pelajar lelaki dalam kelas. Kami ingat dia tengah siapkan kerja sekolah, jadi kami biarkan.”</p>\n<p class=\"dialogue\">“Dan siapa pelajar itu?”</p>\n<p>Affendi dan Zamani saling berpandangan. Affendi menelan liur, kemudian berkata perlahan,</p>\n<p class=\"dialogue\">“Khalid, cikgu.”</p>\n<p>Sunyi. Seolah-olah udara di bilik itu membeku.</p>\n<p>Cikgu Bakar tegak berdiri, wajahnya sukar dibaca. Suria dan Yati berpandangan sesama sendiri — terkejut, tidak percaya.</p>\n<p>Tiba-tiba Fahmi melangkah ke depan dan menarik kolar Affendi.</p>\n<p class=\"dialogue\">“Jangan kau berani fitnah kawan aku! Aku kenal dia — dia takkan buat benda bodoh tu!”</p>\n<p class=\"dialogue\">“Fahmi! Cukup!” herdik Cikgu Bakar.</p>\n<p>Fahmi melepaskan kolar itu perlahan-lahan. Nafasnya turun naik menahan marah.</p>\n<p class=\"dialogue\">“Saya… minta maaf, cikgu,” katanya akhirnya.</p>\n<p>Cikgu Bakar memandangnya tajam. “Fahmi, pergi panggil Khalid sekarang. Katakan, ini arahan saya.”</p>\n<p>Suria tiba-tiba bersuara, “Cikgu, saya nak ikut.”</p>\n<p class=\"dialogue\">“Tak perlu. Biar Fahmi sahaja.”</p>\n<p>Fahmi tunduk dan keluar. Di wajahnya terbayang kebimbangan yang dalam. Dia tahu Khalid bukan pencuri — tapi kali ini, semuanya kelihatan menuduh ke arahnya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Langkah Fahmi bergema sepanjang koridor. Setiap tapak kakinya seolah membawa beban.</p>\n<p>Setibanya di kelas 5 Alfa, seluruh pandangan tertumpu kepadanya. Suasana yang tadinya riuh terus sunyi.</p>\n<p>Dia tidak menunggu lama. “Khalid, Cikgu Bakar panggil. Ikut aku sekarang.”</p>\n<p>Khalid menghela nafas panjang. “Baiklah.”</p>\n<p>Dia mengemas buku-bukunya dan berdiri. Saiful menepuk bahunya perlahan — tanda sokongan diam.</p>\n<p class=\"dialogue\">“Bawa semua barang kau,” pesan Fahmi pendek.</p>\n<p>Mereka melangkah keluar. Yana, penolong ketua kelas, sempat bertanya, “Fahmi, Khalid… ke mana?”</p>\n<p class=\"dialogue\">“Ada urusan dengan cikgu,” jawab Fahmi tanpa menoleh.</p>\n<p>Yana hanya memandang, wajahnya penuh tanda tanya dan bimbang.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sepanjang perjalanan, tiada siapa bersuara. Hanya bunyi tapak kaki bergema di koridor yang sunyi.</p>\n<p>Akhirnya Khalid memecah keheningan. “Fahmi… boleh aku tanya sesuatu?”</p>\n<p>Fahmi berpaling. “Apa dia?”</p>\n<p class=\"dialogue\">“Adakah aku bersalah?”</p>\n<p>Fahmi terdiam sejenak, kemudian berkata perlahan,</p>\n<p class=\"dialogue\">“Kau tak akan bersalah selagi tiada bukti. Tapi kalau kau mengaku… hukuman kau akan jadi ringan.”</p>\n<p>Khalid mengangguk perlahan.</p>\n<p>Namun di matanya, ada sesuatu yang lain — tekad.</p>\n<p class=\"dialogue\">“Aku tak akan mengaku sesuatu yang aku tak buat.”</p>\n<p>Mereka terus melangkah menuju bilik Cikgu Bakar —</p>\n<p>dan di koridor yang sama, sepasang mata lain sedang memerhati mereka dari jauh.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Ketika Cikgu Bakar sedang memeriksa laci meja pelajar, pandangan Khalid terarah ke luar pintu kelas. Di koridor, dua orang pengawas sedang berdiri bersandar pada dinding sambil memerhatikan kekecohan di 5 Alfa.</p>\n<p>Edy dan Zamani.</p>\n<p>Edy memeluk tubuh dengan riak wajah yang sukar dibaca—sedikit sinis, seolah-olah sudah menjangkakan drama yang sedang berlaku. Di sebelahnya, Zamani memegang buku log tugas pengawas, namun matanya tidak henti-henti melirik ke arah beg Khalid di hujung kelas.</p>\n<p>Sekali lagi, pesanan Kit di dalam nota rahsianya berdenyut kencang di benak Khalid:</p>\n<p>‘...jangan percaya pada budak pengawas bernama Edy.’</p>\n<p>Khalid mengetap bibir. Kenapa Edy dan Zamani berada di koridor 5 Alfa tepat pada waktu rehat tadi sedangkan jadual rondaan mereka sepatutnya di blok sukan? Firasatnya mengatakan ini bukan kebetulan.</p>", "wordCount": 1161}, {"num": 14, "fullTitle": "Bab 14 – Antara Tuduhan dan Kebenaran", "title": "Antara Tuduhan dan Kebenaran", "content": "<p>Khalid didudukkan di hadapan meja Cikgu Bakar. Fahmi berdiri di sisi, wajahnya tegang. Tiada lagi layanan sebagai rakan; hari ini, Khalid hanyalah seorang pelajar yang disyaki pencuri.</p>\n<p>Di belakangnya, Affendi dan Zamani berdiri tegak — dua saksi utama yang membawa nama Khalid ke sini. Di bahagian kanan, duduk Yati dan Suria, wajah mereka masih muram. Suasana bilik itu sunyi, hanya bunyi jam berdetik perlahan di dinding.</p>\n<p>Khalid menunduk. Dia kecewa — bukan kerana dituduh, tetapi kerana kisah silamnya kini memburu semula dirinya.</p>\n<p class=\"dialogue\">“Khalid,” suara Cikgu Bakar tenang tapi tegas. “Saya nak dengar daripada mulut kamu sendiri. Kamu mengaku mencuri di dalam kelas 5 Alfa waktu rehat tadi?”</p>\n<p>Khalid menggeleng. “Tak, cikgu.”</p>\n<p class=\"dialogue\">“Baik. Kalau begitu, beritahu saya — di mana kamu sorokkan barang yang kamu curi?”</p>\n<p class=\"dialogue\">“Saya tak tahu, cikgu. Saya tak mencuri.”</p>\n<p class=\"dialogue\">“Kamu perlukan duit?”</p>\n<p class=\"dialogue\">“Tak, cikgu.”</p>\n<p class=\"dialogue\">“Kamu pernah ada kes di sekolah lama, betul?”</p>\n<p>Suara itu perlahan tapi menikam. Cikgu Bakar membuka sebuah fail coklat dan membaca isinya. “Mohd Khalid bin Tarmizi. Sekolah Berasrama Penuh. Ditukarkan atas sebab keselamatan. Menarik… mungkin kamu berbahaya di sana?”</p>\n<p>Khalid mendongak. Wajahnya merah menahan marah. “Sudah, cikgu!” suaranya lantang, buat seluruh bilik terkejut.</p>\n<p>Cikgu Bakar tersenyum tipis — senyuman seorang yang tahu dia telah menekan titik rawan pelajarnya.</p>\n<p class=\"dialogue\">“Saya mengaku,” kata Khalid perlahan tapi jelas. “Saya pernah dibuang dari sekolah lama sebab satu kes yang saya sendiri takkan lupakan. Tapi itu bukan bermaksud saya bersalah kali ini, cikgu.”</p>\n<p class=\"dialogue\">“Oh?” Cikgu Bakar mendengus kecil. “Saya ada bukti. Kamu berada di kelas ketika kejadian. Nama kamu ada dalam buku pengawas. Itu sudah cukup.”</p>\n<p class=\"dialogue\">“Ya, saya memang berada di kelas waktu rehat,” Khalid mengaku jujur. “Tapi saya tidak mencuri.”</p>\n<p>Affendi dan Zamani saling berpandangan. Senyum sinis mula terbit di bibir mereka.</p>\n<p class=\"dialogue\">“Dia dah mengaku, cikgu,” potong Affendi. “Dah terang-terang.”</p>\n<p class=\"dialogue\">“Saya mengaku berada di kelas, bukan mencuri!” balas Khalid dengan nada lebih kuat.</p>\n<p class=\"dialogue\">“Kamu tak ada bukti untuk buktikan kamu tak bersalah,” tekan Cikgu Bakar. “Yang ada hanyalah kata-kata kamu.”</p>\n<p>Khalid terdiam. Nafasnya berat. Di dalam hati, dia hanya sempat berbisik — Ya Allah, bantulah hamba-Mu ini…</p>\n<p>Hening. Semua mata menanti. Cikgu Bakar bersilang tangan, bersedia menamatkan sesi siasatan itu dengan keputusan yang sudah pun dirancang dalam fikirannya.</p>\n<p>Tuk! Tuk!</p>\n<p>Bunyi ketukan pintu memecah keheningan. Fahmi menoleh dan segera membuka. Seorang gadis berdiri di ambang pintu, dengan senyuman tenang — Mariam.</p>\n<p class=\"dialogue\">“Mariam?” Fahmi hampir tidak percaya.</p>\n<p>Mariam melangkah masuk dengan berani. “Cikgu Bakar, Khalid tidak bersalah.”</p>\n<p>Kata-katanya bergema di seluruh bilik. Semua terpaku.</p>\n<p class=\"dialogue\">“Apa kamu cakap ni, Mariam? Kamu sepatutnya di kelas, bukan campur urusan saya!”</p>\n<p class=\"dialogue\">“Saya saksinya, cikgu.” Mariam berdiri tegak. “Saya lihat sendiri apa yang berlaku waktu rehat tadi. Khalid tak buat apa-apa.”</p>\n<p>Cikgu Bakar menarik nafas panjang, cuba mengawal marah. “Kau ada bukti?”</p>\n<p class=\"dialogue\">“Saya ke kelas waktu rehat untuk ambil buku Sejarah yang tertinggal. Saya nampak Khalid duduk di mejanya saja. Dia tak sentuh beg sesiapa pun.”</p>\n<p class=\"dialogue\">“Hanya sebab itu kamu yakin dia tak bersalah?”</p>\n<p class=\"dialogue\">“Saya di kelas selama lima minit, cikgu. Dalam tempoh itu, Khalid tak bergerak dari tempat duduknya. Lepas saya keluar ke perpustakaan, lima minit kemudian Khalid juga datang ke sana. Pengawas hanya masuk selepas itu. Jadi, masa sebenar Khalid di kelas cuma lima belas minit — lima minit daripadanya saya ada bersama. Mustahil dia mencuri dalam tempoh sesingkat itu.”</p>\n<p>Cikgu Bakar masih cuba menangkis.</p>\n<p class=\"dialogue\">“Kalau pencuri itu cekap, lima minit pun cukup.”</p>\n<p>Mariam tersenyum nipis. “Khalid pelajar baru, cikgu. Dia tak kenal pun susun atur kelas ini. Kalau ada pencuri, pasti orang yang lebih tahu selok-belok tempat ini. Dan orang itu… mungkin dalam kalangan kita sendiri.”</p>\n<p>Suasana berubah senyap. Cikgu Bakar terdiam, namun egonya masih belum mahu tunduk. “Hujah kamu belum cukup kuat, Mariam.”</p>\n<p>Khalid tiba-tiba bersuara. “Cikgu, saya minta satu peluang.”</p>\n<p class=\"dialogue\">“Peluang?”</p>\n<p class=\"dialogue\">“Ya. Beri saya tempoh dua minggu. Saya akan buktikan saya tak bersalah. Dan saya akan tunjukkan siapa pencuri sebenar.”</p>\n<p>Cikgu Bakar merenung tajam. Akhirnya dia mengangguk perlahan.</p>\n<p class=\"dialogue\">“Dua minggu. Selepas itu, kalau kamu gagal, kamu boleh tinggalkan sekolah ini.”</p>\n<p>Khalid menghela nafas. “Baik, cikgu. Dan jika itu berlaku, anggaplah saya dibuang… sekali lagi.”</p>\n<p>Dia menatap Cikgu Bakar tepat di mata — pandangan yang membuat lelaki separuh abad itu tersentak.</p>\n<p class=\"dialogue\">“Satu lagi, cikgu,” sambung Khalid, suaranya tenang tapi menggetarkan suasana.</p>\n<p class=\"dialogue\">“Pencuri sebenar bukan di luar sana. Dia ada di dalam bilik ini.”</p>\n<p>Kata-kata itu menyambar seperti kilat. Semua orang — Suria, Yati, Affendi, Zamani, Fahmi — berpaling antara satu sama lain. Hanya Mariam yang kekal tenang.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Petang itu, Khalid menuju ke surau sekolah. Langkahnya perlahan, letih. Sesi soal siasat itu terasa seperti peperangan. Setelah membuka kasut, dia masuk ke dalam dan duduk bersandar di dinding. Waktu Zuhur belum tiba.</p>\n<p>Dari jendela, dia memerhati cahaya matahari yang condong. Angin petang menyapa lembut. Fikirannya kembali kepada masa lalu — masa yang cuba dilupakan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Beberapa tahun lalu...</p>\n<p>Jeritan dan bunyi tumbukan bergema di asrama Sekolah Berasrama Penuh. Pelajar berlari-lari ke arah satu bilik — tempat pergaduhan berlaku.</p>\n<p class=\"dialogue\">“Ramli! Ramli!” Khalid menerpa ke dalam bilik dan mendapati sahabat baiknya sudah terkulai, dipukul lima pelajar senior. Darah menitis dari hidung dan bibir Ramli.</p>\n<p>Sekumpulan pelajar senior ketawa sinis. “Hah! Dah lembik pun. Tanam saja terus!”</p>\n<p>Khalid menggenggam penumbuk. Wajahnya tegang. Dia meletakkan Ramli perlahan-lahan ke lantai.</p>\n<p class=\"dialogue\">“Jangan, Khalid…” Ramli berbisik lemah. “Aku tak nak kau dibuang sekolah. Aku dah cukup derita. Jangan ulang kesilapan aku.”</p>\n<p>Khalid memandangnya. “Ini bukan soal aku atau kau, Ramli. Ini soal keadilan.”</p>\n<p>Seorang pelajar besar bernama Osman melangkah ke depan, tersenyum angkuh. “Hero sekolah dah datang rupanya. Mari tunjuk sikit keberanian itu.”</p>\n<p>Khalid tidak menjawab. Penumbuknya sudah digenggam. Sekelip mata, satu tumbukan keras hinggap di perut Osman.</p>\n<p>Ketawa hilang — berganti pekikan. Khalid menyerang tanpa ragu, melepaskan segala marah dan dendam yang lama terpendam. Osman cuba melawan, tapi akhirnya dia berjaya menangkap tangan Khalid dan mengunci dari belakang.</p>\n<p class=\"dialogue\">“Haha, mudah betul kau tumbang,” ejek Osman, menguatkan kunciannya. Khalid menjerit kesakitan.</p>\n<p>Namun tiba-tiba, satu suara garang memecah suasana.</p>\n<p class=\"dialogue\">“Cukup!”</p>\n<p>Cikgu Malik muncul di pintu, dengan rotan di tangan. Semua pelajar terpaku. Osman melepaskan Khalid serta-merta.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid menarik nafas panjang. Lamunan itu berakhir. Dia masih di surau — kini jauh dari asrama lamanya, namun parut kenangan itu tetap hidup.</p>\n<p>Bahunya tiba-tiba ditepuk lembut. Seorang lelaki dewasa beruniform biru berdiri di belakangnya, wajahnya tenang dan bersih.</p>\n<p class=\"dialogue\">“Jom solat,” katanya ringkas.</p>\n<p>Khalid tersenyum, bangun dan melaungkan iqamat. Lelaki itu menjadi imam, dan buat seketika, semua keresahan Khalid hilang dalam sujudnya.</p>", "wordCount": 1058}, {"num": 15, "fullTitle": "Bab 15 – Hari yang Panjang", "title": "Hari yang Panjang", "content": "<p>Genap seminggu Khalid menjejakkan kaki di sekolah baharunya. Banyak perkara telah dilaluinya dalam tempoh singkat itu — daripada pelajar baharu yang asing, kini menjadi tumpuan akibat satu tuduhan yang belum terjawab. Namun pagi ini, dia hadir dengan semangat yang baharu: semangat untuk membuktikan siapa dirinya yang sebenar.</p>\n<p>Hari Ahad. Seperti biasa, perhimpunan mingguan diadakan di dewan sekolah. Semua pelajar diwajibkan hadir lebih awal; sesiapa yang lewat akan berdepan tindakan disiplin. Khalid sudah berada di dalam dewan bersama rakan-rakannya. Haba dari tubuh ratusan pelajar membuatkan suasana terasa bahang, namun mereka tetap cuba mencari keselesaan masing-masing.</p>\n<p>Para pengawas sibuk mengatur barisan kelas. Ada yang patuh, ada yang acuh tak acuh. Dari jauh, Khalid melihat Cikgu Bakar sedang menjerit memanggil pelajar yang masih berjalan santai. Suara lantangnya bergaung hingga ke dalam dewan.</p>\n<p>Tidak lama kemudian, pengetua dan barisan penolong kanan masuk. Lagu Negaraku dan lagu negeri bergema, dinyanyikan penuh semangat oleh ribuan suara. Khalid turut berdiri tegak, namun fikirannya melayang seketika.</p>\n<p class=\"dialogue\">“Mengapa manusia lebih menghormati lagu Negaraku berbanding seruan azan?”</p>\n<p>Soalan itu berputar di fikirannya. Dia menggeleng perlahan, tiada jawapan.</p>\n<p>Selesai nyanyian, Fahmi — ketua pelajar — memimpin bacaan doa. Pelajar yang datang lewat disusun dalam beberapa barisan di luar dewan, diawasi oleh Cikgu Bakar yang kini sudah pun kelihatan letih di kerusinya.</p>\n<p>Cikgu Zamin, guru bertugas minggu lalu, dipanggil untuk menyampaikan laporan mingguan. Khalid mendengar tanpa banyak reaksi, sehingga satu ayat daripada Cikgu Zamin membuatkan jantungnya berdegup kencang.</p>\n<p class=\"dialogue\">“Dan yang lebih merisaukan pihak sekolah,” kata Cikgu Zamin, “minggu lepas dua kes kecurian telah dilaporkan. Seorang pelajar telah ditahan oleh Cikgu Bakar untuk siasatan dan kini dalam pemerhatian pihak sekolah.”</p>\n<p>Khalid tersentak. Saiful yang duduk di hadapan berpaling spontan memandangnya. Pandangan mereka bertaut — Saiful ingin tahu, Khalid hanya membalas dengan renungan tenang yang cuba menyorokkan keresahan.</p>\n<p class=\"dialogue\">“Pelajar tersebut kini dalam pemerhatian...”</p>\n<p>Adakah yang dimaksudkan itu dirinya?</p>\n<p class=\"dialogue\">“Apa yang dah berlaku minggu lepas?” bisik Saiful agak kuat, membuat beberapa pelajar berhampiran menoleh. Pengawas menegur mereka supaya diam.</p>\n<p class=\"dialogue\">“Aku cerita nanti,” bisik Khalid perlahan, cuba menenangkan Saiful.</p>\n<p>Cikgu Zamin menamatkan laporannya dengan nada tegas,</p>\n<p class=\"dialogue\">“Pelajar yang terlibat berisiko dibuang sekolah, malah boleh disiasat di bawah akta kesalahan juvenil.”</p>\n<p>Beberapa pelajar berbisik sesama sendiri, ada yang terkejut, ada yang acuh tak acuh. Bagi Khalid, kata-kata itu seperti amaran — masa semakin suntuk untuknya membersihkan nama.</p>\n<p>Selepas itu, giliran pengetua pula berucap. Bunyi keluhan perlahan kedengaran dari merata arah. Khalid tertanya-tanya mengapa ramai resah sebaik pengetua mengambil mikrofon.</p>\n<p>Lima belas minit berlalu, suasana di dalam dewan mula berubah. Ada yang menukar posisi duduk, ada yang cuba mencuri masa untuk tidur. Di luar dewan, pelajar yang berdiri mula duduk curi-curi. Cikgu Bakar — yang sepatutnya mengawal — sudah pun tertidur di kerusinya.</p>\n<p>Lima belas minit berikutnya terasa seperti satu jam. Satu demi satu pelajar meminta izin ke tandas — helah klasik untuk melepaskan diri daripada lenguh. Khalid kini mengerti mengapa semua mengeluh setiap kali pengetua memulakan ucapan; bukan kerana isi ucapannya, tapi kerana panjangnya.</p>\n<p class=\"dialogue\">“Pengetua memang macam ni ke?” bisik Khalid kepada Saiful di hadapannya.</p>\n<p>Tiada sahutan, hanya dengkuran halus.</p>\n<p class=\"dialogue\">“Dah tidur rupanya budak ni,” keluh Khalid perlahan.</p>\n<p>Akhirnya, selepas hampir sejam, pengetua menamatkan ucapannya. Tepukan kecil bergema — sebahagian tanda setia, sebahagian lagi tanda lega. Mereka diarahkan berdiri, menyanyikan lagu sekolah sebelum perhimpunan bersurai.</p>\n<p>Khalid tidak menyanyi. Dia hanya mendengar dan menghayati bait-bait liriknya, cuba memahami roh sekolah yang baru seminggu menjadi dunianya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas perhimpunan, pelajar-pelajar berpusu-pusu kembali ke kelas. Semangat mereka seperti diperbaharui walau hanya selepas dua hari bercuti. Di kelas 5 Alfa, suasana agak berbeza. Tiada yang bersenda seperti biasa. Tiada bualan tentang perlawanan bola semalam. Khalid melangkah masuk perlahan.</p>\n<p class=\"dialogue\">“Kenapa sunyi semacam?” fikirnya.</p>\n<p>Biasanya, rakan-rakan akan menyapanya sebaik dia tiba. Hari ini, tiada satu pun pandangan mata yang menyambutnya. Mereka kelihatan menghindar.</p>\n<p>Takkan sebab kejadian hari itu…</p>\n<p>Khalid menarik kerusi, duduk di tempatnya. Di sebelah, Saiful tekun menyiapkan kerja sekolah yang entah bila dimulakannya. Wajahnya serius, tidak seperti biasa.</p>\n<p class=\"dialogue\">“Saiful, aku nak tanya sikit boleh?”</p>\n<p class=\"dialogue\">“Apa?” jawabnya tanpa menoleh.</p>\n<p class=\"dialogue\">“Aku rasa lain hari ni. Semua orang macam jauhkan diri dari aku.”</p>\n<p class=\"dialogue\">“Kau dah siap kerja rumah Kimia?” soal Saiful, menukar topik.</p>\n<p class=\"dialogue\">“Dah.”</p>\n<p class=\"dialogue\">“Bak.”</p>\n<p>Khalid menyerahkan buku tanpa banyak soal. Dalam sekelip mata, wajah Saiful berubah ceria.</p>\n<p class=\"dialogue\">“Terima kasih, Khalid. Jasa kau akan ku kenang!” katanya bersungguh-sungguh sambil menyalin laju.</p>\n<p>Haziq yang duduk di belakang tiba-tiba menyelitkan kepala antara mereka.</p>\n<p class=\"dialogue\">“Eh, aku dengar kau dah siap, Khalid? Boleh pinjam?”</p>\n<p class=\"dialogue\">“Nak sangat, tunggu lepas aku!” celah Saiful cepat-cepat.</p>\n<p class=\"dialogue\">“Okay, okay. Lepas kau, aku.”</p>\n<p>Khalid hanya mampu menggeleng sambil tersenyum. “Ini rupanya sebabnya semua baik-baik saja dengan aku,” bisiknya dalam hati.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sepuluh minit kemudian, Cikgu Fatimah tiba. Seorang guru veteran, berusia lewat 40-an, terkenal dengan ketepatan masa dan ketegasan. Setiap pelajar mengenali langkah kasut tumitnya dari jauh.</p>\n<p>Sebaik beliau melangkah masuk, seluruh kelas berdiri. Salam diberi, doa dibaca, lalu mereka duduk semula.</p>\n<p class=\"dialogue\">“Semua dah siap kerja rumah minggu lepas?” soalan pertama itu membuat dada ramai pelajar bergetar.</p>\n<p>Sebahagian menjawab “sudah cikgu!” dengan yakin, sebahagian lagi hanya tersenyum pasrah.</p>\n<p>Saiful dan Haziq, sebaliknya, tampak luar biasa ceria. Mereka tahu kali ini mereka terselamat — hasil kerja keras Khalid.</p>\n<p class=\"dialogue\">“Saiful, kamu dah siapkan kerja rumah?”</p>\n<p class=\"dialogue\">“Sudah cikgu! Awal-awal lagi saya buat. Dapat saja tugasan, terus saya siapkan.”</p>\n<p>Cikgu Fatimah tersenyum puas.</p>\n<p class=\"dialogue\">“Bagus, Saiful. Tak sangka kamu dah berubah.”</p>\n<p class=\"dialogue\">“Semua manusia mampu berubah, cikgu.” katanya bangga, disambut tawa kecil rakan-rakan.</p>\n<p>Khalid di sebelah menahan sabar. “Kalau aku tak hormat guru, dah lama aku baling pemadam,” desisnya dalam hati.</p>\n<p>Cikgu Fatimah berpindah ke barisan belakang.</p>\n<p class=\"dialogue\">“Haziq, kamu pun siap?”</p>\n<p class=\"dialogue\">“Err… yup. Dah siap, cikgu.” jawabnya dengan senyum gugup sambil menunjukkan buku latihan.</p>\n<p>Cikgu Fatimah memerhati lama sebelum mengangguk.</p>\n<p class=\"dialogue\">“Baiklah. Oleh sebab dua murid kesayangan cikgu ni siap kerja rumah, cikgu anggap semua pun siap.”</p>\n<p>Satu kelas menghela nafas lega serentak. Hari ini mereka terselamat. Malah, buat pertama kalinya dalam sejarah, Cikgu Fatimah tersenyum sepanjang sesi pengajaran.</p>\n<p>Sebelum keluar, beliau sempat memberi pengumuman,</p>\n<p class=\"dialogue\">“Minggu depan kita akan buat eksperimen. Sediakan semua peralatan seperti dalam senarai yang saya beri.”</p>\n<p>Sorakan kecil bergema. Pelajar-pelajar teruja — akhirnya kelas Kimia akan jadi lebih hidup daripada sekadar nota dan teori.</p>\n<p>Selepas guru keluar, Saiful dan Haziq segera berpaling ke arah Khalid.</p>\n<p class=\"dialogue\">“Terima kasih, Khalid!” kata mereka hampir serentak.</p>\n<p class=\"dialogue\">“Rehat nanti kami belanja kau makan,” tambah Haziq.</p>\n<p class=\"dialogue\">“Kami?” Saiful menyoal.</p>\n<p class=\"dialogue\">“Kita.”</p>\n<p>Kedua-duanya ketawa. Khalid hanya menggeleng sambil tersenyum kecil. Hari ini, walau masih ada mata yang memerhati, sekurang-kurangnya dia tahu — masih ada kawan yang tidak meninggalkannya.</p>", "wordCount": 1069}, {"num": 16, "fullTitle": "Bab 16 – Langkah di Lorong Sunyi", "title": "Langkah di Lorong Sunyi", "content": "<p>Kelas 5 Alfa kembali riuh dengan kemunculan guru Matematik Tambahan mereka — Cikgu Rahim.</p>\n<p>Guru muda itu bukan sahaja disegani oleh pelajar, malah disenangi oleh semua guru kerana sikapnya yang tenang dan caranya mengajar yang mudah difahami. Baru berusia tiga puluh tahun dan masih bujang, Cikgu Rahim sering menjadi perhatian guru-guru perempuan di sekolah itu.</p>\n<p>Subjek Matematik Tambahan dianggap “pembunuh markah,” oleh kebanyakan pelajar, tetapi di tangan Cikgu Rahim, subjek itu menjadi sesuatu yang dinantikan. Setiap tahun, keputusan pelajarnya meningkat — dan kadar kegagalan semakin berkurang.</p>\n<p class=\"dialogue\">“Baiklah semua,” Cikgu Rahim memulakan bicara dengan senyuman kecil.</p>\n<p class=\"dialogue\">“Saya ada satu tugasan untuk kamu semua siapkan dalam masa seminggu.”</p>\n<p class=\"dialogue\">“Wah, tugasan apa, cikgu?” tanya Suria dengan wajah teruja. Pelajar-pelajar lain turut menumpukan perhatian.</p>\n<p class=\"dialogue\">“Kali ini tugasan berkumpulan. Empat orang satu kumpulan. Minggu depan, kamu semua akan bentangkan hasil tugasan kamu di kelas.”</p>\n<p>Suasana kelas menjadi gamat dengan suara pelajar yang mula merancang kumpulan masing-masing.</p>\n<p class=\"dialogue\">“Cikgu, kali ni ada ganjaran lagi tak? Macam dulu?” jerit Haziq dari belakang kelas.</p>\n<p class=\"dialogue\">“Jangan risau,” jawab Cikgu Rahim sambil ketawa kecil. “Kumpulan terbaik cikgu belanja makan KFC!”</p>\n<p>Sorakan gembira bergema. Kelas 5 Alfa kembali hidup.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Bagi Khalid, waktu rehat tidak lebih daripada saat untuk menenangkan diri.</p>\n<p>Dia bukan jenis pelajar yang suka berlama-lama di kafeteria. Cukuplah sekeping roti dan sebotol air mineral dari rumah.</p>\n<p>Sejak kes kecurian minggu lalu, hatinya tidak pernah benar-benar tenang. Dia tahu, masa yang diberi oleh Cikgu Bakar semakin suntuk. Dua minggu — itulah tempoh untuk membuktikan dia tidak bersalah.</p>\n<p>Dia duduk di bawah pokok rendang berhampiran padang sekolah, menikmati tiupan angin dan pandangan hijau yang mendamaikan. Roti di tangan disuapkan perlahan-lahan.</p>\n<p class=\"dialogue\">“Hijau ini tenang,” bisiknya. “Tapi manusia selalu suka merosakkannya.”</p>\n<p>Selesai menjamah makanan, Khalid termenung seketika. Hatinya bergetar — ada rasa tidak sedap yang sukar dijelaskan. Entah mengapa, dia terdorong untuk ke kelas semula, walaupun waktu rehat masih berbaki.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Langkahnya perlahan menuju ke blok kelas Tingkatan Lima. Sejak insiden kecurian, pihak sekolah memperketatkan kawalan; setiap kelas akan dijaga dua pengawas sepanjang waktu rehat.</p>\n<p>Namun, sebaik dia menjenguk ke dalam kelas 5 Alfa, ruang itu kosong.</p>\n<p>Tidak ada seorang pun pengawas.</p>\n<p>Khalid berdiri di muka pintu, memerhati sekeliling. Sunyi. Tidak seperti minggu lepas, ketika dia diarahkan keluar oleh dua orang pengawas yang kini disyaki menyembunyikan sesuatu.</p>\n<p class=\"dialogue\">“Mungkin hari ni mereka bertugas di blok lain,” bisik Khalid, menyedapkan hatinya sendiri.</p>\n<p>Dia tidak mahu menuduh tanpa bukti. Namun rasa ragu itu semakin menebal.</p>\n<p>Setelah puas meneliti keadaan kelas, Khalid segera beredar. Dia tidak mahu dilihat berada di dalam kelas pada waktu rehat — cukup sekali dituduh tanpa bukti, dia tidak mahu mengulanginya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Perjalanan menuju ke perpustakaan hanya beberapa bilik jauhnya dari kelasnya. Kedua-duanya terletak di aras yang sama, cuma di hujung blok yang berbeza.</p>\n<p>Namun di pertengahan koridor itu, sesuatu membuatkan langkahnya terhenti.</p>\n<p>Dia berasa diperhatikan.</p>\n<p>Naluri itu kuat — dan apabila dia menoleh, dua pasang mata sedang menatapnya dari blok hadapan, di aras yang lebih tinggi. Dua lelaki berpakaian seragam pengawas, sedang berbisik sambil ketawa kecil. Pandangan mereka tidak lepas daripadanya.</p>\n<p>Ya, itulah dua pengawas yang menjaga kelasnya hari kejadian.</p>\n<p>Jantung Khalid berdegup pantas. Dia berpaling ke hadapan, berpura-pura tidak menyedari. Tapi rasa gementar itu kembali.</p>\n<p class=\"dialogue\">“Apa lagi yang mereka rancang kali ni…”</p>\n<p>Tanpa menoleh lagi, Khalid mempercepatkan langkahnya ke perpustakaan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sebaik pintu kaca perpustakaan ditolak, udara sejuk dari pendingin hawa menyambutnya.</p>\n<p>Namun sebelum sempat dia menarik nafas lega, satu suara lembut menegurnya dari arah tepi.</p>\n<p class=\"dialogue\">“Kau takkan mampu selesaikan masalah ni seorang diri.”</p>\n<p>Khalid berpaling pantas. Suara itu dikenali — Mariam.</p>\n<p>Gadis misteri itu duduk di salah satu meja berhampiran pintu, separuh wajahnya terlindung di sebalik buku yang dibaca.</p>\n<p class=\"dialogue\">“Apa maksud kau, Mariam?” Khalid menghampiri perlahan.</p>\n<p class=\"dialogue\">“Apa yang kau nampak sebenarnya? Dan apa maksud kau aku tak mampu selesaikannya seorang diri?”</p>\n<p>Mariam menutup buku itu sedikit, menampakkan separuh wajahnya.</p>\n<p class=\"dialogue\">“Aku nampak apa yang kau nampak, Khalid. Dan aku tahu siapa yang kau syaki.”</p>\n<p>Khalid terpaku. Sebelum sempat dia bertanya lanjut, loceng menandakan waktu rehat tamat. Mariam hanya tersenyum nipis, menutup bukunya dan berjalan keluar. Khalid mengekori dari belakang — hatinya penuh tanda tanya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Kembali ke kelas, Khalid cuba menenangkan dirinya.</p>\n<p>Apa yang dimaksudkan Mariam? Bagaimana dia tahu tentang perkara itu?</p>\n<p>Guru belum tiba. Khalid mengambil peluang mendekati Fahmi, yang sedang duduk di barisan hadapan, tekun meneliti buku teks.</p>\n<p class=\"dialogue\">“Fahmi, boleh aku tanya sikit?”</p>\n<p class=\"dialogue\">“Boleh. Duduklah.”</p>\n<p>Khalid menarik kerusi kosong di sebelahnya dan duduk.</p>\n<p class=\"dialogue\">“Ini tentang hal pengawas sekolah ni. Aku cuma nak tahu cara mereka bertugas.”</p>\n<p class=\"dialogue\">“Kenapa, nak jadi pengawas ke?” Fahmi bergurau kecil.</p>\n<p class=\"dialogue\">“Taklah. Cuma nak tahu. Aku kan baru di sini.”</p>\n<p>Fahmi mengangguk.</p>\n<p class=\"dialogue\">“Macam biasa saja. Waktu pagi di tapak perhimpunan, waktu rehat kami jaga kelas. Kadang-kadang ada operasi khas, barulah semua dikumpulkan.”</p>\n<p class=\"dialogue\">“Oh. Jadi pengawas memang ada jadual tugas setiap hari?”</p>\n<p class=\"dialogue\">“Ya. Kami bergilir-gilir ikut blok. Contohnya hari ni aku di Tingkatan Empat, esok di Tingkatan Lima, lusa mungkin di makmal. Semua ikut giliran.”</p>\n<p>Khalid mendengar dengan penuh perhatian.</p>\n<p class=\"dialogue\">“Kau ada salinan jadual tu?”</p>\n<p class=\"dialogue\">“Ada.”</p>\n<p>Tanpa syak wasangka, Fahmi menghulurkan sekeping kertas jadual tugasan pengawas kepada Khalid.</p>\n<p class=\"dialogue\">“Nah, tengoklah. Nama semua ada kat situ.”</p>\n<p>Khalid menerima dengan hati berdebar. Matanya segera menyapu barisan nama dan tarikh — mencari dua nama yang menghantui fikirannya sejak seminggu lalu.</p>\n<p class=\"dialogue\">“Terima kasih, Fahmi. Pinjam sekejap ya.”</p>\n<p>Dia kembali ke mejanya, membuka buku catatan, dan mula menyalin maklumat yang penting.</p>\n<p>Nama. Tarikh. Blok bertugas.</p>\n<p>Setiap huruf yang dicatatnya seolah-olah satu langkah lebih dekat ke kebenaran.</p>", "wordCount": 901}, {"num": 17, "fullTitle": "Bab 17 – Jejak di Kafeteria", "title": "Jejak di Kafeteria", "content": "<p>KRING! KRING!</p>\n<p>Loceng sekolah dibunyikan menandakan tamatnya sesi persekolahan pada hari itu. Bunyi itu jugalah yang sentiasa dinanti-nantikan oleh para pelajar—tanda kebebasan sementara daripada buku dan kerja sekolah. Setelah memberikan beberapa tugasan untuk disiapkan, Cikgu Fauziah menamatkan kelasnya pada hari itu. Serta-merta suasana menjadi hingar-bingar dengan bunyi kerusi diseret dan suara pelajar yang sibuk mengemas beg masing-masing.</p>\n<p class=\"dialogue\">“Khalid, jom petang ni kita buat study group,” ajak Saiful dengan semangat membara.</p>\n<p>Khalid yang sedang menyusun buku-bukunya di atas meja mengangkat kepala, sedikit hairan dengan pelawaan tiba-tiba itu.</p>\n<p class=\"dialogue\">“Kenapa pula ni, tiba-tiba nak study group?”</p>\n<p>Saiful tersengih. “Ala, kau lupakah? Kita satu kumpulan tugasan Add Math tadi. Cikgu Rahim suruh siapkan dalam masa seminggu itu.”</p>\n<p class=\"dialogue\">“Oh, iya ya. Aku hampir lupa,” balas Khalid lalu tersenyum kecil. Dia menolak kerusinya perlahan-lahan dan berdiri. “Aku okey saja. Ajaklah Haziq dengan Fahmi sekali, mereka pun satu kumpulan kita juga.”</p>\n<p class=\"dialogue\">“A’ah, iya tak ya juga.” Saiful segera bergerak ke arah pintu kelas, menghampiri Haziq dan Fahmi yang sudah hampir melangkah keluar.</p>\n<p class=\"dialogue\">“Haziq! Fahmi! Tunggu kejap!” jeritnya sambil melambaikan tangan.</p>\n<p class=\"dialogue\">“Ha, ada apa ni Saiful? Beriya semacam,” sahut Fahmi, melangkah perlahan menunggu Saiful menghampirinya.</p>\n<p class=\"dialogue\">“Jom buat study group petang ni dekat kafe,” ajak Saiful tanpa banyak mukadimah. Haziq dan Fahmi berpandangan sesama sendiri, agak terkejut dengan pelawaan itu.</p>\n<p class=\"dialogue\">“Kita kan baru dapat tugasan Add Math tadi. Baik kita buat terus sementara masih semangat!” katanya dengan penuh keyakinan, sambil tersenyum lebar.</p>\n<p class=\"dialogue\">“Semangat betul kau hari ni,” ujar Haziq ketawa kecil. “Awal lagi la. Tugasan tu due minggu depan.”</p>\n<p>Fahmi hanya mengangguk, bersetuju dengan kata-kata Haziq. Namun Saiful masih dengan wajah beria.</p>\n<p class=\"dialogue\">“Aku ni kalau bab hadiah, terus bersemangat! Mana tahu, Cikgu Rahim nak belanja KFC lagi macam dulu tu. Haha.”</p>\n<p>Fahmi tergelak kecil. “Kau ini, kalau bab makan, nombor satu!”</p>\n<p>Khalid yang mendengar hanya tersenyum, kemudian mencelah, “Sebenarnya bagus juga cadangan Saiful itu. Kalau kita siapkan awal, taklah tergesa-gesa nanti.”</p>\n<p>Fahmi mengangguk perlahan. “Betul juga kata kau. Baiklah, aku setuju.”</p>\n<p class=\"dialogue\">“Oleh sebab korang semua dah setuju, aku pun on lah!” sahut Haziq sambil mengangkat tangan tanda setuju.</p>\n<p class=\"dialogue\">“Alright! Let’s go!” Saiful menepuk tangan, gembira kerana rancangannya berjaya. Mereka mula bergerak keluar bersama.</p>\n<p>Namun langkah mereka terhenti apabila Khalid bersuara, “Sebentar.”</p>\n<p class=\"dialogue\">“Kenapa?” soal Saiful pelik.</p>\n<p class=\"dialogue\">“Kita ke surau dulu. Solat Zohor berjemaah,” kata Khalid tenang.</p>\n<p class=\"dialogue\">“Surau?” serentak Haziq dan Saiful bersuara.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid mengimamkan solat Zohor berjemaah bersama-sama Saiful, Haziq dan Fahmi. Selesai solat, mereka beristighfar seketika, masing-masing dalam keheningan. Khalid mengangkat kepala, lalu tersenyum puas—akhirnya dia berjaya mengajak rakan-rakannya bersama menunaikan solat.</p>\n<p class=\"dialogue\">“Saiful,” Khalid menegur perlahan ketika mereka melangkah keluar dari surau.</p>\n<p class=\"dialogue\">“Boleh aku tanya sesuatu?”</p>\n<p class=\"dialogue\">“Tanyalah,” balas Saiful ringkas sambil membetulkan tali kasutnya.</p>\n<p class=\"dialogue\">“Selalunya kau cepat betul balik sekolah. Tapi hari ni santai pula. Kenapa?”</p>\n<p>Saiful menarik nafas panjang sebelum menjawab. “Sebelum ini, aku datang sekolah naik kereta. Ada pemandu peribadi ayah aku yang uruskan. Tapi baru-baru ini, aku minta nak datang sendiri.”</p>\n<p class=\"dialogue\">“Kenapa?” tanya Khalid ingin tahu.</p>\n<p class=\"dialogue\">“Aku nak rasa bebas. Tak nak asyik bergantung. Mula-mula ayah aku tak setuju, tapi lepas aku beritahu sebab aku nak belajar berdikari, dia bagi. Siap hadiahkan aku motosikal lagi.”</p>\n<p class=\"dialogue\">“Wah, untunglah,” balas Khalid jujur. Walaupun terdetik sedikit rasa cemburu, tapi dia turut tumpang gembira.</p>\n<p class=\"dialogue\">“Dengan motosikal tu lah aku pergi sekolah. Jadi tak perlu nak tergesa-gesa balik lagi. Sebab tu aku ajak kau lepak tadi.”</p>\n<p class=\"dialogue\">“Oh, baru aku faham.” Khalid mengangguk kecil.</p>\n<p>Saiful tersenyum sambil menatap wajah Khalid. “Kau tahu Khalid, aku rasa tenang betul lepas solat tadi. Rasa damai. Macam semua beban hilang.”</p>\n<p class=\"dialogue\">“Iya, Saiful. Solat tu penghubung kita dengan Allah. Bila kita dekat dengan-Nya, Dia akan bagi ketenangan yang orang lain tak dapat.” Khalid menjawab lembut.</p>\n<p>Saiful memandang Khalid lama, kemudian berkata dengan nada penuh harapan, “Khalid, aku ada satu permintaan. Sejak aku kenal kau… aku rasa kau orang yang boleh tolong aku.”</p>\n<p class=\"dialogue\">“Insya-Allah, selagi aku mampu. Apa dia?”</p>\n<p class=\"dialogue\">“Bantu aku kenal Islam dengan lebih dekat.”</p>\n<p>Khalid terdiam seketika, kemudian mengangguk perlahan. “Insya-Allah, Saiful.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sementara itu, Haziq dan Fahmi sudah pun berada di kafeteria. Mereka mengambil tempat di meja hujung berhampiran tingkap besar.</p>\n<p class=\"dialogue\">“Mana Saiful dengan Khalid ni? Lama betul,” rungut Haziq sambil menongkat dagu.</p>\n<p class=\"dialogue\">“Sabarlah,” balas Fahmi, seperti biasa tenang. “Mungkin mereka tengah sembang lagi dekat surau tu.”</p>\n<p class=\"dialogue\">“Entah-entah balik dulu,” gurau Haziq sambil ketawa kecil.</p>\n<p>Fahmi menggeleng kepala. “Takkanlah sampai macam itu.”</p>\n<p>Tidak lama kemudian, dua sahabat yang dinanti muncul di pintu kafe dengan wajah tersenyum. “Minta maaf lewat sikit,” kata Saiful sambil menarik kerusi. “Ada diskusi penting dekat surau tadi. Hehe.”</p>\n<p class=\"dialogue\">“Diskusi la sangat,” perli Haziq. “Cepatlah makan, sebelum kafe tutup. Nanti kau lapar, aku pula kena dengar kau merungut.”</p>\n<p class=\"dialogue\">“Haha, tahu pun aku kuat makan,” balas Saiful sambil ketawa kecil.</p>\n<p class=\"dialogue\">“Khalid, jom beli makanan. Aku dah tak tahan tengok orang makan,” katanya kemudian.</p>\n<p class=\"dialogue\">“Jom,” jawab Khalid, tersenyum.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sewaktu Khalid sedang beratur di kaunter makanan, telinganya tiba-tiba menangkap satu perbualan dari dua pelajar lelaki di hadapannya.</p>\n<p class=\"dialogue\">“Masyuk juga hari ni. Kau nak buat lagi tak esok?”</p>\n<p class=\"dialogue\">“Eh, mestilah nak. Tapi jangan cakap kuat-kuat, nanti orang lain dengar.”</p>\n<p class=\"dialogue\">“Ops, sorry.”</p>\n<p>Khalid memerhati mereka dengan teliti. Wajah mereka seperti pernah dilihat. Setelah diamati, baru dia sedar—dua lelaki itu ialah pengawas yang pernah menjaga bloknya minggu lepas. Degupan jantungnya bertambah laju.</p>\n<p class=\"dialogue\">“Edy… dan Zamani?” bisiknya perlahan. “Apa yang mereka buat sampai kena rahsiakan?”</p>\n<p>Dia cuba mendengar dengan lebih jelas, tetapi suara mereka makin perlahan. Khalid hanya sempat menangkap beberapa patah perkataan yang semakin menimbulkan rasa curiga dalam dirinya.</p>\n<p>Tiba-tiba bahunya ditepuk kuat dari belakang. “Hoi, apa yang kau termenung itu?” tegur Saiful. “Makanan kau dah siap itu!”</p>\n<p>Khalid tersentak. Mak cik kafe menjeling tajam. “Dah kenapa berdiri macam patung itu? Nah, RM4.”</p>\n<p>Khalid cepat-cepat menghulurkan duit dan memohon maaf sebelum berlalu dari situ. Dia menoleh sekilas—dua pengawas itu sudah pun pergi.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p class=\"dialogue\">“Kau okay tak, Khalid?” tanya Saiful sebaik Khalid duduk semula di meja mereka.</p>\n<p class=\"dialogue\">“Tak ada apa-apa. Mengelamun sekejap saja,” jawab Khalid, cuba menyembunyikan keresahan dalam suaranya.</p>\n<p>Sementara itu, Fahmi dan Haziq sibuk menyiapkan draf tugasan mereka. Khalid mengeluarkan telefonnya lalu membuka galeri. Gambar yang diambilnya pagi tadi—jadual bertugas pengawas—dibuka dan diperhatikan dengan teliti.</p>\n<p class=\"dialogue\">“Hmm… betul. Edy dan Zamani bertugas waktu rehat hari kejadian tu,” bisiknya perlahan. Dia mula menyusun sesuatu di mindanya.</p>\n<p class=\"dialogue\">“Kawan-kawan,” Khalid memecah keheningan. “Boleh aku tanya sikit?”</p>\n<p class=\"dialogue\">“Silakan,” jawab Haziq.</p>\n<p class=\"dialogue\">“Korang kenal tak Edy dengan Zamani?” tanya Khalid sambil berpura-pura tenang.</p>\n<p class=\"dialogue\">“Oh, mereka tu budak kelas Gama,” jawab Fahmi. “Kenapa tanya?”</p>\n<p class=\"dialogue\">“Tak ada apa. Saja nak tahu,” balas Khalid, senyum nipis.</p>\n<p>Haziq tiba-tiba bersuara, “Eh, dua orang itu baru lalu tadi dekat sini.”</p>\n<p>Khalid mengangguk perlahan. Tepat seperti dugaannya. Dua nama itu kini tersimpan kemas dalam fikirannya.</p>\n<p>Sedikit demi sedikit, potongan teka-teki mula bersambung. Dia tahu, dua pengawas itulah kunci kepada kebenaran yang selama ini dia cari.</p>\n<p>Namun untuk membuktikannya—dia perlu berhati-hati.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Saiful yang duduk di hadapannya tiba-tiba bersuara, “Mak aih, lajunya aku habiskan makanan ini!”</p>\n<p>Khalid ketawa kecil. “Kau ini memang tak pernah berubah, Saiful.”</p>\n<p class=\"dialogue\">“Eh, lapar weh. Tenaga nak belajar kena cukup!” balas Saiful sambil mengangkat pinggannya yang licin.</p>\n<p>Khalid tersenyum. Dalam diam, fikirannya masih berputar pada satu perkara.</p>\n<p>Nama itu—Edy dan Zamani—terus bergema di kepalanya.</p>\n<p>Dan di sebalik tawa kecil mereka di kafeteria, hati Khalid sudah pun mula menjejak kebenaran yang semakin hampir terbongkar.</p>", "wordCount": 1194}, {"num": 18, "fullTitle": "Bab 18 – Jejak di Antara Dua Blok", "title": "Jejak di Antara Dua Blok", "content": "<p>Pagi Isnin yang cerah. Seperti biasa, seluruh warga sekolah berkumpul di dewan terbuka untuk perhimpunan mingguan. Suasana kelihatan sama seperti minggu-minggu sebelumnya — pelajar berbaris mengikut kelas, guru-guru berdiri di hadapan pentas, dan Cikgu Bakar pula dengan wajah tegasnya memerhatikan setiap pelajar yang lewat.</p>\n<p>Khalid tiba lebih awal hari ini. Begitu juga dengan Saiful yang tampak bersemangat, walaupun tugas sekolahnya masih banyak yang belum disiapkan.</p>\n<p class=\"dialogue\">“Di sini terdapat satu pengumuman,” suara lantang guru bertugas menggema dari mikrofon di pentas utama.</p>\n<p>Para pelajar mula memberi perhatian.</p>\n<p class=\"dialogue\">“Pihak sekolah akan mengadakan sesi pemilihan pemain untuk pasukan bola sepak sekolah pada petang ini, jam lima. Kepada yang berminat, sila hadir ke padang.”</p>\n<p>Sorakan kecil kedengaran dari kalangan pelajar lelaki. Wajah-wajah teruja terpancar di sana sini. Saiful menepuk-nepuk bahu Khalid.</p>\n<p class=\"dialogue\">“Wah, aku nak join! Kau tak nak ke, Khalid?” katanya dengan mata bersinar-sinar.</p>\n<p>Khalid tersenyum kecil. “Aku rasa tak kot. Aku ada hal lain nak selesaikan hari ini.”</p>\n<p>Saiful mendengus kecil. “Rugi la. Aku nak cuba nasib kali ini.”</p>\n<p>Khalid hanya mengangguk, membiarkan Saiful dengan keterujaannya sendiri. Di dalam benaknya, sesuatu yang lebih berat sedang bermain.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Hari ini genap seminggu Khalid bersekolah di situ. Dalam masa yang singkat itu, terlalu banyak perkara yang ditemuinya — kawan, rahsia, dan juga tanda-tanda pelik yang sukar dijelaskan.</p>\n<p>Seperti kebiasaannya, selepas sarapan ringan di kafeteria, Khalid akan menghabiskan waktu paginya sama ada di surau atau perpustakaan. Tetapi pagi ini berbeza. Dia mempunyai misi — sesuatu yang sudah lama disiapkan dalam diam.</p>\n<p>Khalid mengeluarkan telefon bimbitnya dan membuka galeri. Satu gambar dipaparkan di skrin — jadual bertugas pengawas sekolah. Bibirnya mengukir senyuman kecil.</p>\n<p class=\"dialogue\">“Edy… Zamani… kita tengok siapa sebenarnya kau orang.”</p>\n<p>Dia menutup semula telefonnya, lalu berjalan ke arah blok Tingkatan 4, seperti yang tertera pada jadual. Langkahnya perlahan, berhati-hati, seolah-olah setiap hentakan kasutnya membawa misi yang besar.</p>\n<p>Blok Tingkatan 4 sedikit terasing daripada blok-blok lain, namun berhampiran dengan pejabat pentadbiran. Khalid tiba di hadapan kelas 4 Beta, dan ternyata tekaan itu tepat — Edy dan Zamani memang berada di sana, bertugas seperti biasa.</p>\n<p>Ketika dia melalui hadapan kelas itu, secara tidak sengaja bahunya terlanggar Edy.</p>\n<p class=\"dialogue\">“Oh, sorry! Aku minta maaf ya,” ucap Khalid pantas. Dia tidak menunjukkan sebarang rasa marah, sebaliknya melemparkan senyuman nipis yang penuh makna sebelum berlalu.</p>\n<p>Edy terpinga-pinga. Tidak lama kemudian, dia berpaling kepada Zamani dan membisikkan sesuatu. Keduanya kemudian sama-sama memandang ke arah Khalid yang semakin jauh meninggalkan kelas itu.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p class=\"dialogue\">“Terima kasih, Mariam,” ucap Khalid kemudian, sewaktu duduk di meja perpustakaan, berhadapan dengan gadis misteri itu.</p>\n<p>Mariam masih tekun membaca buku di tangannya, tanpa mengangkat wajah. “Sama-sama,” balasnya perlahan.</p>\n<p class=\"dialogue\">“Idea kau memang bernas. Tak sangka aku tak pernah terfikir benda ni sebelum ni,” kata Khalid, masih kagum.</p>\n<p class=\"dialogue\">“Ilham datang dari Allah, bukan dari aku,” balas Mariam tenang, matanya masih tertumpu pada halaman buku. “Dah lekatkan benda tu?”</p>\n<p class=\"dialogue\">“Dah. Alhamdulillah. Sekarang aku cuma tunggu hasilnya.” Khalid menarik nafas panjang, menenangkan diri.</p>\n<p class=\"dialogue\">“Think it by yourself,” jawab Mariam pendek, sebelum kembali menatap bacaannya.</p>\n<p>Khalid tersenyum kecil, lalu bangun menuju ke meja lain yang lebih tersorok. Di situ terdapat rak buku bertajuk Kajian Sains dan Angkasa. Dia menarik keluar sebuah buku tebal bertajuk Apakah Itu Asteroid? dan membukanya sekadar pura-pura membaca.</p>\n<p>Sebenarnya, buku itu hanyalah pelindung kepada sesuatu yang lebih penting.</p>\n<p>Dia mengeluarkan telefon bimbitnya perlahan-lahan dan membuka satu aplikasi khas. Paparannya menyerupai radar, dengan beberapa koordinat kecil di sekelilingnya. Satu titik merah kecil berkelip di tengah-tengah — bergerak perlahan-lahan dari satu kawasan ke satu kawasan lain.</p>\n<p class=\"dialogue\">“Masih di blok Tingkatan 4,” bisik Khalid sambil memerhati dengan fokus.</p>\n<p>Dia menekan butang ‘record’. Paparan di skrin kini merakam setiap pergerakan titik merah itu — tanda penjejak yang diselitkan olehnya pagi tadi.</p>\n<p>Selesai semua tetapan, Khalid menyimpan semula telefonnya ke dalam poket dan tersandar dengan senyuman puas. “Kali ini, aku pasti dapat tahu kebenaran.”</p>\n<p>Dia menutup buku, lalu benar-benar membaca beberapa halaman pertama. Asteroid... bisiknya dalam hati. “Ciptaan Tuhan yang indah pun boleh membawa kemusnahan. Macam manusia juga.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Apabila loceng berbunyi, semua pelajar kembali ke kelas masing-masing.</p>\n<p>Kelas 5 Alfa seperti biasa — riuh, padat dengan pelbagai suara. Di bahagian depan, sekumpulan pelajar perempuan sibuk bergosip, diketuai oleh Suria. Di tengah pula, ada kumpulan pelajar rajin yang sedang menyemak nota. Di belakang, kelompok lelaki sedang berbahas isu semasa dengan gaya seperti “sidang parlimen”, diketuai Saiful.</p>\n<p>Khalid turut duduk bersama mereka, walaupun fikirannya jauh melayang.</p>\n<p>Namun keriuhan itu tiba-tiba terhenti apabila satu jeritan kedengaran dari kelas sebelah, 5 Beta.</p>\n<p>Jeritan kuat, diikuti dengan suara tangisan dan kecoh pelajar-pelajar di sana. Semua mata beralih ke arah dinding pemisah antara dua kelas itu.</p>\n<p class=\"dialogue\">“Apa yang dah berlaku?” tanya Fahmi yang pantas bangun dan berlari ke pintu.</p>\n<p>Haziq turut menyusul. “Weh, ada kes apa pula ini?”</p>\n<p>Beberapa pelajar lain menyertai mereka, termasuk Suria dan kumpulannya. Dalam sekelip mata, koridor antara dua kelas itu dipenuhi pelajar yang ingin tahu.</p>\n<p class=\"dialogue\">“Barang kena curi!” jerit seorang pelajar dari dalam kelas 5 Beta.</p>\n<p>Kata-kata itu berulang-ulang, berpindah dari mulut ke mulut. Suasana bertukar gamat.</p>\n<p>Khalid kaku di tempat duduknya. Saiful memandangnya tajam — pandangan yang cukup dikenalinya. Pandangan itu mengingatkannya kepada kejadian minggu lalu, apabila dia sendiri dituduh.</p>\n<p>Khalid segera menarik Saiful ke sisi. “Jom, ikut aku kejap.”</p>\n<p>Mereka kembali ke dalam kelas yang kini hampir kosong. Hanya tinggal beberapa pelajar yang tidak ambil peduli dengan kekecohan di luar.</p>\n<p>Khalid memandang ke arah meja Mariam — kosong. “Dia pun keluar rupanya,” bisik Khalid sendiri.</p>\n<p>Saiful akhirnya bersuara, “Apa yang kau pandang itu, Khalid? Kenapa bawa aku masuk sini?”</p>\n<p>Khalid menoleh. “Aku nak bincang sikit.”</p>\n<p class=\"dialogue\">“Bincang apa?” nada Saiful sedikit tinggi.</p>\n<p class=\"dialogue\">“Shh…” Khalid cepat-cepat menutup mulutnya dengan tangan. “Bertenang dulu. Aku explain satu-satu.”</p>\n<p>Setelah Saiful mula reda, Khalid menarik nafas panjang. “Aku tahu apa kau fikir. Tapi aku tak terlibat langsung dengan kecurian minggu lepas.”</p>\n<p>Saiful memandangnya, menunggu sambungan.</p>\n<p class=\"dialogue\">“Waktu kejadian tu, ada dua orang lagi dalam kelas selain aku. Edy dan Zamani.”</p>\n<p class=\"dialogue\">“Hah?” Saiful terkejut. “Kau ni, Khalid. Mereka tu pengawas. Mana mungkin—”</p>\n<p class=\"dialogue\">“Ya, aku tahu. Tapi tak mustahil, kan?” balas Khalid, nadanya perlahan tapi tegas.</p>\n<p>Saiful menggeleng. “Khalid, kau tak boleh tuduh orang sesuka hati. Pengawas itu orang yang beramanah. Aku kenal mereka lama. Jangan rosakkan nama orang tanpa bukti.”</p>\n<p>Khalid terdiam. Kata-kata Saiful menikam terus ke hatinya. Tuduhan tanpa bukti — dia sendiri sudah merasainya.</p>\n<p class=\"dialogue\">“Baiklah,” katanya perlahan. “Mungkin aku terlalu cepat buat kesimpulan.”</p>\n<p>Saiful menepuk bahunya. “Relaks lah. Aku tahu kau bukan pencuri. Aku percaya kau. Tapi jangan biar syak wasangka kawal fikiran kau.”</p>\n<p>Khalid mengangguk perlahan. “Terima kasih, Saiful.”</p>\n<p>Saiful bangun, melangkah ke luar kelas. “Aku nak tengok keadaan dekat 5 Beta.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Beberapa minit selepas Saiful keluar, telefon Khalid tiba-tiba bergetar di poket.</p>\n<p class=\"dialogue\">“Celcom!” keluhnya kecil, menyangka mesej iklan. Tapi beberapa saat kemudian, satu idea melintas.</p>\n<p>Dia segera membuka aplikasi penjejak tadi. Paparan radar muncul semula — dan bulatan merah kecil itu
