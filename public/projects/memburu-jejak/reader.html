kini sudah berubah lokasi.</p>\n<p>Bukan lagi di blok Tingkatan 4.</p>\n<p>Ia kini berada di kelas 5 Beta.</p>\n<p>Khalid ternganga kecil. “Tak mungkin…”</p>\n<p>Setahunya, Edy bukan pelajar kelas itu. Jadi, apa yang dia buat di sana — tepat pada masa berlakunya satu lagi kes kecurian?</p>\n<p>Dia menatal semula rakaman yang disimpan. Titik merah itu kelihatan bergerak meninggalkan Blok Tingkatan 4 beberapa minit sebelum loceng tamat rehat, menuju ke Blok Tingkatan 5. Pergerakannya dari hujung kiri blok, melalui deretan kelas — termasuk 5 Beta dan 5 Alfa — sebelum berhenti di pertengahan tingkat atas.</p>\n<p>Khalid menatap skrin itu lama, debaran makin terasa.</p>\n<p class=\"dialogue\">“Kalau betul ini Edy…”</p>\n<p>Dia berhenti seketika. Nafasnya terasa berat.</p>\n<p class=\"dialogue\">“…maknanya dia memang ada kaitan.”</p>\n<p>Namun Khalid tahu — sangkaan tanpa bukti tidak cukup. Dia perlukan kepastian.</p>\n<p>Dan untuk itu, dia tahu siapa yang perlu dia temui semula.</p>\n<p>Mariam.</p>", "wordCount": 1270}, {"num": 19, "fullTitle": "Bab 19 – Tirai Surau Lama", "title": "Tirai Surau Lama", "content": "<p>Matahari mula condong ke ufuk barat. Suasana sekolah perlahan-lahan sepi apabila pelajar-pelajar beransur pulang ke rumah masing-masing. Di sebalik kesibukan itu, surau sekolah masih berdiri tenang di hujung blok lama — bangunan sederhana besar yang sedikit terasing dari bangunan utama. Di sinilah Khalid bersama tiga sahabatnya — Saiful, Haziq dan Fahmi — mengambil keputusan untuk menunaikan solat Asar berjemaah sebelum pulang.</p>\n<p>Khalid seperti biasa menjadi imam, manakala tiga sahabatnya menjadi makmum. Selesai memberi salam, mereka sama-sama berzikir seketika. Haziq dan Fahmi meminta diri terlebih dahulu kerana ada tugasan lain petang itu. Tinggallah Khalid dan Saiful berdua di ruang surau yang mula disimbahi cahaya jingga senja.</p>\n<p>Khalid menarik nafas panjang, memandang sekeliling. Tikar sejadahnya sudah agak lusuh, dan beberapa bahagian dinding menampakkan kesan cat yang mengelupas. Namun di sebalik keusangan itu, surau tersebut punya aura yang sukar dijelaskan — tenang, tetapi entah mengapa terasa seperti sedang diperhatikan.</p>\n<p class=\"dialogue\">“Saiful,” Khalid bersuara perlahan, memecah kesunyian yang tinggal. “Kenapa ya, aku perasan… tak ramai pelajar datang solat di surau ni? Padahal dekat saja dengan kelas.”</p>\n<p>Saiful yang sedang melipat sejadah berhenti seketika. Dia memandang Khalid, kemudian tersenyum hambar.</p>\n<p class=\"dialogue\">“Memang begitu sejak dulu, Khalid. Surau ni… ada sejarahnya.”</p>\n<p>Khalid mengerutkan dahi. “Sejarah? Maksud kau?”</p>\n<p>Saiful menarik nafas dalam. “Aku pun tak pasti sangat, tapi… orang kata dulu pernah ada kejadian. Seorang pelajar dibunuh di surau ini. Katanya waktu itu tengah malam, pelajar itu datang nak qiamulail, tapi... dia tak pernah balik ke asrama.”</p>\n<p>Khalid terpempan. “Dibunuh?”</p>\n<p>Saiful mengangguk perlahan. “Mayat dia dijumpai keesokan paginya… dekat bilik wuduk belakang sana.” Dia menunjuk ke arah pintu kecil di bahagian kanan surau, yang separuh terkuak menampakkan ruang wuduk yang samar-samar gelap. “Lepas kejadian itu, ramai pelajar — termasuk cikgu — dah tak berani solat di sini waktu malam. Lama surau ini terbiar, sampai beberapa tahun. Cikgu Zul sahaja yang rajin datang bersihkan tempat ini.”</p>\n<p>Khalid memandang ke arah bilik wuduk yang disebutkan Saiful. Seolah-olah ada bayang hitam melintas di celah pintu, tapi mungkin hanya pantulan cahaya senja yang masuk melalui tingkap. Dia tidak menegur, hanya menunduk sambil beristighfar perlahan.</p>\n<p class=\"dialogue\">“Sekolah ni dah lama sebenarnya, Khalid,” sambung Saiful perlahan. “Bangunan surau ni antara yang pertama dibina. Tapi sejak peristiwa tu, ia seakan kehilangan roh. Walaupun macam tu, masih ada juga pelajar yang datang... macam kita ni.”</p>\n<p>Khalid tersenyum tipis. “Kalau semua takut, siapa lagi nak hidupkan rumah Allah ini, Saiful? Kadang-kadang tempat yang paling kita takut, di situlah ujian sebenar untuk kita hadapi.”</p>\n<p>Saiful mengangguk perlahan. Ada sesuatu dalam kata-kata Khalid yang membuatnya berfikir lama.</p>\n<p>Setelah selesai mengemaskan surau, mereka keluar beriringan. Langit petang semakin jingga. Dari arah padang sekolah, kedengaran suara pelajar-pelajar lelaki yang sedang berlatih bola sepak. Khalid menoleh, melihat sekumpulan pelajar berlari-lari memanaskan badan dengan semangat.</p>\n<p class=\"dialogue\">“Eh, itu Haziq dengan Fahmi kan?” Khalid menunjuk ke arah dua figura yang jelas dikenali di tengah padang.</p>\n<p class=\"dialogue\">“Ha’ah,” jawab Saiful. “Mereka berdua tu antara pemain utama pasukan bola sepak sekolah kita. Tak hairan la kalau mereka sibuk setiap petang.”</p>\n<p>Khalid memerhati dari jauh. Di tengah padang, Cikgu Zul — jurulatih pasukan — sedang meniup wisel dan memberi arahan tegas kepada pemain-pemainnya. Tubuhnya tegap, wajahnya garang tetapi berkarisma.</p>\n<p class=\"dialogue\">“Cikgu Zul ni memang tegas orangnya,” kata Saiful lagi. “Tapi sebab dia lah, pasukan sekolah kita berjaya menang banyak kejohanan. Lima orang pemain sekolah kita pernah wakil negeri, tahu tak? Dan dua daripada mereka tu... Haziq dan Fahmi sendiri.”</p>\n<p>Khalid tersenyum bangga. “Patutlah mereka selalu bercerita tentang latihan. Aku tak sangka mereka hebat sampai macam itu.”</p>\n<p>Saiful ketawa kecil. “Haa, tapi bukan mereka saja. Dua orang lagi yang wakil negeri itu pun kau kenal...”</p>\n<p>Khalid berpaling. “Siapa?”</p>\n<p>Saiful memandang ke padang dan menuding ke arah dua pemain yang baru sahaja menyertai latihan. “Itu, Edy dan Zamani.”</p>\n<p>Nama-nama itu serta-merta menyalakan kembali sesuatu dalam fikiran Khalid. Nafasnya terhenti seketika.</p>\n<p class=\"dialogue\">“Edy... dan Zamani?” ulangnya perlahan.</p>\n<p class=\"dialogue\">“Ha’ah. Diorang bukan setakat pengawas, tapi juga pemain utama pasukan bola. Dengar cerita, Cikgu Zul sayang betul dekat mereka tu. Apa-apa aktiviti sekolah pun, mesti dua orang tu dapat keutamaan.”</p>\n<p>Khalid berdiam. Matanya kini hanya tertumpu pada dua figura itu di padang. Edy dan Zamani sedang berbual dengan Cikgu Zul, wajah mereka tenang — seolah-olah tiada apa yang disembunyikan. Namun bagi Khalid, semua itu seperti lakonan.</p>\n<p>Dalam hatinya, sebuah kesimpulan mula terbentuk. Mungkin... di sinilah semuanya bermula.</p>\n<p class=\"dialogue\">“Saiful,” Khalid bersuara tenang tapi matanya masih menatap padang. “Kalau aku nak sertai pasukan bola sepak sekolah... boleh tak?”</p>\n<p>Saiful menoleh kepadanya dengan wajah terkejut. “Kau? Nak masuk pasukan bola?”</p>\n<p>Khalid mengangguk perlahan. “Ya. Aku rasa... dah sampai masa aku kenal mereka dengan lebih dekat.”</p>\n<p>Saiful tersenyum sambil menepuk bahu Khalid. “Wah, ini baru semangat! Tapi kalau nak join, kena jumpa Cikgu Zul dulu. Dia takkan pilih sembarangan orang.”</p>\n<p>Khalid tersenyum kembali, tapi dalam senyum itu ada tekad yang mendalam.</p>\n<p class=\"dialogue\">“Insya-Allah, Saiful. Aku bukan sekadar nak main bola...” katanya perlahan, pandangannya masih menghala ke arah Edy dan Zamani di tengah padang.</p>\n<p class=\"dialogue\">“...Aku nak cari kebenaran.”</p>\n<p>Khalid merenung ke arah sudut bilik wuduk dan stor lama yang berkunci mangga besar. Fikirannya mula menyusun kepingan fakta.</p>\n<p>Jika seluruh warga sekolah takut mendekati surau lama ini kerana kisah seram dan khabar angin pembunuhan zaman dahulu... bukankah tempat ini menjadi tempat paling selamat di seluruh sekolah untuk menyembunyikan sesuatu?</p>\n<p>Tiada siapa yang akan berani memeriksa atau meronda di sini pada waktu lewat petang. Kecuali mereka yang memegang kunci rasmi stor—Edy dan Zamani, dengan kebenaran Cikgu Muzammil.</p>", "wordCount": 896}, {"num": 20, "fullTitle": "Bab 20 – Gema Rahsia Silam", "title": "Gema Rahsia Silam", "content": "<p>Pagi itu, suasana di sekolah benar-benar berbeza daripada kebiasaannya. Wajah-wajah para pelajar tampak cemas dan bingung. Perhimpunan mingguan yang selalunya diselubungi dengan gelak tawa dan suara riuh kini digantikan dengan suasana suram yang tegang.</p>\n<p>Udara di dewan terbuka terasa tebal dan menekan. Barisan pelajar berdiri rapat mengikut kelas, namun bisikan-bisikan kecil berterbangan di celah-celah ruang seperti arus bawah yang bergolak.</p>\n<p>Di atas pentas, Cikgu Bakar berdiri tegak dengan wajah yang kelihatan tegang. Cermin matanya melorot sedikit ke hujung hidung, tangannya menggenggam mikrofon dengan kuat.</p>\n<p class=\"dialogue\">“Saya mahu semua pelajar beri perhatian!”</p>\n<p>Suaranya bergema di seluruh dewan, disambut keheningan yang tiba-tiba menelan setiap bisikan.</p>\n<p class=\"dialogue\">“Saya ingin memaklumkan bahawa semalam, sebanyak lima buah kelas telah diceroboh oleh individu yang masih belum dikenal pasti. Beberapa barangan peribadi pelajar juga dilaporkan hilang.”</p>\n<p>Seolah-olah satu letupan sunyi berlaku.</p>\n<p>Bisikan yang mati tadi kembali bergema — kali ini lebih kuat. Ada yang berpandangan, ada yang menutup mulut dengan tangan, dan ada juga yang menunduk, bimbang kalau-kalau nama mereka dikaitkan dengan kejadian itu.</p>\n<p class=\"dialogue\">“Cikgu harap kamu semua bertenang,” sambung Cikgu Bakar dengan nada garang yang cuba menenangkan keadaan. “Setakat ini, tiada pelajar yang disyaki. Tetapi pihak disiplin akan menjalankan siasatan serta-merta,” Saiful menoleh ke arah Khalid, mengangkat keningnya tanda hairan.</p>\n<p class=\"dialogue\">“Lima kelas?” bisik Saiful perlahan. “Diorang ni betul-betul berani. Tengah-tengah sekolah macam ni pun boleh ceroboh?”</p>\n<p>Khalid menunduk perlahan, berfikir. Lima kelas diceroboh?</p>\n<p>Khalid tidak menjawab. Dia hanya menghela nafas panjang, pandangannya dilemparkan ke arah pentas, namun fikirannya jauh melayang. Dadanya terasa berat. Mungkinkah ini berkaitan dengan kes kecurian minggu lalu… atau sesuatu yang lebih besar daripada itu?</p>\n<p>Suasana bertambah gamat apabila Cikgu Bakar menambah, “Sehubungan dengan itu, satu pemeriksaan mengejut akan diadakan selepas perhimpunan ini. Semua pelajar diminta kekal di kelas masing-masing sementara pemeriksaan dilakukan oleh pasukan pengawas dan guru yang bertugas.”</p>\n<p>Pengumuman itu membuatkan degupan jantungnya bertambah laju. Apa yang berlaku semalam mungkin ada kaitan dengan pergerakan yang dikesannya melalui aplikasi di telefonnya — dan nama Edy kembali berputar di kepalanya.</p>\n<p class=\"dialogue\">“Spot-check?” suara kecil dari belakang kedengaran. Serentak pelajar-pelajar saling berpandangan. Ada yang kelihatan risau, ada juga yang sudah mula menyembunyikan barang-barang terlarang di dalam beg.</p>\n<p>Dia sempat menjeling ke arah Fahmi yang berdiri tidak jauh darinya. Fahmi kelihatan tenang, namun matanya menyorot tajam ke arah pentas — jelas dia juga sedang mencerna sesuatu.</p>\n<p>Selepas lagu sekolah dinyanyikan dan doa dibacakan, pelajar-pelajar mula berselerak meninggalkan dewan. Tapi hari itu, tiada yang berbual santai seperti biasa. Masing-masing bergegas ke kelas dengan wajah tegang.</p>\n<p>Khalid menunggu hingga Fahmi menghampirinya. “Fahmi!” panggilnya perlahan, tapi nada suaranya mendesak.</p>\n<p>Fahmi menoleh. “Kenapa?”</p>\n<p class=\"dialogue\">“Boleh aku minta tolong sikit?” Khalid memandang sekeliling sebelum mendekat. Suaranya direndahkan. “Aku ada satu gajet — alat kecil yang aku pinjam daripada Kamarul. Aku letak dalam laci meja aku.”</p>\n<p>Fahmi mengangkat kening. “Gajet apa?”</p>\n<p>Khalid menelan air liur. “Bukan benda salah. Tapi kalau cikgu nampak masa spot-check nanti, aku kena soal siasat panjang. Aku tak nak benda ini disalah tafsir.”</p>\n<p class=\"dialogue\">“Jadi, kau nak aku…?”</p>\n<p class=\"dialogue\">“Tolong selamatkan. Simpan dulu sebelum pengawas datang ke kelas aku,” bisiknya pantas.</p>\n<p>Fahmi yang dah memahami maksud itu lalu mengangguk kecil tanda setuju. “Baiklah. Tapi cepat. Aku dengar spot-check akan mula dalam sepuluh minit.” Dia tahu benar apa yang dimaksudkan Khalid — gajet kecil yang Khalid pinjamkan daripada Kamarul untuk projek peribadinya perlu diselamatkan sebelum disedari pengawas lain.</p>\n<p>Khalid sempat mengucapkan terima kasih sebelum mereka berpisah. Fahmi bergerak pantas ke arah koridor, manakala Khalid berpura-pura menuju ke tandas bagi mengelak perhatian guru disiplin.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas perhimpunan, suasana sekolah berubah menjadi luar biasa. Beberapa orang pelajar dipanggil ke pejabat pengetua, termasuk Haziq dan dua orang pelajar lain yang dikatakan berada di sekitar kawasan blok Tingkatan 4 sehari sebelumnya. Khalid dan Saiful hanya mampu memerhati dari jauh ketika mereka dibawa pergi oleh guru disiplin.</p>\n<p class=\"dialogue\">“Risaulah aku tengok suasana hari ni, Khalid,” kata Saiful perlahan.</p>\n<p class=\"dialogue\">“Macam sekolah ni kena darurat.” Khalid mengangguk. “Memang lain. Aku rasa kes ni dah jadi besar. Lebih besar daripada yang kita sangka.”</p>\n<p>Tidak lama kemudian, berita tersebar bahawa pelajar-pelajar yang dipanggil itu telah dibebaskan selepas memberi keterangan kepada pengetua. Namun, bayangan keresahan masih tidak hilang dari wajah mereka.</p>\n<p>Di sekitar blok, kelihatan pengawas-pengawas berlegar-legar seperti pengawal keselamatan, mengawasi setiap pergerakan pelajar lain. Perpustakaan ditutup untuk sementara waktu. Guru-guru diarahkan untuk memastikan setiap pelajar berada di dalam kelas sepanjang masa pembelajaran. Sekolah yang sebelum ini ceria kini bertukar menjadi seperti zon larangan.</p>\n<p>Apabila waktu rehat tiba, kelas 5 Alfa sunyi sepi. Tiada pelajar yang berani keluar tanpa izin. Kebanyakan mereka hanya duduk di tempat masing-masing, menunduk sambil menunggu loceng berbunyi semula.</p>\n<p>Bunyi kasut pengawas bergema di koridor, berselang-seli dengan arahan keras daripada guru disiplin:</p>\n<p class=\"dialogue\">“Periksa semua beg! Jangan ada satu pun yang tertinggal!”</p>\n<p>Khalid hanya duduk di kerusinya, berpura-pura menulis di buku latihan. Kelas 5 Alfa kini hampir kosong — separuh pelajarnya diarahkan membantu pemeriksaan di blok lain. Hanya tinggal beberapa orang, termasuk dirinya, Saiful, dan Suria yang duduk diam di bahagian hadapan.</p>\n<p>Dari luar, kedengaran bunyi meja diseret, beg diselongkar, dan pintu-pintu ditutup dengan kuat. Sekolah itu, yang biasanya riuh, kini bagaikan ruang siasat yang menyesakkan dada.</p>\n<p>Tiba-tiba, pintu kelas terbuka perlahan. Seorang wanita bertelekung labuh melangkah masuk dengan langkah tenang. Khalid serta-merta mengenali sosok itu.</p>\n<p class=\"dialogue\">“Assalamualaikum, semua.”</p>\n<p>Suara lembut itu milik Ustazah Rahimah, guru Pendidikan Islam mereka.</p>\n<p class=\"dialogue\">“Waalaikumussalam, ustazah,” sahut beberapa pelajar yang masih di dalam.</p>\n<p class=\"dialogue\">“Cikgu-cikgu lain sedang bantu pihak disiplin. Jadi hari ini ustazah takkan mengajar, cuma nak pantau kamu sementara menunggu kelas seterusnya,” katanya sambil tersenyum.</p>\n<p>Khalid memandangnya sejenak, kemudian tunduk menulis sesuatu — tetapi fikirannya sebenarnya sedang bergolak. Sejak malam tadi, bayangan surau lama masih bermain di fikiran. Cerita Saiful tentang pembunuhan di situ tak pernah hilang daripada mindanya. Dan kini, dengan kejadian pencerobohan yang tiba-tiba berlaku, segalanya terasa seperti saling berkait.</p>\n<p>Beberapa pelajar mula menarik nafas lega. Ada yang mula berbual perlahan. Khalid, bagaimanapun, mengambil peluang untuk duduk lebih dekat dengan meja ustazah.</p>\n<p>Dia mengangkat tangan perlahan. “Ustazah… boleh saya tanya sikit?”</p>\n<p>Ustazah Rahimah berpaling dengan lembut. “Boleh, Khalid. Apa dia?”</p>\n<p class=\"dialogue\">“Saya nak tanya sikit... ustazah dah lama mengajar di sekolah ni, kan?” Ustazah mengangguk. “Hampir tujuh tahun. Kenapa tanya begitu?”</p>\n<p>Khalid berdiri di sisi meja guru. Suaranya direndahkan, nadanya berhati-hati. “Saya cuma tertanya-tanya,” Khalid menyusun ayat dengan berhati-hati, “adakah sebelum ini pernah berlaku kejadian seperti sekarang ini? Macam... pencerobohan, kecurian dan semua ini?”</p>\n<p>Ustazah Rahimah diam sejenak, kemudian mengangguk perlahan. “Pernah. Tapi dah lama dulu… waktu ustazah baru ditempatkan di sini. Masa itu pun sekolah gempar juga — beberapa bilik guru dan makmal sains dipecah masuk. Tapi akhirnya… semuanya disenyapkan begitu saja.”</p>\n<p>Khalid mengangguk perlahan, cuba memahami. “Maksud ustazah, ini bukan kali pertama?”</p>\n<p class=\"dialogue\">“Ya. Bukan kali pertama,” jawabnya pendek.</p>\n<p>Khalid menggigit bibir, kemudian memberanikan diri bertanya lagi. Khalid mengangguk perlahan, berfikir sejenak sebelum menambah satu lagi soalan — kali ini lebih berani. “Kalau begitu... betulkah, ustazah, yang dulu pernah ada pembunuhan di surau sekolah ini?”</p>\n<p>Suasana kelas tiba-tiba senyap. Ustazah Rahimah yang tadi tenang, kini tampak sedikit berubah riak wajahnya. Dia menunduk, kedua-dua tangannya menggenggam jari dengan perlahan di atas meja.</p>\n<p>Pertanyaan itu membuatkan senyuman di wajah Ustazah Rahimah perlahan-lahan hilang.</p>\n<p>Matanya tidak lagi memandang Khalid — sebaliknya ke arah luar jendela.</p>\n<p>Ustazah tidak segera membalas. Matanya memandang jauh ke luar tingkap kelas, ke arah padang yang sunyi tanpa pelajar. Seketika, suasana di dalam kelas terasa seolah-olah masa berhenti. Hanya bunyi kipas siling yang berputar perlahan menjadi latar.</p>\n<p>Ustazah Rahimah menutup bukunya perlahan.</p>\n<p class=\"dialogue\">“Khalid,” suaranya perlahan, “ada perkara yang lebih baik kalau kita tak ungkit lagi.”</p>\n<p>Khalid terpempan. “Maksud ustazah?”</p>\n<p>Ustazah menghela nafas, kemudian memandang Khalid dengan pandangan yang sukar ditafsir — antara kasihan dan amaran.</p>\n<p class=\"dialogue\">“Kadang-kadang... bukan semua rahsia di sekolah ini sesuai untuk didengar oleh semua orang. Ada yang kalau kita bongkar, hanya akan menambah luka lama.”</p>\n<p>Khalid terdiam. Dia tahu ustazah tidak akan menjawab lebih jauh daripada itu. “Maafkan saya, ustazah. Saya cuma... ingin tahu.” Nada suaranya perlahan.</p>\n<p class=\"dialogue\">“Jangan cari apa yang sepatutnya kekal tertutup, Khalid.”</p>\n<p>Ustazah Rahimah menatap wajah Khalid, kemudian tersenyum semula, kali ini dengan wajah yang tenang tapi sayu. “Kadang-kadang, ingin tahu itu boleh membawa kita ke tempat yang kita sendiri tak bersedia untuk pergi, Khalid.”</p>\n<p>Khalid mengangguk perlahan. Kata-kata itu berputar di kepalanya — sebuah amaran lembut, tapi penuh tanda tanya</p>\n<p>Khalid kembali ke tempat duduknya. Tangannya menggenggam buku di atas meja, tetapi matanya tertumpu ke luar jendela. Dari kejauhan, surau lama berdiri sepi di hujung blok, diselimuti bayang pokok besar yang melindunginya daripada cahaya pagi.</p>\n<p>Angin berhembus perlahan, menyapa wajahnya seolah-olah membawa pesan dari arah sana.</p>\n<p class=\"dialogue\">“Jangan cari apa yang sepatutnya kekal tertutup…”</p>\n<p>Kata-kata itu berulang dalam fikirannya, bergema seperti suara yang lahir dari hati sendiri.</p>\n<p>Namun, jauh di sudut hati Khalid… dia tahu.</p>\n<p>Dia tidak akan berhenti mencari.</p>", "wordCount": 1438}, {"num": 21, "fullTitle": "Bab 21 – Tawa di Sebalik Disiplin", "title": "Tawa di Sebalik Disiplin", "content": "<p>Sejak pengumuman pagi tadi, suasana sekolah tidak lagi sama.</p>\n<p>Langkah para pelajar yang biasanya riuh kini berubah perlahan dan berhati-hati, seolah-olah setiap sudut bangunan sedang memerhati mereka. Blok demi blok dijaga ketat oleh pengawas dan guru disiplin. Tiada siapa dibenarkan berkeliaran sesuka hati.</p>\n<p>Bagi pelajar-pelajar sekolah itu, hari ini terasa seperti hari selepas bencana — sunyi, berat, dan penuh rasa curiga.</p>\n<p>Beberapa pelajar yang dibawa berjumpa dengan pengetua sebelum ini, termasuk Haziq dan dua lagi pelajar dari kelas bersebelahan, akhirnya dibebaskan selepas memberi keterangan. Namun, khabar angin terus berlegar. Ada yang mengatakan mereka disoal siasat berjam-jam. Ada pula yang menambah cerita bahawa kamera keselamatan sekolah berjaya merakam kelibat seseorang di sekitar blok yang diceroboh.</p>\n<p class=\"dialogue\">“Betul ke tu, Khalid?” tanya Saiful, matanya membulat. “Kalau rakaman tu ada, maknanya dah boleh tangkap la siapa buat semua ni.”</p>\n<p>Khalid hanya mengangkat bahu. “Mungkin. Tapi kalau betul ada rakaman pun, kenapa sekolah masih senyap?”</p>\n<p>Dia merenung jauh ke luar tingkap kelas, melihat dua orang pengawas berlegar di koridor seperti rondaan pengawal. “Aku rasa... ada sesuatu yang mereka tak nak kita tahu.”</p>\n<p>Sejak pagi lagi, suasana tegang itu makin terasa. Perpustakaan yang menjadi tempat Khalid dan Mariam selalu bertukar pandangan kini dikunci rapi. Papan tanda “Dilarang Masuk – Arahan Pengetua,” tergantung di hadapan pintu utamanya.</p>\n<p>Makmal sains juga hanya dibuka kepada kelas yang dijadualkan. Pelajar yang tidak mempunyai urusan rasmi tidak dibenarkan berada di sana. Di kantin, guru-guru makan dalam diam, seolah-olah topik yang sama sudah jemu dibincangkan — tentang siapa dalang sebenar di sebalik siri pencerobohan itu.</p>\n<p>Khalid mula menyedari sesuatu yang pelik. Setiap kali dia berjalan di koridor, ada sahaja pandangan yang mengiringinya. Kadang-kadang dari pengawas, kadang-kadang dari pelajar lain. Seolah-olah dia sendiri menjadi salah seorang suspek.</p>\n<p>Dia tidak menyalahkan sesiapa. Memang dia banyak bertanya soalan akhir-akhir ini — terlalu banyak, mungkin. Dan dalam suasana penuh curiga seperti ini, seseorang yang bertanya terlalu banyak sering dianggap tahu lebih daripada yang sepatutnya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Waktu eksperimen tengah hari itu memberi sedikit kelegaan. Buat seketika, murid-murid 5 Alfa boleh melupakan segala tekanan luar kelas. Bau bahan kimia dari Makmal Sains semerbak di udara. Di hadapan kelas, Cikgu Fatimah berdiri dengan wajah tegasnya yang biasa — cermin mata separuh bingkai di hujung hidung, sambil memerhatikan pelajar-pelajar yang sedang bersiap sedia.</p>\n<p class=\"dialogue\">“Baik, hari ni kita nak tengok hasil tugasan minggu lepas,” katanya, suaranya jelas dan tegas. “Saya nak kamu semua bentangkan laporan eksperimen kamu satu per satu.”</p>\n<p>Seperti biasa, bunyi keluhan kecil kedengaran di seluruh kelas. Beberapa pelajar mula menunduk, berharap nama mereka tidak disebut awal.</p>\n<p>Namun, seorang pelajar kelihatan penuh keyakinan — Saiful.</p>\n<p>Dia berdiri sambil tersenyum lebar, memegang buku nota tebal di tangannya. “Cikgu, saya dulu!” katanya penuh semangat.</p>\n<p>Khalid yang duduk di sebelahnya hanya menggeleng sambil ketawa kecil. “Dia ini memang lain macam hari ini.”</p>\n<p>Saiful melangkah ke depan, membuka buku notanya dan mula membaca dengan penuh yakin. “Eksperimen kali ini bertajuk... ‘Proses fotosintesis pada tumbuhan hijau’.”</p>\n<p>Suasana kelas tiba-tiba menjadi hening. Cikgu Fatimah mengangkat wajahnya dari meja. “Apa dia, Saiful?”</p>\n<p>Saiful tersenyum, tidak menyedari apa-apa yang pelik. “Fotosintesis, cikgu. Proses penting dalam Biologi yang berlaku apabila tumbuhan menghasilkan makanan menggunakan cahaya matahari.”</p>\n<p>Beberapa pelajar di belakang sudah mula menekup mulut, menahan ketawa. Khalid tunduk ke meja, bahunya bergoncang menahan gelak.</p>\n<p class=\"dialogue\">“Saiful…,” suara Cikgu Fatimah perlahan, namun sarat dengan makna. “Awak tahu tak subjek yang kita sedang belajar sekarang ni apa?”</p>\n<p>Saiful memandang sekeliling, mula kelihatan canggung. “Err… Fizik?” jawabnya, separuh yakin.</p>\n<p class=\"dialogue\">“Ya, Fizik.” Cikgu Fatimah bersandar ke kerusi sambil menahan senyum. “Jadi boleh saya tahu kenapa awak bentangkan kerja rumah Biologi di kelas saya?”</p>\n<p>Seluruh kelas meletus ketawa. Suara riuh rendah memenuhi ruang makmal yang sejuk. Saiful terpinga-pinga seketika sebelum memandang buku di tangannya. Dia menyelak halaman depan — jelas tertulis tajuk besar di situ: “Nota Biologi – Cikgu Halimah”.</p>\n<p class=\"dialogue\">“Alamak!” Saiful menepuk dahi sendiri. “Patutlah saya rasa pelik kenapa tak ada formula tadi!”</p>\n<p>Gelak ketawa makin kuat, termasuk dari Khalid yang hampir menitis air mata kerana menahan tawa. Namun yang paling mengejutkan semua orang — Cikgu Fatimah turut ketawa.</p>\n<p>Ketawanya lembut tapi tulus, memecahkan imej tegas yang selama ini menjadi sebahagian daripada dirinya. “Saiful, Saiful... kamu memang unik. Tapi sekurang-kurangnya kali ini kamu siapkan tugasan, walaupun subjek salah.”</p>\n<p>Suasana makmal menjadi ceria. Ketawa itu bagaikan menyapu bersih tekanan yang menyelubungi sekolah sejak dua hari lalu.</p>\n<p>Khalid tersenyum. Buat pertama kali sejak dia menjejakkan kaki ke sekolah ini, dia melihat Cikgu Fatimah tersenyum — senyuman yang benar-benar ikhlas.</p>\n<p>Namun di sebalik senyum itu, fikirannya tetap jauh. Dunia di luar makmal masih diselimuti tanda tanya dan misteri yang belum terungkai. Tapi sekurang-kurangnya, buat seketika, ketawa kecil itu membuatkan dia lupa tentang bayang-bayang yang sentiasa mengekori setiap langkahnya.</p>", "wordCount": 779}, {"num": 22, "fullTitle": "Bab 22 – Amaran di Ambang Pintu", "title": "Amaran di Ambang Pintu", "content": "<p>Suasana tengahari di sekolah itu masih lagi berbalut ketegangan daripada hari-hari sebelumnya. Walaupun keadaan nampak sedikit reda, namun rasa cemas masih berlegar di hati para pelajar. Mereka kini lebih berhati-hati — setiap kali melangkah keluar atau masuk kelas, pandangan mata mereka akan meneliti sekeliling, seolah-olah takut akan sesuatu yang tidak dijangka.</p>\n<p>Ketika sesi di makmal sains itu, Saiful, seperti biasa, menjadi antara yang paling riuh. Dia baru menyedari yang dia telah buat kesilapan yang tidak boleh dilupakan.</p>\n<p class=\"dialogue\">“Eh, aku rasa tertinggal buku laporan dekat kelas la,” katanya sambil menepuk dahi.</p>\n<p>Khalid yang berada di belakangnya hanya tersenyum. “Biasalah itu. Kalau bukan kau yang tertinggal, memang tak sah.”</p>\n<p>Saiful ketawa kecil sambil melangkah keluar ke arah blok kelas. “Kau tunggu la, aku kejap sahaja. Nanti aku datang balik!”</p>\n<p>Khalid mengangguk. “Jangan lama sangat. Cikgu Fatimah tengah baik itu, aku tak nak tolong cover kalau kau buat hal lagi.”</p>\n<p class=\"dialogue\">“Haha, baik,” balas Saiful sambil berlari kecil menuju ke arah kelas 5 Alfa yang terletak di hujung koridor. Sebelum keluar dari makmal tersebut, Saiful sempat meminta izin daripada Cikgu Fatimah secara tergesa-gesa.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Koridor itu agak sunyi. Pelajar-pelajar lain sudah pun masuk ke bilik kelas masing-masing. Hanya bunyi derapan kasut Saiful yang kedengaran, bergema perlahan di ruang yang sempit itu.</p>\n<p>Sebaik sahaja tiba di depan kelas, langkahnya terhenti. Dari jarak beberapa meter, dia sempat melihat seseorang — seorang lelaki — keluar dari kelasnya. Lelaki itu berpakaian seragam sekolah, tapi wajahnya tidak jelas kerana membelakanginya.</p>\n<p>Saiful menegur dengan nada separuh kuat, “Hoi! Kau buat apa dalam kelas aku?”</p>\n<p>Namun lelaki itu tidak menoleh. Dia hanya melangkah pergi, tenang dan perlahan, sebelum membelok di hujung koridor lalu menghilang.</p>\n<p>Saiful berkerut dahi. “Siapa pula budak itu?” gumamnya. Namun kerana yakin mungkin pelajar dari kelas lain yang tersilap masuk, dia tidak memanjangkan perkara itu. Dengan bahu yang masih terangkat kehairanan, dia melangkah masuk ke dalam kelas.</p>\n<p>Buku yang dicarinya berada di atas meja, tepat di tempat dia duduk seperti biasa. Dia mengangkatnya, meneliti sekeliling — tiada apa yang pelik. Namun sesuatu terasa ganjil. Kerusi di sebelah meja Khalid sedikit berganjak ke belakang, seolah-olah baru sahaja digunakan seseorang.</p>\n<p>Saiful menggaru kepala. “Entahlah. Mungkin Khalid tadi kot.”</p>\n<p>Tanpa berfikir panjang, dia keluar semula menuju ke makmal.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Di dalam makmal sains, Cikgu Fatimah sedang menerangkan langkah demi langkah eksperimen baharu mereka. Suaranya tegas tetapi jelas, menandakan beliau benar-benar serius hari ini.</p>\n<p class=\"dialogue\">“Setiap kumpulan akan menjalankan eksperimen untuk mengukur kadar pemuaian logam apabila dipanaskan. Saya tak mahu ada yang bermain-main. Faham?”</p>\n<p class=\"dialogue\">“Faham, cikgu!” sahut semua serentak.</p>\n<p>Khalid dan Saiful berada dalam kumpulan yang sama bersama dua lagi rakan sekelas mereka — Zubir dan Munir. Mereka diberikan set peralatan asas: pembaris logam, pembakar spirit, dan alat pengukur suhu.</p>\n<p class=\"dialogue\">“Okay, kumpulan satu — Munir, kamu boleh mula dulu,” kata Cikgu Fatimah.</p>\n<p>Munir dan kumpulannya bergerak pantas, cekap dan teratur. Setiap langkah mereka dilakukan dengan teliti. Beberapa minit kemudian, mereka berjaya menyiapkan eksperimen tanpa sebarang kesilapan. Cikgu Fatimah mengangguk puas. “Bagus, ini yang saya mahu tengok.”</p>\n<p>Kumpulan Khalid pula masih sibuk memanaskan pembakar spirit. Saiful yang diberi tugas mencatat bacaan suhu kelihatan kelam-kabut.</p>\n<p class=\"dialogue\">“Saiful, jangan dekat sangat dengan api tu!” tegur Khalid.</p>\n<p class=\"dialogue\">“Ala, relaxlah. Aku tahu la apa aku buat.”</p>\n<p>Namun belum sempat Khalid menegur lagi, Saiful mencondongkan muka terlalu dekat dengan alat pemanas. Api kecil dari pembakar spirit itu menyambar sedikit ke arah kertas catatan yang dipegangnya.</p>\n<p class=\"dialogue\">“Eh—eh! Api! Api!” jerit Saiful panik.</p>\n<p>Khalid dengan pantas menepuk kertas tersebut, memadamkan bara kecil yang sempat menyala di hujungnya. “Astaghfirullah, kau ini nak bakar makmal ke?”</p>\n<p>Kelas mula riuh rendah dengan ketawa. Beberapa pelajar yang menonton kejadian itu menutup mulut sambil menahan gelak.</p>\n<p>Cikgu Fatimah yang berada di meja hadapan mengangkat kepala, matanya tepat memandang ke arah kumpulan Khalid. “Kumpulan terakhir ini... nampaknya terlalu ‘bersemangat’.”</p>\n<p>Saiful berdiri tegak sambil tersenyum malu. “Hehe... maaf cikgu. Tak sengaja.”</p>\n<p>Cikgu Fatimah mengekalkan wajah seriusnya beberapa saat sebelum menggeleng kecil. “Baik. Oleh sebab kumpulan kamu paling lambat siap dan hampir membakar makmal, saya akan berikan kamu tugasan tambahan minggu depan.”</p>\n<p class=\"dialogue\">“Denda, cikgu?” tanya Saiful, suaranya kecil.</p>\n<p class=\"dialogue\">“Bukan denda,” jawab Cikgu Fatimah tenang. “Latihan pengukuhan.”</p>\n<p>Kelas meletus ketawa lagi. Saiful hanya mampu tersenyum sambil menepuk dahi sendiri. Khalid menepuk bahunya. “Itulah... lain kali dengar arahan dulu sebelum buat.”</p>\n<p>Saiful membalas dengan muka selamba. “Sekurang-kurangnya, aku berjaya buat semua orang ketawa hari ini.”</p>\n<p>Khalid tergelak kecil. “Ha, itu betul.”</p>", "wordCount": 726}, {"num": 23, "fullTitle": "Bab 23 – Jejak di Padang", "title": "Jejak di Padang", "content": "<p>Waktu tengah hari itu, suasana kelas 5 Alfa agak tegang namun terkawal.</p>\n<p>Cikgu Roslan, guru Matematik Tambahan mereka, berdiri di hadapan kelas dengan pembaris panjang di tangan — simbol amaran kepada mana-mana pelajar yang cuba bermain-main.</p>\n<p class=\"dialogue\">“Baik, hari ni kita sambung sesi pembentangan kumpulan. Saya nak tengok sejauh mana kamu faham topik Diferensiasi yang saya bagi minggu lepas.”</p>\n<p>Nada suaranya tegas, tetapi jelas berpengalaman mengawal pelajar.</p>\n<p>Setiap kumpulan sudah bersedia dengan kertas mahjong dan nota di tangan. Di hujung kelas, Khalid dan rakan-rakannya menunggu giliran mereka dengan tenang — atau sekurang-kurangnya cuba untuk tenang.</p>\n<p class=\"dialogue\">“Saiful, mana kalkulator aku?” tanya Khalid perlahan sambil membelek begnya.</p>\n<p>Saiful yang sedang menconteng sesuatu di buku latihan mengangkat wajah. “Eh? Bukan kau letak atas meja tadi ke sebelum ke makmal?”</p>\n<p>Khalid berhenti menggeledah begnya. “Ya, aku letak situ. Tapi sekarang tak ada.”</p>\n<p>Dia menoleh ke sekeliling meja, memeriksa bawah kerusi dan lantai — tiada.</p>\n<p>Wajahnya berubah sedikit serius. “Tak mungkin hilang begitu saja…”</p>\n<p>Saiful menelan air liur. Wajahnya tiba-tiba seperti teringat sesuatu.</p>\n<p class=\"dialogue\">“Khalid, masa aku balik kelas tadi nak ambil buku laporan… aku nampak seseorang keluar dari kelas kita.”</p>\n<p class=\"dialogue\">“Kau nampak seseorang keluar dari kelas?”</p>\n<p class=\"dialogue\">“Ha’ah,” Saiful menjawab sambil membuka penutup botol airnya. “Lelaki. Tapi aku tak sempat nampak muka dia. Aku sangka pelajar kelas lain.”</p>\n<p class=\"dialogue\">“Dia berpakaian seragam sekolah, tapi bukan dari kelas kita. Dia keluar tergesa-gesa sebelum aku sempat tegur.”</p>\n<p>Khalid terdiam seketika. “Dia keluar dari kelas kita?”</p>\n<p class=\"dialogue\">“Kau pasti dia dari dalam kelas kita?” soalnya perlahan, hampir berbisik.</p>\n<p>Saiful mengangguk. “Pasti. Pintu depan baru saja tertutup masa aku sampai.”</p>\n<p>Jantung Khalid berdegup kencang. Dia menatap meja kosong di hadapannya. Di situlah kalkulatornya diletakkan pagi tadi. Sekarang ia hilang.</p>\n<p>Kebetulan? Tidak. Ini bukan kali pertama sesuatu hilang dari kelas ini.</p>\n<p class=\"dialogue\">“Baik, kumpulan tiga — giliran kamu!” suara Cikgu Roslan bergema, memecahkan lamunannya.</p>\n<p>Khalid tersentak. “Itu kumpulan kita,” katanya sambil menutup buku nota. Dia segera berdiri, cuba menumpukan perhatian pada pembentangan.</p>\n<p>Namun fikirannya masih berlegar pada satu nama — Edy.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selesai kelas, Khalid menunggu Saiful di pintu pagar sekolah.</p>\n<p class=\"dialogue\">“Petang ni kau balik terus ke rumah?” tanya Khalid.</p>\n<p>Saiful menggeleng. “Tak, aku ada latihan bola. Tapi kau boleh ikut aku dulu. Lepak rumah aku kejap, rehat sebelum kita ke padang.”</p>\n<p>Khalid tersenyum kecil. “Boleh juga.”</p>\n<p>Rumah Saiful tidak jauh dari sekolah — sebuah rumah teres dua tingkat yang sederhana tetapi kemas. Bau masakan tengah hari menyambut mereka sebaik melangkah masuk.</p>\n<p class=\"dialogue\">“Mak aku masak kari ayam hari ni. Makan dulu,” kata Saiful sambil meletakkan beg di sofa.</p>\n<p>Khalid ketawa kecil. “Aku tak boleh tolak kalau bab makan.”</p>\n<p>Beberapa jam kemudian, mereka berdua kembali ke sekolah untuk sesi latihan bola sepak. Cahaya matahari sudah mula condong, mewarnai padang dengan bias jingga yang lembut.</p>\n<p>Cikgu Zul sudah berdiri di tengah padang, meniup wisel dan memberi arahan.</p>\n<p class=\"dialogue\">“Lari sepusingan dulu! Panaskan badan sebelum kita mula!”</p>\n<p>Khalid, yang baru menyertai pasukan latihan, cuba menyesuaikan diri. Walaupun ini latihan pertamanya, semangatnya jelas terserlah. Haziq dan Fahmi menyambutnya dengan tepukan bahu mesra.</p>\n<p>Namun tidak semua wajah di padang menyambutnya dengan mesra.</p>\n<p>Di sisi kanan, dua orang pelajar berdiri bersembang sambil memandang ke arahnya — Edy dan Zamani.</p>\n<p>Khalid berpura-pura tidak perasan, namun matanya tetap mencuri pandang. Ada sinis di senyuman Edy, seolah-olah dia tahu sesuatu yang orang lain tidak tahu.</p>\n<p>Latihan bermula. Mereka dibahagikan kepada dua kumpulan. Khalid diletakkan sebagai pemain tengah, manakala Edy bertindak sebagai pertahanan untuk kumpulan lawan.</p>\n<p>Suasana padang penuh semangat. Bunyi sepakan bola, jeritan rakan sepasukan, dan arahan Cikgu Zul membangkitkan adrenalin.</p>\n<p>Khalid menerima hantaran daripada Haziq, menggelecek dua lawan dengan lincah.</p>\n<p class=\"dialogue\">“Bagus, Khalid! Teruskan!” jerit Saiful dari tepi padang.</p>\n<p>Namun sebaik Khalid mara ke kawasan penalti, tiba-tiba — gedebuk!</p>\n<p>Satu benturan keras dari sisi membuat tubuhnya hilang imbangan dan jatuh berguling di atas rumput.</p>\n<p>Kesakitan menyambar lututnya serta-merta.</p>\n<p class=\"dialogue\">“Oi! Apa ni!” jerit Haziq sambil berlari ke arah Khalid.</p>\n<p>Khalid memegang lututnya, cuba menahan sakit. Nafasnya tercungap.</p>\n<p>Apabila dia mengangkat wajah, pandangannya bertembung dengan seseorang.</p>\n<p>Edy.</p>\n<p>Pengawas itu berdiri tidak jauh darinya, senyumannya sumbing, sinis — dan penuh maksud.</p>\n<p class=\"dialogue\">“Maaf,” katanya perlahan, tapi nadanya lebih seperti ejekan. “Terbentes tadi.”</p>\n<p>Khalid memerhatikannya tajam. Nafasnya turun naik.</p>\n<p>Dia tahu — itu bukan kemalangan.</p>\n<p>Cikgu Zul meniup wisel panjang. “Cukup untuk hari ini! Semua boleh bersurai!”</p>\n<p>Khalid cuba bangun, tapi lututnya terasa sengal. Saiful segera datang membantu, memapahnya ke tepi padang.</p>\n<p class=\"dialogue\">“Kau okay ke, Khalid?” tanya Saiful cemas.</p>\n<p>Khalid mengangguk perlahan. “Aku okay…,” suaranya perlahan, matanya masih tertumpu ke arah Edy yang berjalan tenang meninggalkan padang.</p>\n<p>Senyuman itu — senyuman yang sama seperti kali pertama mereka bertemu.</p>\n<p>Cuma kali ini, Khalid pasti.</p>\n<p>Senyuman itu membawa makna.</p>\n<p>Dan makna itu… adalah amaran.</p>", "wordCount": 768}, {"num": 24, "fullTitle": "Bab 24 – Suara di Sebalik Rahsia", "title": "Suara di Sebalik Rahsia", "content": "<p>Hari itu, suasana sekolah bagaikan diselubungi awan kelabu.</p>\n<p>Bukan kerana cuaca, tetapi kerana khabar angin yang semakin menular — khabar mengenai siri kecurian yang tidak berkesudahan.</p>\n<p class=\"dialogue\">“Sejak minggu lepas, dah tiga kes baru dilaporkan,” bisik seorang pelajar di koridor.</p>\n<p class=\"dialogue\">“Dengar cerita, kali ni bukan barang kecil… ada telefon, duit, malah jam tangan mahal pun hilang.”</p>\n<p>Bisikan itu berterbangan dari satu kelas ke satu kelas, mencipta suasana yang serba resah.</p>\n<p>Khalid berjalan tenang di koridor, walaupun di dalam dirinya, perasaan ingin tahu itu membuak-buak.</p>\n<p>Sejak hari dia dibentes oleh Edy di padang, fikirannya tidak pernah benar-benar tenang. Dia tahu sesuatu sedang berlaku — sesuatu yang lebih besar daripada sekadar “kecurian kecil”.</p>\n<p>Dan pagi itu, berita baru datang lagi:</p>\n<p>Cikgu Bakar telah memanggil semua pelajar yang menjadi mangsa kejadian untuk berjumpa dengannya di bilik guru disiplin.</p>\n<p class=\"dialogue\">“Cikgu Bakar makin serius sekarang,” kata Saiful ketika mereka duduk di dalam kelas menunggu guru masuk. “Semua pelajar yang pernah lapor barang hilang kena datang. Aku dengar sampai sepuluh orang dah dipanggil.”</p>\n<p>Khalid hanya mengangguk, pandangannya kosong ke arah luar tingkap. “Sepuluh orang…,” bisiknya perlahan.</p>\n<p>Dia berfikir sejenak — Suria juga antara mangsa yang pernah kehilangan barang.</p>\n<p>Tiba-tiba, satu idea datang.</p>\n<p class=\"dialogue\">“Saiful, nanti aku ada hal kejap lepas kelas. Kau balik dulu, ya?” katanya perlahan sambil membuka buku teks.</p>\n<p>Saiful mengangkat kening, tapi tidak membantah. “Baiklah, tapi jangan buat kerja pelik-pelik, Khalid.”</p>\n<p>Khalid hanya tersenyum tipis. “Aku cuma nak tanya seseorang.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Menjelang penghujung waktu terakhir hari itu, loceng berbunyi menandakan kelas hampir tamat.</p>\n<p>Pelajar-pelajar mula mengemas buku, suasana kembali riuh seperti biasa.</p>\n<p>Namun di sebalik keriuhan itu, Khalid sempat menoleh ke arah Suria, yang duduk dua baris di hadapannya.</p>\n<p class=\"dialogue\">“Suria,” panggilnya perlahan. “Tunggu aku sekejap dekat kantin, ya? Ada hal sikit nak bincang.”</p>\n<p>Suria memandang Khalid dengan dahi sedikit berkerut. “Hal apa?”</p>\n<p class=\"dialogue\">“Nanti aku terangkan. Tak lama pun.”</p>\n<p>Melihat kesungguhan Khalid, Suria hanya mengangguk perlahan. “Baiklah.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Kantin sekolah agak lengang petang itu.</p>\n<p>Beberapa pelajar sahaja yang masih duduk di meja panjang, sibuk menyelesaikan makanan sebelum pulang.</p>\n<p>Suria menunggu di salah satu meja berhampiran tiang besar, sambil memegang air kotak yang baru dibelinya.</p>\n<p>Beberapa minit kemudian, Khalid muncul, membawa begnya yang sudah separuh zip.</p>\n<p class=\"dialogue\">“Lambat,” tegur Suria sambil tersenyum kecil.</p>\n<p class=\"dialogue\">“Cikgu tahan tadi. Maaf.” Khalid duduk di hadapan Suria, menarik nafas panjang. “Terima kasih sebab tunggu.”</p>\n<p class=\"dialogue\">“Jadi… apa yang kau nak tanya sangat ni?”</p>\n<p>Khalid diam seketika, memastikan tiada siapa di sekitar mereka yang mendengar.</p>\n<p>Dia mencondongkan sedikit tubuh ke depan. “Aku dengar kau dipanggil oleh Cikgu Bakar tadi. Betul ke?”</p>\n<p>Suria mengangguk. “Ya, betul. Aku antara pelajar yang kehilangan barang itu. Cikgu Bakar nak tahu butiran lanjut tentang hari kejadian.”</p>\n<p>Khalid mengangguk perlahan. “Cikgu tanya apa?”</p>\n<p>Suria meneguk airnya sedikit sebelum menjawab. “Macam-macam. Bila kali terakhir aku nampak barang aku, siapa yang duduk dekat meja aku, siapa yang lalu lalang dekat kelas hari itu…”</p>\n<p>Dia berhenti sejenak, matanya memandang Khalid penuh makna. “Tapi, peliknya… Cikgu Bakar macam dah tahu semua jawapan itu lebih awal.”</p>\n<p>Khalid mengerutkan dahi. “Maksud kau?”</p>\n<p>Suria menyandarkan tubuh ke kerusi. “Masa aku tengah jawab, dia tiba-tiba cakap — ‘awak tak perlu risau, pelaku dah dikenal pasti’. Tapi bila aku tanya siapa, dia senyum saja. Tak jawab apa-apa.”</p>\n<p>Khalid terdiam. Nafasnya terasa berat. “Pelaku dah dikenal pasti?”</p>\n<p class=\"dialogue\">“Ya,” Suria mengulang perlahan. “Tapi aku rasa, kalau betul pun dia dah tahu siapa… kenapa masih buat spot-check setiap hari? Kenapa masih ramai pengawas berkawal macam sekolah ni zon perang?”</p>\n<p>Soalan itu menikam tepat ke dalam hati Khalid.</p>\n<p>Dia tahu jawapannya — kerana pelaku sebenar belum ditangkap.</p>\n<p class=\"dialogue\">“Suria,” kata Khalid akhirnya. “Kau perasan tak... siapa yang keluar dari bilik disiplin sebelum kau masuk tadi?”</p>\n<p>Suria cuba mengingati. “Hmm… aku rasa Edy. Dengan Zamani sekali.”</p>\n<p>Khalid menunduk perlahan, jemarinya menggenggam meja.</p>\n<p>Edy lagi. Nama itu muncul di mana-mana.</p>\n<p class=\"dialogue\">“Kenapa, Khalid?” tanya Suria perlahan. “Ada sesuatu yang kau tahu?”</p>\n<p>Khalid mengangkat wajahnya, menatap mata Suria dengan pandangan yang berat.</p>\n<p class=\"dialogue\">“Ada sesuatu… tapi aku masih belum pasti.”</p>\n<p>Dia bangun perlahan, menggalas beg di bahu. “Terima kasih, Suria. Apa yang kau cakap ini penting.”</p>\n<p>Suria memandangnya hairan. “Kau ini macam detektif la, Khalid.”</p>\n<p>Khalid hanya tersenyum tipis, melangkah pergi. “Aku cuma nak tahu kebenaran.”</p>\n<p>Suria menonton langkahnya hingga hilang di koridor. Wajah Khalid tenang, tapi ada sesuatu dalam matanya — sesuatu yang tidak pernah dia lihat sebelum ini.</p>\n<p>Dalam hati Khalid, satu tekad mula terbentuk.</p>\n<p>Jika benar Cikgu Bakar sudah tahu pelaku sebenar…</p>\n<p>Maka sudah tiba masanya dia sendiri mencari jawapan itu — dengan caranya sendiri.</p>", "wordCount": 745}, {"num": 25, "fullTitle": "Bab 25 – Jejak yang Belum Padam", "title": "Jejak yang Belum Padam", "content": "<p>Hari itu, suasana kelas 5 Alfa terasa lebih tenang daripada biasa.</p>\n<p>Khabar bahawa kelas Cikgu Fatimah dibatalkan tersebar seawal pagi tadi, menyebabkan wajah-wajah pelajar dipenuhi rasa lega. Tiada eksperimen, tiada laporan, tiada tekanan. Hanya bunyi geseran pensel dan hela nafas yang panjang dari pelajar-pelajar yang sibuk menyiapkan kerja rumah yang tertunggak.</p>\n<p>Saiful duduk di meja sebelah Khalid, membongkok sedikit sambil menulis laju di dalam buku latihan Matematik Tambahan. Sesekali, dia menjeling ke arah Khalid yang kelihatan fokus menulis sesuatu di buku catatannya.</p>\n<p class=\"dialogue\">“Khalid,” panggil Saiful perlahan tanpa mengalihkan pandangan.</p>\n<p class=\"dialogue\">“Hmm?” sahut Khalid tanpa menoleh.</p>\n<p class=\"dialogue\">“Sejak kau pindah ke sekolah ni, aku perasan kau selalu sorang-sorang. Kadang macam banyak benda kau fikir.”</p>\n<p>Dia berhenti menulis, memandang Khalid. “Aku nak tanya… sebelum kau masuk sekolah ini, kau sekolah mana?”</p>\n<p>Khalid terhenti menulis. Soalan itu kedengaran mudah, tapi entah mengapa terasa berat di dadanya.</p>\n<p class=\"dialogue\">“Sekolah lama aku… jauh dari sini,” jawabnya perlahan, tanpa menatap Saiful. “Di utara.”</p>\n<p class=\"dialogue\">“Utara?” Saiful mengerutkan dahi. “Jauh juga tu. Kenapa pindah? Bapak kau kerja sini ke?”</p>\n<p>Khalid tersenyum kecil, namun senyuman itu tidak sampai ke matanya. “Bukan sebab kerja. Aku pindah... sebab satu kejadian.”</p>\n<p>Suasana antara mereka tiba-tiba menjadi sunyi. Bunyi kipas di siling kedengaran jelas, berputar perlahan seolah sedang menunggu Khalid menyambung kata-katanya.</p>\n<p>Saiful berpaling, memerhati wajah rakannya itu dengan penuh tanda tanya.</p>\n<p class=\"dialogue\">“Kejadian apa, Khalid?”</p>\n<p>Khalid menutup buku di hadapannya. Nafasnya berat. “Dulu, masa di sekolah lama… ada satu kes. Seorang pelajar hilang. Lepas seminggu, dia ditemui mati di kawasan stor belakang sekolah.”</p>\n<p>Saiful terpempan. “Innalillah... serius, Khalid?”</p>\n<p>Khalid mengangguk perlahan. “Aku orang terakhir yang bercakap dengan dia sebelum dia hilang. Sejak itu, semua pandang aku dengan curiga. Ada yang tuduh aku terlibat.”</p>\n<p>Suara Khalid tenang, tapi di balik ketenangan itu ada luka yang dalam.</p>\n<p class=\"dialogue\">“Aku cuba bertahan. Tapi bila tekanan makin teruk... aku minta pindah.”</p>\n<p>Saiful terdiam lama. Dia tak tahu apa yang perlu dikatakan. Wajahnya berubah sayu.</p>\n<p class=\"dialogue\">“Aku minta maaf, Khalid. Aku tak sangka…”</p>\n<p>Khalid menggeleng. “Tak apa, Saiful. Semua itu dah berlalu. Aku cuma… tak nak perkara yang sama berulang lagi di sini.”</p>\n<p>Saiful mengangguk, memandang rakannya dengan rasa hormat yang lebih tinggi daripada sebelumnya. Dia tahu, di sebalik ketenangan Khalid, ada sesuatu yang lebih kompleks — seorang insan yang cuba mencari makna selepas kehilangan keyakinan dunia terhadapnya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Petang itu, perpustakaan sekolah kembali menjadi tempat perlindungan Khalid.</p>\n<p>Sinar matahari petang menembusi kaca jernih tingkap, menimpa permukaan meja kayu tempat dia dan Mariam duduk bersebelahan. Bunyi helaan kipas berputar perlahan menjadi satu-satunya irama di ruang itu.</p>\n<p>Khalid membuka fail kecil berisi nota yang dikumpulkan selama beberapa minggu — catatan nama, tarikh kejadian, dan lokasi kecurian yang berlaku.</p>\n<p>Mariam pula meneliti sehelai kertas peta sekolah yang diambil dari papan kenyataan.</p>\n<p class=\"dialogue\">“Kalau tengok corak kejadian ni,” kata Khalid perlahan sambil menunjuk pada senarai catatannya, “semua kes berlaku di sekitar dua blok lama — termasuk bilik makmal, kelas 5 Alfa, dan bilik stor belakang perpustakaan.”</p>\n<p>Mariam mengangguk perlahan. “Ya. Dan kebetulan... surau lama itu pun dalam lingkungan kawasan yang sama.”</p>\n<p>Khalid menoleh. “Maksud kau?”</p>\n<p>Mariam menunduk sedikit, menyusun ayatnya dengan hati-hati. “Aku pernah dengar daripada staf lama — pembunuhan tiga tahun lepas itu... berlaku pada malam bulan penuh. Dan kalau dikira, malam ini juga bulan penuh.”</p>\n<p>Khalid memandang Mariam tajam. “Apa yang kau cuba sampaikan?”</p>\n<p>Mariam menghela nafas. “Aku rasa, kejadian-kejadian yang berlaku sekarang… mungkin bukan kebetulan. Ada sesuatu — atau seseorang — yang cuba ulang semula sejarah tiga tahun lepas.”</p>\n<p>Khalid terdiam. Kata-kata itu menggema lama di fikirannya.</p>\n<p class=\"dialogue\">“Tapi kenapa sekarang? Dan kenapa di tempat yang sama?”</p>\n<p>Mariam memandang ke luar tingkap, ke arah surau lama yang kelihatan samar dari kejauhan.</p>\n<p class=\"dialogue\">“Mungkin… kerana rahsia lama itu belum tertutup.”</p>\n<p>Khalid menunduk, jemarinya menggenggam kuat fail di tangannya.</p>\n<p>Dia tahu, sejak mula dia menjejak ke sekolah ini, sesuatu sudah menantinya — sesuatu yang bersambung antara masa lalu dan sekarang.</p>\n<p>Mariam menambah perlahan, matanya tidak beralih dari tingkap,</p>\n<p class=\"dialogue\">“Khalid, kalau benar apa yang aku fikirkan ni betul... mungkin kita sedang berhadapan dengan orang yang sama.”</p>\n<p>Khalid mengangkat wajah, menatapnya. “Pembunuh itu?”</p>\n<p>Mariam mengangguk, wajahnya serius. “Ya. Dan aku takut… dia masih di sini.”</p>", "wordCount": 682}, {"num": 26, "fullTitle": "Bab 26 – Siulan Malam dan Dua Soalan", "title": "Siulan Malam dan Dua Soalan", "content": "<p>Hari Ahad pagi itu lembut. Matahari mengintip malu di belakang deretan pokok di hadapan rumah Kamarul ketika Khalid menapak menuju ke rumah rakannya. Ada rasa lega di bahunya — bukan sahaja kerana dapat mengembalikan alat yang dipinjam, tetapi kerana satu beban kecil di dalam fikirannya akhirnya selesai.</p>\n<p>Kamarul menyambutnya di beranda, rambutnya tidak rapi seperti biasa, wajahnya mesra seperti kawan lama yang selalu sedia membantu. Di tangan Kamarul terlihat kotak kecil tempat alat itu disimpan. Apabila alat itu berpindah tangan, Khalid terasa ada satu urat ketegangan yang terlerai.</p>\n<p class=\"dialogue\">“Terima kasih, Kamarul. Kalau bukan kau bagi pinjam, susah juga aku nak buat rakaman tu semalam,” kata Khalid ringkas.</p>\n<p>Kamarul mengangkat bahu, tersenyum tenang. “Tidaklah. Aku cuma pinjamkan, itu benda kecil saja. Kau pulangkan elok-elok, itu sudah cukup.”</p>\n<p>Khalid mahu membalas dengan lebih baik, tetapi Kamarul yang lebih tua setahun itu menolak tangan yang cuba menghulur wang kecil.</p>\n<p class=\"dialogue\">“Apa guna duit, Khalid? Kau guna akal kau, keberanian kau. Alat ni cuma alat. Kau ingatkan benda itulah yang bantu kau? Kau silap kalau fikir begitu.”</p>\n<p>Khalid sedikit terkejut. “Maksud kau?”</p>\n<p>Kamarul menghela nafas perlahan, matanya memandang jauh ke arah jalan kampung. “Kita semua ini hamba. Hamba ada alat, hamba ada ilmu, hamba ada kudrat—tapi bila tiba perkara besar, bukan makhluk yang bagi jalan. Ingatlah, yang menolong kita sebenarnya Allah. Benda ini (dia menepuk kotak alat) cuma wasilah. Yang punya kuasa tetap Dia.”</p>\n<p>Kata-kata Kamarul datang bukan seperti ceramah kosong tetapi seperti penawar — menyejukkan sedikit kegusaran di dada Khalid. Khalid mengangguk, menerima pesan itu dengan hati yang sedikit lebih ringan.</p>\n<p class=\"dialogue\">“Baiklah, aku pulang dulu. Terima kasih banyak, Kamarul.” Khalid bangun untuk berlalu, namun sempat menoleh semula. “Kalau ada apa-apa kau bagitau ya. Kita saling bantu.”</p>\n<p>Kamarul melambai, wajahnya kembali ke senyum biasa. “Jaga diri. Jangan terlalu mengharap pada benda. Harap pada Dia.”</p>\n<p>Malam menjelang dengan cepat. Di biliknya, Khalid menyusun semula segala nota, rakaman, dan tangkapan layar yang dihimpun sejak beberapa minggu lalu. Lampu meja menyorot helaian-helaian itu — lukisan peta sekolah yang dicetak dari papan kenyataan, tangkapan lokasi daripada aplikasi radar, nama-nama pengawas, tarikh-tarikh kecurian, catatan tempat kejadian. Semua disusun mengikut warna, mengikut logik, mengikut gerak hati.</p>\n<p>Dia mengeluarkan semula alat kecil itu — bukan untuk digunakan lagi, tetapi untuk memeriksa bahawa setiap rakaman sudah tersimpan dengan betul. Skrin telefon memaparkan fail-fail yang telah direkod; satu-satu dipasang di layar, didengari, dicatit. Ada rentak; ada corak; kadang-kadang hanya bunyi langkah kaki; kadang-kadang, bisik-bisik yang samar; kadang-kadang lagi — sunyi yang panjang.</p>\n<p>Khalid menarik nafas panjang. Di meja itu, antara nota bertindih, dia menulis dua perkataan dengan huruf tebal — SIAPA? dan DI MANA?</p>\n<p>Dua soalan itu seperti dua kunci. Tanpa jawapan yang kukuh kepada mereka, segala pemerhatiannya hanyalah teka-teki yang berserakan. Tetapi dia tidak berhasrat menyerah.</p>\n<p>Dia menyusun semula kronologi:</p>\n<p>* 3 minggu lalu — kecurian pertama, bilik makmal. Pengawas A berada di blok bersebelahan.</p>\n<p>* 2 minggu lalu — telefon Suria hilang di kelas 5 Alfa. Pengawas Edy dan Zamani bertugas di blok berkenaan.</p>\n<p>* Semalam — lima kelas diceroboh, rekod pengawas menunjukkan Edy bertukar-tukar blok.</p>\n<p>* Jejak radar menunjukkan ada titik merah bergerak dari Tingkatan 4 ke Tingkatan 5 pada malam kecurian.</p>\n<p>* Catatan Ustazah tentang kejadian lama — surau, wuduk belakang, satu mayat — berkait dengan kawasan yang kini sering berlaku insiden.</p>\n<p>Dia menandakan satu hujung nota: “Edy? Zamani? Munir?” Nama-nama itu diulang beberapa kali, bukan sebagai tuduhan, tetapi sebagai senarai orang yang perlu diperhati lebih rapat. Tetapi nalurinya menarik kepada satu nama tertentu — bukan kerana benci, melainkan kerana corak yang ditunjukkan oleh data: pemudi pada waktu tertentu, pergerakan yang tidak konsisten, dan senyuman yang terlalu kerap pada masa yang salah.</p>\n<p>Waktu bergerak perlahan. Jam menunjukkan hampir pukul dua belas malam. Rumah senyap. Khalid terasa lelah tetapi tidak dapat berundur. Ada rasa tanggungjawab yang tumbuh; ada juga rasa ingin tahu yang semakin menjadi-jadi.</p>\n<p>Dia menutup folder, menutup lampu meja, tetapi tidak tidur. Dia keluar ke balkoni kecil biliknya, memandang ke arah surau lama yang samar-samar di kejauhan — seakan-akan menunggu. Angin malam menyapu wajahnya. Ada kesejukan yang membawa kedamaian, namun juga ada bisik yang menggugah dia untuk terus mencari.</p>\n<p class=\"dialogue\">“Siapa kau, dan di mana kau bersembunyi?” bisiknya sendiri, bukan kepada sesiapa. Dua soalan itu bergema di bawah langit malam.</p>\n<p>Khalid tahu esok bukan hari untuk banyak berdiam. Minggu ini akan penuh dengan pemeriksaan, soal siasat, dan rutin sekolah yang ketat. Tetapi dalam diam, dia sudah membuat tekad. Dia akan menyusun rencana:</p>\n<p>1. Kumpulkan bukti kukuh — rekod, saksi, rakaman yang jelas. Bukan hanya firasat.</p>\n<p>2. Jaga keselamatan rakan — jangan biarkan tuduhan melencung menimpa sahabat baik.</p>\n<p>3. Perhatikan gerak-gerik pengawas — jadual tugas, pergerakan antara blok, siapa yang muncul pada waktu aneh.</p>\n<p>4. Bertanya kepada orang yang lebih tahu — ustazah, arkib sekolah, staf lama yang mungkin pegang memori.</p>\n<p>Di sudut meja, Al-Quran kecil yang selalu ada di rumahnya menunggu. Khalid mengambilnya, membuka halaman yang biasa dibaca setiap kali hatinya resah. Dia berserah, memohon petunjuk. Bukan hanya pada akal, tetapi pada Hati Yang Maha Mengetahui.</p>\n<p>Malam itu dia tidur dengan kepala penuh nota, impian samar tentang langit yang dipenuhi bintang, dan dua soalan yang belum tamat: Siapa? Di mana?</p>\n<p>Dan di dalam mimpi, seakan ada siulan jauh — suaranya samar, seperti mendorongnya untuk terus berjalan.</p>\n<p>Esok, misi bermula lagi.</p>", "wordCount": 878}, {"num": 27, "fullTitle": "Bab 27 – Petunjuk di Sebalik Sampah", "title": "Petunjuk di Sebalik Sampah", "content": "<p>Pagi itu langit berbalam nipis, seolah-olah menyembunyikan cahaya matahari di balik tirai mendung. Khalid duduk termenung di meja makannya, masih membelek catatan yang disusun malam tadi. Garisan-garisan pen merah dan biru menutupi helaian itu seperti peta yang cuba menceritakan sesuatu.</p>\n<p>Namun, satu perkara masih menghantui fikirannya — “Di mana?”</p>\n<p>Dia sudah punya suspek, punya bukti kecil yang menunjukkan corak, tetapi tidak tahu di mana semua ini berpusat.</p>\n<p>Dan pagi itu, tanpa disangka, Allah menggerakkan sesuatu untuk menjawab persoalan itu.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid tiba di sekolah lebih awal daripada biasa. Lorong ke surau lama masih lengang, hanya beberapa pekerja kebersihan yang sibuk menyapu daun-daun kering di kawasan berhampiran bengkel kemahiran hidup. Dari jauh, dia melihat seorang tukang kebun tua yang dikenali sebagai Pak Rahim — lelaki yang sudah lama berkhidmat di sekolah itu sejak zaman ayah Khalid masih menjadi pelajar di sini.</p>\n<p class=\"dialogue\">“Assalamualaikum, Pak Rahim,” sapa Khalid sambil menunduk hormat.</p>\n<p class=\"dialogue\">“Waalaikumussalam, Khalid. Datang awal hari ni,” jawab Pak Rahim, senyum nipis terukir di bibirnya yang sudah berkedut.</p>\n<p>Khalid menoleh ke arah longgokan tong sampah di hujung bengkel. Ada sesuatu yang pelik — kawasan itu nampak seperti baru sahaja dibersihkan, tetapi satu sudutnya tertutup dengan kain hitam lusuh.</p>\n<p class=\"dialogue\">“Pak Rahim, kawasan tu memang ada orang buang barang ke?” tanya Khalid, menunjuk ke arah longgokan itu.</p>\n<p>Pak Rahim berhenti menyapu, kemudian memandangnya dengan wajah sukar ditafsir. “Tempat itu memang lama dah jadi tempat buang barang rosak dari bengkel kemahiran hidup. Tapi sejak dua bulan lepas, ada juga pelajar yang suka datang malam-malam. Bila saya tegur, mereka lari.”</p>\n<p>Khalid berkerut. “Pelajar? Siapa, Pak Rahim?”</p>\n<p>Pak Rahim menggeleng perlahan. “Tak nampak jelas, tapi dua orang budak lelaki. Saya cuma dengar suara dan nampak lampu suluh.”</p>\n<p>Khalid terasa ada sesuatu yang bergetar dalam dirinya. Dua orang? Tepat seperti catatan dalam senarai rondaan malam pengawas — Edy dan Zamani.</p>\n<p>Dia menghampiri longgokan sampah itu perlahan-lahan. Di celah timbunan kayu dan besi terbuang, ada ruang kecil seperti laluan sempit di tepi tembok bengkel. Di situlah Khalid terlihat beberapa kesan tapak kasut yang masih baru dan kesan tanah basah — seperti baru dipijak.</p>\n<p>Dia tunduk, menyelak kain hitam yang menutupi bahagian bawah longgokan. Di bawahnya terselit sesuatu yang berkilat kecil — seakan serpihan kaca, mungkin daripada alat atau objek yang dipatahkan. Khalid mencapainya, meneliti. Potongan itu bukan kaca biasa; ia seperti lensa kamera kecil, mungkin daripada alat rakaman atau telefon yang dirosakkan.</p>\n<p>Hatinya berdegup pantas. Adakah ini tempat mereka menyembunyikan sesuatu?</p>\n<p>Belum sempat dia meneliti lebih jauh, satu suara keras memecah kesunyian.</p>\n<p class=\"dialogue\">“KHALID!”</p>\n<p>Dia terperanjat. Tergesa-gesa dia berpaling. Di belakangnya berdiri Cikgu Muzammil, guru Matematik Tambahan, dengan wajah serius dan tangan berlipat di dada.</p>\n<p class=\"dialogue\">“Apa kamu buat di sini?”</p>\n<p>Khalid tergagap. “Saya… saya cuma—”</p>\n<p class=\"dialogue\">“Cuma apa?” Cikgu Muzammil melangkah menghampiri, matanya tajam. “Ini kawasan larangan. Waktu sekarang kelas sudah mula, dan kamu di sini? Kamu sedar kamu sudah ponteng, Khalid?”</p>\n<p>Khalid tunduk. Nafasnya berat. “Saya minta maaf, cikgu. Saya cuma… nampak sesuatu yang mencurigakan di sini.”</p>\n<p>Namun, Cikgu Muzammil tidak nampak terkesan. “Kalau betul-betul mencurigakan, laporkan pada pihak sekolah. Bukan kamu yang jadi penyiasat.”</p>\n<p>Cikgu Muzammil memandang jam tangannya, kemudian menghela nafas panjang. “Baiklah, ikut saya. Kita pergi jumpa Cikgu Bakar. Biar saya laporkan terus.”</p>\n<p>Khalid hanya mampu mengangguk, walaupun hatinya menolak. Dia sempat berpaling ke arah longgokan itu sekali lagi sebelum meninggalkan kawasan tersebut. Sekilas, dia ternampak kelibat seseorang di sebalik tingkap bengkel — pantas, seperti sedang bersembunyi.</p>\n<p>Namun, bila dia berpaling semula, tiada siapa di sana.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Pejabat disiplin sunyi ketika mereka tiba. Cikgu Bakar sedang menyemak beberapa dokumen ketika Cikgu Muzammil mengetuk pintu dan masuk bersama Khalid.</p>\n<p class=\"dialogue\">“Cikgu Bakar,” tegur Muzammil. “Pelajar ni saya jumpa di kawasan bengkel semasa waktu kelas. Katanya nampak sesuatu yang mencurigakan.”</p>\n<p>Cikgu Bakar menoleh, wajahnya tidak menunjukkan emosi. “Khalid, kamu tahu tindakan kamu boleh dikira sebagai ponteng, kan?”</p>\n<p>Khalid menunduk. “Saya tahu, cikgu. Tapi saya betul-betul nampak sesuatu yang ganjil di sana. Ada kesan tapak kaki, dan…,” dia berhenti sejenak, teragak-agak untuk menceritakan tentang serpihan lensa yang ditemuinya. “…dan ada barang yang seperti alat rakaman, cikgu.”</p>\n<p>Cikgu Bakar dan Cikgu Muzammil berpandangan sejenak. Wajah mereka berubah sedikit, seolah-olah masing-masing menyedari sesuatu yang Khalid sendiri belum tahu.</p>\n<p class=\"dialogue\">“Baik,” ujar Cikgu Bakar akhirnya. “Saya akan arahkan pemeriksaan dibuat di kawasan itu nanti. Buat masa sekarang, kamu pergi ke kelas kamu semula. Dan Khalid…”</p>\n<p>Khalid mengangkat kepala. “Ya, cikgu?”</p>\n<p>Cikgu Bakar menatapnya lama. “Jangan buat apa-apa sendirian lagi. Sekolah ini sedang dalam keadaan sensitif. Kalau kamu jumpa apa-apa, beritahu guru. Faham?”</p>\n<p>Khalid mengangguk perlahan. “Faham, cikgu.”</p>\n<p>Dia keluar dari pejabat itu dengan langkah perlahan, tetapi di dalam hati, firasatnya makin kuat — tempat itu memang menyimpan sesuatu. Bukan sekadar longgokan barang buangan.</p>\n<p>Dan di tengah perjalanan kembali ke kelas, angin membawa bau besi berkarat dan minyak mesin dari arah bengkel.</p>\n<p>Khalid berhenti, menoleh ke belakang. Dalam diam, dia berbisik,</p>\n<p class=\"dialogue\">“Kalau benar ini petunjuk, aku akan kembali ke sana.”</p>", "wordCount": 810}, {"num": 28, "fullTitle": "Bab 28 – Tandatangan dan Teguran", "title": "Tandatangan dan Teguran", "content": "<p>Kertas putih yang masih kosong di tangan Khalid terasa lebih berat daripada buku teks yang sering dibawanya. Di atas helaian itu, tertulis dengan tulisan tangan Cikgu Bakar:</p>\n<p class=\"dialogue\">“Dapatkan tandatangan semua guru yang mengajar kamu sebagai pengesahan kehadiran. Serahkan semula sebelum tamat minggu ini.”</p>\n<p>Itulah hukumannya — denda kecil atas kesalahan besar.</p>\n<p>Ponteng kelas tanpa kebenaran, walaupun dengan niat “menyiasat.”</p>\n<p>Khalid menghela nafas panjang. “Dapatkan tandatangan semua guru…,” ulangnya perlahan. Bunyi loceng waktu rehat bergema di koridor, memecah lamunannya.</p>\n<p>Dia menggenggam kertas itu erat-erat. Baiklah, fikirnya, aku akan selesaikan ini. Sekurang-kurangnya aku masih diberi peluang.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Beberapa tandatangan pertama diperoleh tanpa masalah.</p>\n<p>Cikgu Rahim, guru Matematik Tambahan, hanya tersenyum sambil menegur Khalid dengan nada bergurau.</p>\n<p class=\"dialogue\">“Lain kali kalau nak jadi detektif sekolah, jangan waktu belajar ya, Khalid.”</p>\n<p>Cikgu Zainab pula, guru Bahasa Melayu, sempat memberikan nasihat lembut.</p>\n<p class=\"dialogue\">“Kesalahan boleh dimaafkan, Khalid, tapi kepercayaan... susah nak pulih kalau dah tercalar.”</p>\n<p>Khalid hanya mengangguk, menyimpan setiap kata dalam hati. Satu demi satu nama diconteng dengan tanda tangan.</p>\n<p>Namun apabila tiba ke nama Cikgu Fatimah, langkahnya terhenti.</p>\n<p>Kertas itu seolah-olah tiba-tiba menjadi berat semula.</p>\n<p>Dia berdiri di hadapan makmal sains, memandang ke dalam melalui pintu kaca yang tertutup. Dari luar, dia dapat melihat Cikgu Fatimah sedang menyusun beberapa botol bahan kimia di atas meja panjang, wajahnya tenang seperti biasa — namun dalam diri Khalid, keberaniannya kian mengecil.</p>\n<p>Macam mana aku nak berdepan dengan dia? fikirnya.</p>\n<p>Ponteng kelas beliau semalam bukan hal kecil, apatah lagi dia tahu Cikgu Fatimah bukan jenis yang mudah menerima alasan.</p>\n<p>Khalid menarik nafas panjang. “Bismillah…,” gumamnya perlahan, cuba mengumpul kekuatan untuk melangkah masuk.</p>\n<p>Namun belum sempat tangannya menyentuh tombol pintu, satu suara dari belakang menegurnya — lembut tapi bersemangat.</p>\n<p class=\"dialogue\">“Eh, Khalid! Buat apa berdiri kat sini macam kena hukum?”</p>\n<p>Khalid menoleh. Wajahnya sedikit terkejut apabila mendapati yang menegurnya ialah Cikgu Malik, guru Pendidikan Jasmani yang terkenal dengan sikap mesra dan kelakar — dan antara guru yang paling disayangi pelajar.</p>\n<p class=\"dialogue\">“Err... Assalamualaikum, cikgu,” ujar Khalid, gugup sedikit. “Saya... sebenarnya tengah cari tandatangan guru-guru. Denda daripada Cikgu Bakar.”</p>\n<p class=\"dialogue\">“Ohh, pasal ponteng hari tu ya?” tanya Cikgu Malik sambil tersenyum lebar. “Haa, Cikgu Bakar tu memang garang sikit. Tapi bagus juga dia suruh kamu buat ni. Sekurang-kurangnya kamu kena jumpa semua cikgu. Dapat peluang minta maaf, kan?”</p>\n<p>Khalid tersenyum hambar. “Itulah yang saya tengah cuba, cikgu. Tapi…,” matanya menjeling ke arah makmal. “…saya belum jumpa Cikgu Fatimah lagi.”</p>\n<p class=\"dialogue\">“Ha! Patutlah muka kamu nampak macam nak masuk kandang singa,” kata Cikgu Malik sambil ketawa kecil. “Kalau setakat nak jumpa Cikgu Fatimah, senang je. Dia nampak garang, tapi hati lembut. Nak saya tolong?”</p>\n<p>Khalid terkejut sedikit. “Tolong, cikgu?”</p>\n<p class=\"dialogue\">“Ya lah,” jawab Cikgu Malik bersahaja. “Kebetulan saya pun nak jumpa dia pasal program sains sukan minggu depan. Biar saya bawa kamu sekali. Senang, tak payah takut.”</p>\n<p>Khalid tersenyum kecil, terasa lega walau sedikit. “Betul ke, cikgu? Terima kasih banyak-banyak.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Beberapa minit kemudian, mereka berdua masuk ke dalam makmal. Cikgu Fatimah sedang mencatat sesuatu dalam buku laporan, tidak menyedari kehadiran mereka pada awalnya.</p>\n<p class=\"dialogue\">“Assalamualaikum, Cikgu Fatimah,” sapa Cikgu Malik dengan ceria. “Rajin nampak hari ni, tengah siapkan bahan eksperimen ke?”</p>\n<p>Cikgu Fatimah mengangkat wajah, tersenyum nipis. “Waalaikumussalam, Cikgu Malik. Eh, lama tak nampak. Ada apa ya?”</p>\n<p class=\"dialogue\">“Saja nak bincang pasal kolaborasi sukan dan sains nanti,” jawabnya santai, kemudian menoleh ke arah Khalid. “Oh ya, saya bawa Khalid ni sekali. Dia ada hal dengan cikgu.”</p>\n<p>Cikgu Fatimah memandang Khalid. Renungannya tidak marah, tapi cukup untuk membuat Khalid menunduk. “Hal apa, Khalid?”</p>\n<p>Khalid menggenggam kertas di tangannya, menghulurkannya perlahan. “Err… saya kena denda, cikgu. Kena dapatkan tandatangan semua guru. Saya… minta maaf sebab ponteng kelas cikgu hari itu.”</p>\n<p>Suasana hening seketika. Cikgu Fatimah memandang Khalid lama sebelum melepaskan helaan nafas. “Kamu tahu sebab saya marah pelajar yang ponteng kelas saya, Khalid?”</p>\n<p>Khalid menggeleng.</p>\n<p class=\"dialogue\">“Sebab saya tak suka pelajar buang masa,” jawabnya tenang. “Kamu ni nampak rajin, tapi kalau terlalu sibuk dengan hal lain, pelajaran kamu boleh terabai. Saya cuma nak kamu ingat tujuan utama kamu datang ke sekolah ni.”</p>\n<p>Khalid mengangguk perlahan. “Saya faham, cikgu. Terima kasih.”</p>\n<p>Cikgu Fatimah mengambil pen, menandatangani ruang kosong di kertas itu, kemudian menulis satu baris kecil di bawah tandatangannya:</p>\n<p class=\"dialogue\">“Jangan lari dari tanggungjawab. Hadapi.”</p>\n<p>Dia memulangkan kertas itu kepada Khalid dengan senyuman lembut. “Anggap ini bukan sekadar denda, Khalid. Tapi peluang untuk kamu belajar sesuatu.”</p>\n<p>Khalid mengambil kertas itu dengan perasaan yang sukar digambarkan — lega, malu, dan terharu bercampur menjadi satu.</p>\n<p class=\"dialogue\">“Terima kasih, cikgu. Dan terima kasih juga, Cikgu Malik,” katanya sambil menunduk hormat.</p>\n<p>Cikgu Malik tersenyum dan menepuk bahunya. “Haa, nampak? Tak susah pun kalau berani hadap. Lain kali jangan tunggu saya datang, terus sahaja masuk. Hidup ini bukan semua hal perlu lari, kadang-kadang kena hadap muka yang kita takut.”</p>\n<p>Khalid ketawa kecil, namun dalam hatinya terasa hangat.</p>\n<p>Dia keluar dari makmal dengan kertas yang kini penuh dengan tandatangan — dan satu pesanan yang lebih bermakna daripada sekadar pengesahan kehadiran:</p>\n<p>Hadapi. Jangan lari.</p>\n<p>Kalimat itu seolah-olah bergema dalam fikirannya sepanjang hari — bukan hanya untuk denda ini, tetapi untuk kebenaran yang sedang dicarinya.</p>", "wordCount": 839}, {"num": 29, "fullTitle": "Bab 29 – Jejak di Sebalik Nama", "title": "Jejak di Sebalik Nama", "content": "<p>Langit petang mulai redup ketika Khalid melangkah keluar dari bilik guru dengan kertas dendanya yang kini lengkap ditandatangani. Angin lembut menyapa wajahnya, membawa bau rumput dari arah padang yang baru disiram air.</p>\n<p>Dia berasa lega — denda sudah selesai, dan buat pertama kali sejak beberapa hari kebelakangan ini, fikirannya sedikit lapang.</p>\n<p>Namun langkahnya terhenti sebaik tiba di simpang menuju ke perpustakaan.</p>\n<p>Dari jauh, dia terlihat Cikgu Muzammil, guru disiplin yang sering berwajah tegas, sedang berbual dengan dua orang pelajar berpakaian pengawas.</p>\n<p>Cikgu Muzammil ketawa kecil sambil menepuk bahu salah seorang daripada mereka — Edy. Di sebelah Edy pula berdiri Zamani, dengan ekspresi yang agak serius tetapi kelihatan selesa dalam perbualan itu.</p>\n<p>Mereka bertiga seperti sedang berbincang sesuatu, namun nada perbualan dan gerak tubuh mereka lebih menyerupai perbualan mesra antara rakan lama berbanding hubungan antara guru dan pelajar.</p>\n<p>Khalid bersembunyi sedikit di sebalik dinding koridor, memerhati dari jauh.</p>\n<p>Edy… Zamani… dan Cikgu Muzammil?</p>\n<p>Jantungnya berdegup sedikit laju. Ada sesuatu yang terasa janggal.</p>\n<p>Bukankah Cikgu Muzammil antara guru yang diberi tanggungjawab menyiasat kejadian kecurian baru-baru ini?</p>\n<p>Dan Edy serta Zamani — dua nama yang kerap muncul dalam radar siasatannya?</p>\n<p>Khalid menunduk sedikit, cuba mendengar. Suara mereka samar-samar, tetapi tawa kecil Cikgu Muzammil jelas kedengaran. Edy mengangguk-angguk, manakala Zamani sesekali menepuk tangan Cikgu Muzammil seolah-olah mereka sedang berkongsi satu rahsia yang tidak semua orang tahu.</p>\n<p>Apa hubungan mereka sebenarnya? fikir Khalid.</p>\n<p>Namun segera dia menepis perasaan syak itu.</p>\n<p>Tidak adil baginya untuk terus membuat kesimpulan. Selama ini pun, dia tahu betapa mudah prasangka menyesatkan arah fikiran.</p>\n<p>Cikgu Muzammil seorang guru yang dihormati — malah dia sendiri pernah menolong Khalid sebelum ini, walaupun dengan cara yang agak keras.</p>\n<p class=\"dialogue\">“Jangan fikir bukan-bukan, Khalid,” dia menenangkan diri perlahan-lahan. “Mungkin mereka cuma bincang hal pasukan pengawas… atau disiplin pelajar.”</p>\n<p>Dia berpaling dan meneruskan langkah ke perpustakaan tanpa menoleh lagi.</p>\n<p>Namun jauh di dalam hatinya, rasa curiga kecil itu tetap bersisa — seolah-olah satu benih yang baru disemai, menunggu masa untuk tumbuh.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Petang itu, Khalid pulang ke rumah lebih awal daripada biasa. Rumahnya sunyi; hanya kedengaran bunyi kipas berputar perlahan di ruang tamu. Dia meletakkan beg di atas meja belajar dan terus membuka komputer ribanya.</p>\n<p>Paparan skrin menyala, dan tanpa berlengah, dia menaip sesuatu di kotak carian:</p>\n<p class=\"dialogue\">“Kes pembunuhan di sekolah menengah 3 tahun lalu,” Beberapa pautan berita lama muncul di skrin. Kebanyakannya laporan pendek dari portal berita tempatan. Dia meneliti satu demi satu, mencari petunjuk yang mungkin berkait dengan sekolahnya.</p>\n<p>Beberapa minit kemudian, matanya tertumpu pada satu tajuk yang membuatkan dadanya terasa bergetar:</p>\n<p class=\"dialogue\">“Pelajar tingkatan lima ditemui mati di kawasan surau sekolah. Kes dipercayai bermotif dendam.”</p>\n<p>Khalid menekan tajuk itu. Laporan berita terbuka, memperincikan insiden ngeri yang berlaku hampir tiga tahun lalu.</p>\n<p>Nama sekolahnya disebut dengan jelas.</p>\n<p>Mangsa dikenal pasti sebagai Aiman Hakim, pelajar yang aktif dalam kokurikulum dan merupakan bekas ketua pengawas.</p>\n<p>Khalid membaca dengan teliti setiap baris artikel itu:</p>\n<p class=\"dialogue\">“Menurut sumber, mangsa dipercayai dibunuh antara jam 11 malam hingga 1 pagi di ruang wuduk surau sekolah. Tiada saksi yang melihat kejadian, namun polis menemui kesan pergaduhan di tempat kejadian…”</p>\n<p>Matanya terus menelusuri ayat-ayat seterusnya.</p>\n<p class=\"dialogue\">“Beberapa pelajar telah dipanggil untuk membantu siasatan, namun tiada sebarang tangkapan dibuat. Kes kemudiannya diserahkan semula kepada pihak sekolah dan ditutup selepas tiada bukti kukuh.”</p>\n<p>Khalid menggenggam tetikusnya kuat. Tiga tahun… dan tiada siapa yang dihukum?</p>\n<p>Namun ada satu perenggan kecil di hujung laporan yang benar-benar menarik perhatiannya:</p>\n<p class=\"dialogue\">“Mangsa merupakan pemain utama pasukan bola sepak sekolah dan dilaporkan mempunyai hubungan rapat dengan beberapa pengawas senior serta seorang guru yang aktif dalam kegiatan kokurikulum.”</p>\n<p>Khalid terpaku.</p>\n<p>Seorang guru yang aktif dalam kokurikulum… dan pengawas senior…</p>\n<p>Kepalanya terasa berat. Nama-nama yang disebut dalam fikirannya berputar seperti puzzle yang hampir lengkap, tetapi belum cukup jelas.</p>\n<p>Dia teringat kembali perbualan mesra antara Cikgu Muzammil, Edy, dan Zamani di koridor tadi.</p>\n<p>Bulu romanya meremang perlahan.</p>\n<p>Mungkinkah itu cuma kebetulan?</p>\n<p>Atau mungkin… bukan?</p>\n<p>Khalid menutup komputer ribanya perlahan-lahan. Dia termenung lama, memandang ke luar jendela. Langit malam mula berbalam, dan azan Isyak berkumandang dari surau kejiranan.</p>\n<p>Dalam keheningan itu, satu perasaan halus menyusup ke hatinya —</p>\n<p>bahawa kebenaran yang sedang dicarinya mungkin jauh lebih gelap daripada yang pernah dibayangkannya.</p>\n<p>Dan untuk pertama kali, Khalid mula bertanya pada dirinya sendiri —</p>\n<p>adakah dia benar-benar bersedia untuk mengetahui apa yang terselindung di sebalik kisah itu?</p>", "wordCount": 714}, {"num": 30, "fullTitle": "Bab 30 – Tanda yang Ditinggalkan", "title": "Tanda yang Ditinggalkan", "content": "<p>Pagi itu, langkah Khalid terasa berat sebaik tiba di perkarangan sekolah.</p>\n<p>Biasanya, dia akan disambut oleh suasana ceria — suara pelajar yang riuh di kantin, atau gelak tawa rakan-rakan yang menegur dari jauh.</p>\n<p>Namun hari ini, semuanya terasa berbeza.</p>\n<p>Seolah-olah udara yang menyelubungi sekolah itu telah bertukar — tebal, berat, dan dipenuhi bisik-bisik halus yang tajam seperti duri.</p>\n<p>Sebaik melangkah ke koridor utama, beberapa pelajar yang sedang berbual tiba-tiba berhenti bercakap. Pandangan mereka tertumpu padanya, dan walaupun mereka tidak bersuara, Khalid tahu sesuatu sedang diperkatakan.</p>\n<p>Ada yang menjeling sekilas, ada yang menunduk sambil berbisik, dan ada juga yang sengaja menoleh ke arah lain apabila pandangan mereka bertemu.</p>\n<p>Saiful yang perasan perubahan itu segera mendekati.</p>\n<p class=\"dialogue\">“Weh, kenapa semua tengok kau semacam je hari ni?” soalnya perlahan.</p>\n<p>Khalid menggeleng. “Entah. Aku pun tak tahu.”</p>\n<p>Namun jauh di dalam hati, dia dapat meneka.</p>\n<p>Selepas pertemuannya dengan Suria tempoh hari dan berita-berita tentang pelajar-pelajar yang dipanggil Cikgu Bakar untuk disoal siasat, ramai mula membuat andaian sendiri.</p>\n<p>Dan nampaknya, ada antara andaian itu yang kini tertumpu kepadanya.</p>\n<p>Ketika dia masuk ke kelas, keadaan juga tidak jauh berbeza.</p>\n<p>Beberapa pelajar yang biasanya menyapanya kini hanya memandang sekilas, sebelum beralih berbual dengan yang lain.</p>\n<p>Suasana kelas 5 Alfa terasa hambar. Suria yang duduk di bahagian hadapan sesekali menoleh ke arah Khalid, wajahnya berkerut seperti ingin berkata sesuatu tetapi ditahan.</p>\n<p>Khalid hanya menarik kerusinya dan duduk tanpa sepatah kata.</p>\n<p>Dia tidak mahu menambah sebarang salah faham.</p>\n<p>Kadang-kadang diam lebih kuat daripada penjelasan yang panjang.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Apabila loceng rehat berbunyi, hampir semua pelajar bergegas keluar menuju ke kantin.</p>\n<p>Namun Khalid tidak ikut serta.</p>\n<p>Dia tidak ke kantin, tidak juga ke perpustakaan seperti kebiasaannya.</p>\n<p>Saiful yang sempat menoleh ke arah bangkunya kehairanan.</p>\n<p class=\"dialogue\">“Weh, kau tak rehat ke?”</p>\n<p>Khalid hanya tersenyum nipis. “Takpelah. Aku nak keluar ambil angin kejap.”</p>\n<p>Tanpa menunggu jawapan, dia melangkah keluar dari kelas.</p>\n<p>Langkahnya perlahan, tetapi hatinya sarat dengan persoalan.</p>\n<p>Dia berjalan menyusuri koridor tingkat dua, melalui deretan kelas yang kini kosong. Dari situ, dia dapat melihat padang sekolah yang lapang dan sunyi, hanya beberapa murid tingkatan rendah yang bermain bola plastik di hujung padang.</p>\n<p>Angin yang bertiup lembut terasa dingin.</p>\n<p>Namun bagi Khalid, udara itu seperti menyimpan rahsia yang tidak mampu dijelaskan.</p>\n<p>Dia memejamkan mata seketika, cuba menenangkan fikiran — tapi semakin dia cuba berdiam, semakin kuat gema prasangka yang berputar di kepalanya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas waktu rehat, suasana kembali sibuk apabila pengumuman dibuat melalui pembesar suara.</p>\n<p class=\"dialogue\">“Semua pelajar diminta kekal di kelas masing-masing. Pemeriksaan antara kelas akan dijalankan sebentar lagi oleh pasukan pengawas.”</p>\n<p>Spot-check. Lagi.</p>\n<p>Riuh rendah mula kedengaran. Ada yang gelisah, ada yang sibuk menyembunyikan barang-barang yang tidak sepatutnya dibawa.</p>\n<p>Khalid hanya duduk tenang di tempatnya, tidak menunggu apa-apa.</p>\n<p>Pintu kelas 5 Alfa terbuka. Sekumpulan pengawas masuk dengan buku catatan dan beg galas.</p>\n<p>Di antara mereka — Edy.</p>\n<p>Khalid mengangkat wajah, dan pandangan mereka bertemu seketika.</p>\n<p>Edy tersenyum nipis — senyuman yang tidak mesra, tetapi cukup untuk membuat darah Khalid berderau.</p>\n<p class=\"dialogue\">“Baiklah semua, letakkan beg di atas meja masing-masing,” arah salah seorang pengawas. “Kami akan periksa satu per satu.”</p>\n<p>Masing-masing patuh. Suasana dalam kelas menjadi senyap, hanya kedengaran zip beg dibuka dan helaian kertas diselak.</p>\n<p>Khalid meletakkan begnya di atas meja seperti arahan. Tangannya terlipat, memerhati tanpa sebarang reaksi.</p>\n<p>Salah seorang pengawas membuka begnya dan mula memeriksa. Tiada apa yang luar biasa — buku teks, alat tulis, dan sebuah kotak kecil berisi nota.</p>\n<p>Namun beberapa detik kemudian, pengawas itu mengerutkan dahi.</p>\n<p>Dari ruang dalam beg, dia mengeluarkan sesuatu.</p>\n<p>Sebuah dompet kecil berwarna merah jambu dengan corak bunga di tepinya.</p>\n<p>Suasana kelas yang asalnya senyap kini menjadi tegang.</p>\n<p class=\"dialogue\">“Ni apa?” tanya pengawas itu, memandang ke arah Khalid.</p>\n<p>Khalid menegakkan badannya, memandang dompet itu dengan wajah kosong.</p>\n<p class=\"dialogue\">“Itu bukan milik saya,” katanya tenang.</p>\n<p>Edy, yang berdiri tidak jauh, menghampiri. “Nama siapa ini?” Dia membuka dompet itu dan mengeluarkan kad pelajar kecil di dalamnya.</p>\n<p class=\"dialogue\">“Balkis binti Hidayat,” katanya perlahan, namun cukup kuat untuk didengari seluruh kelas.</p>\n<p>Seketika, beberapa pelajar mula berbisik.</p>\n<p class=\"dialogue\">“Eh, tu nama pelajar 5 Beta kan?”</p>\n<p class=\"dialogue\">“Apa benda dompet dia buat dalam beg Khalid?”</p>\n<p class=\"dialogue\">“Eh, pelik ni…”</p>\n<p>Khalid masih tidak berganjak.</p>\n<p>Dia tahu, saat ini, apa-apa yang dia katakan akan dianggap alasan.</p>\n<p>Edy menatapnya lama. Ada senyuman sinis yang muncul di bibirnya — senyuman yang Khalid kenal sangat.</p>\n<p class=\"dialogue\">“Encik Khalid,” katanya dengan nada separuh mengejek, “saya rasa kita kena bincang hal ni dengan Cikgu Bakar.”</p>\n<p>Khalid menghela nafas panjang. “Baiklah.”</p>\n<p>Dia bangun perlahan, memikul begnya sendiri. Walaupun semua mata memandang, dia tidak menunduk. Tidak juga mempertahankan diri.</p>\n<p>Langkahnya tenang — tetapi di sebalik ketenangan itu, ada badai yang sedang menunggu untuk meletus.</p>\n<p>Dan di dalam hati kecilnya, dia tahu —</p>\n<p>seseorang sedang cuba menjatuhkannya.</p>", "wordCount": 774}, {"num": 31, "fullTitle": "Bab 31 – Kebenaran yang Terpendam", "title": "Kebenaran yang Terpendam", "content": "<p>Bunyi detikan jam di dinding pejabat disiplin bergema perlahan, namun cukup untuk menambah tekanan yang bersarang dalam dada Khalid.</p>\n<p>Dia duduk di atas kerusi kayu berhadapan dengan meja besar milik Cikgu Bakar, lelaki bertubuh sasa yang terkenal dengan wajah tegas dan suara garang.</p>\n<p>Di belakangnya, fail-fail tebal tersusun rapi di rak, dan di tepi tingkap, cahaya matahari lewat
