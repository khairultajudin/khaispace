  <script>
    const chapters = [{"num": 1, "fullTitle": "Bab 1 – Riuh 5 Alfa", "title": "Riuh 5 Alfa", "content": "<p>Kring! Kring!</p>\n<p>Loceng sekolah berbunyi nyaring menandakan waktu rehat telah tamat. Derapan langkah pelajar bergema di sepanjang koridor. Dari arah kantin, kelihatan mereka berpusu-pusu kembali ke kelas masing-masing, ada yang berlari, ada yang masih sempat bersembang, dan ada juga yang seakan tidak peduli langsung dengan bunyi loceng itu.</p>\n<p>Di tingkat dua bangunan utama, suasana di Kelas 5 Alfa mula kembali meriah. Kelas itu sememangnya terkenal, bukan sahaja kerana prestasi akademik para pelajarnya, tetapi juga kerana sifat mereka yang ceria dan penuh dengan ragam remaja.</p>\n<p>Kedudukan 5 Alfa adalah yang tertinggi antara kelas-kelas lain. Dihuni oleh dua puluh dua pelajar perempuan dan sebelas pelajar lelaki, semuanya dianggap “anak emas,” sekolah. Setiap kali keputusan peperiksaan diumumkan, nama mereka sering meniti di bibir guru dan pengetua.</p>\n<p>Namun pada petang itu, sebelum guru sempat tiba, kelas 5 Alfa sudah berubah menjadi seperti pasar malam kecil. Di satu sudut, kedengaran suara sekumpulan pelajar lelaki yang sedang bersemangat membincangkan topik yang tidak pernah lekang di mana-mana sekolah iaitu bola sepak.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p class=\"dialogue\">“Korang tengok bola semalam? MU lawan MC?” soal Saiful, ketua kelas yang terkenal dengan sikap tanggungjawabnya.</p>\n<p class=\"dialogue\">“Tak dapat tengok, weh. Ayah aku nak tengok wrestling. TV rumah aku dia punya. Huhu.” Zubir mengeluh panjang.</p>\n<p class=\"dialogue\">“Haha! Anak ayah betul.” Haziq menyakat sambil ketawa besar.</p>\n<p class=\"dialogue\">“MU kalah, tahu!” sambung Haziq lagi dengan nada puas hati.</p>\n<p class=\"dialogue\">“Yelah, tapi pengadil tu berat sebelah betul. Tak adil langsung!” celah Fahmi yang baru sahaja tiba sambil menarik kerusi.</p>\n<p class=\"dialogue\">“Biasalah. MC kan kelab kaya. Semua boleh beli.” Saiful menambah sambil tersenyum sinis.</p>\n<p class=\"dialogue\">“Dah kalah, terimalah. Jangan alasan.” Haziq terus mengusik sambil mengangkat kening.</p>\n<p class=\"dialogue\">“Ini semua sebab Mourinho. Dulu zaman Sir Alex, MU gah. Sekarang macam main parking bus saja.” ujar Fahmi, penyokong tegar MU, dengan wajah kecewa.</p>\n<p>Safwan yang dari tadi hanya memerhati, mencelah, “Betul tu. Ferguson dulu bijak susun strategi. Sekarang, hancur.”</p>\n<p class=\"dialogue\">“Taktikal Pep Guardiola susah nak lawan. Dia bijak.” Hazwan menambah.</p>\n<p>Perbincangan semakin rancak. Suasana kelas yang tadi tenang kini kembali riuh, suara mereka bersahutan memenuhi ruang kelas.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sementara itu, di hujung kelas yang lain, dua pelajar lelaki sedang sibuk berbual tentang hal yang lebih moden — gajet.</p>\n<p class=\"dialogue\">“Eh, aku dengar Apple nak keluarkan iPhone terbaru. Teknologi baru, bro. Aku nak beli lah.” kata Jeffri dengan wajah teruja.</p>\n<p class=\"dialogue\">“Tak ke mana pun Apple tu. Lepas Steve Jobs meninggal, habis jatuh. Sekarang ni semua sama je.” balas Amri dengan gaya ‘pakar’.</p>\n<p class=\"dialogue\">“Tapi aku masih percaya kat Apple. Barang dia ada kualiti. Jenama lain cepat panas, bateri cepat habis.” Jeffri mempertahankan.</p>\n<p>Amri tersengih, lalu mengeluarkan sesuatu dari poketnya. “Ayah aku baru belikan ni. Nexus model baru. Gila padu.”</p>\n<p>Dia meletakkan telefon itu di atas meja. Jeffri menatapnya penuh kagum.</p>\n<p class=\"dialogue\">“Sekarang ni Nexus nombor satu dunia dari segi kualiti. Rugi tak beli.” Amri berlagak sambil tersenyum bangga.</p>\n<p class=\"dialogue\">“Habis, phone lama kau?” tanya Jeffri.</p>\n<p class=\"dialogue\">“Dah jual separuh harga. Duit tu aku guna beli benda lain. Lagipun bapa aku kan kaya. Apa aku nak, dia belikan.” kata Amri dengan nada bermegah.</p>\n<p>Jeffri terdiam, senyum tawar. Dalam hati kecilnya, dia menyimpan satu impian — suatu hari nanti aku pun akan ada telefon macam tu.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Tiba-tiba, suara kuat dari luar kelas memecah tumpuan mereka.</p>\n<p class=\"dialogue\">“Perhatian! Perhatian!”</p>\n<p>Jeritan itu datang daripada Siti, pelajar perempuan yang terkenal dengan sikap kepoh dan suka menjadi ‘wartawan kelas’. Di belakangnya, dua lagi sahabat baiknya — Halijah dan Syikin — mengekor rapat seperti pembantu lapangan.</p>\n<p class=\"dialogue\">“Apa hal kau, Siti?” jerit Yana dari dalam kelas.</p>\n<p>Suasana kelas yang riuh tadi tiba-tiba senyap. Semua mata tertumpu ke arah pintu.</p>\n<p>Siti menahan nafas seketika sebelum bersuara, “Kita akan dapat kawan baru!”</p>\n<p>Serentak, kedengaran suara pelajar perempuan bersorak kecil.</p>\n<p class=\"dialogue\">“Lelaki ke perempuan?” tanya Yana teruja.</p>\n<p class=\"dialogue\">“Wow, betul ke ni?” tanya Suria pula, wajahnya berseri-seri.</p>\n<p class=\"dialogue\">“Tadi aku nampak Cikgu Fauziah dengan budak lelaki dekat pejabat. Macam budak pandai, ada logo MRSM lagi. Takkan la bukan untuk kelas kita.” Siti menyampaikan “laporan eksklusifnya,” dengan penuh gaya.</p>\n<p>Bisikan-bisikan kecil mula kedengaran. Kelas kembali hidup — kali ini dengan topik baharu.</p>\n<p class=\"dialogue\">“Handsome tak budak tu?” Suria bertanya lagi sambil menahan senyum.</p>\n<p>Siti tersengih. “Boleh tahan la. Pandang pun rasa cair.”</p>\n<p class=\"dialogue\">“Haha, dah bosan tengok muka budak lelaki kelas ni agaknya,” balas Yana sambil ketawa.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Di sudut lain, Haziq yang mendengar perbualan itu menyampuk,</p>\n<p class=\"dialogue\">“Ha baguslah. Kalau lelaki, cukup la 11 orang untuk team bola kita nanti.”</p>\n<p>Saiful ketawa kecil. “Bukan dah cukup ke?”</p>\n<p class=\"dialogue\">“Ada la sorang tu kaki bangku. Asyik main telefon je,” sindir Haziq, disambut gelak tawa rakan-rakannya.</p>\n<p>Kelas sekali lagi menjadi riuh rendah — sehinggalah tiba-tiba, jeritan lain kedengaran dari arah tangga.</p>\n<p class=\"dialogue\">“Weh! Cikgu Fauziah dah datang!”</p>\n<p>Seketika, seluruh kelas kelam-kabut. Suara kerusi diseret bersahut-sahutan. Dalam masa kurang lima minit, semua pelajar sudah duduk dengan penuh tertib, seolah-olah tiada apa yang berlaku sebentar tadi.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Pintu kelas terbuka.</p>\n<p>Cikgu Fauziah masuk, diikuti oleh seorang pelajar lelaki yang kelihatan segak dan tenang. Langkahnya kemas, bajunya diseterika rapi, wajahnya sederhana tapi ada sesuatu yang menarik — karisma yang sukar dijelaskan.</p>\n<p class=\"dialogue\">“Assalamualaikum semua.”</p>\n<p>Serentak kelas menjawab, “Waalaikumussalam, cikgu.”</p>\n<p class=\"dialogue\">“Hari ini, kamu akan mendapat seorang pelajar baru yang akan bersama kamu di 5 Alfa.”</p>\n<p>Pelajar baru itu masih tunduk, tidak banyak bergerak.</p>\n<p>Cikgu Fauziah menoleh kepadanya. “Silakan perkenalkan diri.”</p>\n<p>Lelaki itu mengangkat muka, menatap seketika ke arah seluruh kelas.</p>\n<p class=\"dialogue\">“Assalamualaikum. Nama saya Khalid.”</p>\n<p>Suasana sepi beberapa saat.</p>\n<p>Beberapa pelajar perempuan berpandangan sesama sendiri — ada yang senyum, ada yang berbisik. Pelajar lelaki pula sekadar mengangkat kening, menilai wajah baharu yang kini akan menjadi sebahagian daripada dunia mereka.</p>", "wordCount": 903}, {"num": 2, "fullTitle": "Bab 2 – Pelajar Baharu", "title": "Pelajar Baharu", "content": "<p class=\"dialogue\">“Assalamualaikum, nama saya Mohd Khalid bin Tarmizi. Boleh panggil saya Khalid.”</p>\n<p>Suaranya tenang, perlahan, tapi cukup untuk memecahkan suasana yang senyap itu. Senyumannya tidak terlalu lebar, sekadar manis dan beradab.</p>\n<p>Beberapa pelajar perempuan di barisan tengah menahan diri daripada bersorak kecil.</p>\n<p class=\"dialogue\">“Handsome kot budak ni,” bisik Suria sambil tersenyum ke arah Yana.</p>\n<p>Yana mengerling. “Dah agak dah. Nampak gayanya kelas kita makin meriah lepas ni.”</p>\n<p>Khalid mengangkat sedikit wajahnya. Matanya memerhati sekeliling, namun dia lebih banyak memandang ke arah barisan lelaki. Dia seakan berhati-hati dengan perhatian yang diterimanya.</p>\n<p>Cikgu Fauziah tersenyum. “Khalid, boleh cikgu tanya sesuatu?”</p>\n<p>Khalid segera menoleh dan mengangguk sopan.</p>\n<p class=\"dialogue\">“Ayah kamu Prof Tarmizi?”</p>\n<p class=\"dialogue\">“Ya, ayah saya Prof Tarmizi,” jawab Khalid tenang, senyum nipis di bibir.</p>\n<p>Riak wajah Cikgu Fauziah berubah seketika — ada sesuatu dalam renungannya yang sukar ditafsirkan oleh pelajar-pelajarnya.</p>\n<p>Cikgu Fauziah lalu mempersilakan Khalid mengambil tempat di dalam bilik tersebut.</p>\n<p class=\"dialogue\">“Ok, baiklah, berkenal-kenalan dulu ya. Khalid boleh duduk di kerusi yang kosong tu.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid ditempatkan di kerusi paling hadapan, di sebelah kiri kelas, bersebelahan dengan Saiful — ketua kelas yang ramah dan disegani.</p>\n<p>Belum sempat dia mengeluarkan buku, beberapa pelajar lelaki sudah datang mengerumuninya.</p>\n<p class=\"dialogue\">“Nama aku Saiful Anuar. Ketua kelas kat sini. Kalau ada apa-apa, cari aku je,” kata Saiful sambil menghulurkan tangan.</p>\n<p>Khalid menyambut salam itu dengan senyuman. “Baik, terima kasih.”</p>\n<p class=\"dialogue\">“Aku Fahmi, ketua pengawas sekolah. Kalau nak aku cover ponteng ke apa, bagitau je. Haha.” Fahmi menyelit, membuatkan semua yang lain ketawa kecil.</p>\n<p>Satu persatu rakan sekelas memperkenalkan diri. Suasana jadi hangat, seperti kenduri kecil menyambut ahli baru.</p>\n<p>Haziq pula mencelah, “Eh, ayah kau profesor, ya? Best la. Mesti kau pandai kan?”</p>\n<p>Khalid menggeleng perlahan. “Ayah aku pensyarah dekat UTM, tapi aku rasa sama sahaja macam korang. Aku pun hidup sendiri. Dah lama berdikari.”</p>\n<p>Zubir yang gemar menyakat, mengangkat kening. “Alah, janganlah merendah diri sangat.”</p>\n<p>Khalid hanya tertawa kecil. “Aku cuma rasa tak perlu nak beza-bezakan. Semua orang ada kelebihan masing-masing.”</p>\n<p>Kata-katanya membuatkan suasana sebentar tadi bertukar sedikit hening — satu bentuk hormat yang terbit secara semula jadi.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Fahmi menukar topik. “Kau main bola tak, Khalid?”</p>\n<p>Safwan cepat menyampuk, “Confirm tahu main. Tengok badan pun dah macam Cristiano Ronaldo.”</p>\n<p class=\"dialogue\">“Haha. Tahu sikit-sikit je. Nak score gol tu boleh la,” jawab Khalid bersahaja.</p>\n<p>Tawa kembali pecah.</p>\n<p class=\"dialogue\">“Ha baguslah! Boleh join main petang-petang nanti,” kata Haziq teruja.</p>\n<p class=\"dialogue\">“Insya-Allah,” balas Khalid ringkas, namun nadanya jujur.</p>\n<p>Seketika kemudian, Saiful kembali bersuara. “Khalid, boleh aku tanya sesuatu?”</p>\n<p class=\"dialogue\">“Tanyalah,” balas Khalid tenang.</p>\n<p class=\"dialogue\">“Kenapa kau pindah sekolah? Aku dengar kau dari MRSM. Betul ke?”</p>\n<p>Pertanyaan itu membuatkan Khalid berhenti tersenyum.</p>\n<p>Suasana di sekeliling perlahan-lahan senyap. Fahmi, Haziq, dan Safwan saling berpandangan.</p>\n<p>Khalid menghela nafas, matanya memandang ke luar tingkap. “Ya... aku dari MRSM. Tapi kadang-kadang bukan semua benda kita boleh kekalkan, kan? Ada yang Allah ubah untuk uji kita.”</p>\n<p>Nada suaranya lembut tapi berat. Saiful hanya mengangguk perlahan.</p>\n<p>Dialog ditamatkan dan sesi pembelajaran diteruskan oleh Cikgu Fauziah sebaik sahaja keadaan kelas kembali tenang.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Jam menunjukkan pukul 1.30 tengah hari.</p>\n<p>Khalid masih di dalam kelas, menyusun bukunya perlahan-lahan sementara rakan-rakan lain sudah berlari keluar seperti pelarian bebas.</p>\n<p>Kadang-kadang Khalid hairan melihat mereka. Apakah yang mereka kejar sangat di luar sana?</p>\n<p>Dia tersenyum kecil dan menutup begnya.</p>\n<p>Sebaik melangkah keluar dari kelas, dia terlihat Saiful baru selesai menghantar buku ke bilik guru.</p>\n<p class=\"dialogue\">“Eh, Khalid. Balik naik apa?” tanya Saiful.</p>\n<p class=\"dialogue\">“Jalan kaki je. Tapi… boleh aku tanya, surau kat mana? Aku nak solat Zuhur dulu.”</p>\n<p>Saiful terpinga seketika, seolah tidak menyangka soalan itu.</p>\n<p class=\"dialogue\">“Oh, surau dekat belakang Blok C. Kau jalan terus, nanti nampak bangunan warna kuning. Kat situ lah.”</p>\n<p class=\"dialogue\">“Terima kasih. Jom la solat sekali,” ajak Khalid dengan nada bersahaja.</p>\n<p>Saiful menggeleng. “Er… tak boleh. Pemandu ayah aku dah tunggu. Nanti kena marah kalau lambat.”</p>\n<p>Khalid mengangguk, masih tersenyum. “Ohh. Ok. Baiklah. Tak apa. Aku pergi dulu ya.”</p>\n<p>Dia melangkah pergi dengan tenang, meninggalkan Saiful yang masih terpaku memandang langkahnya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Surau sekolah itu kecil dan sederhana, namun bersih.</p>\n<p>Kipas siling berputar perlahan, menghasilkan bunyi whirr-whirr yang menenangkan.</p>\n<p class=\"dialogue\">“Allahu Akbar, Allahu Akbar…”</p>\n<p>Azan Khalid bergema lembut dari corong pembesar suara. Suaranya tidak kuat, tapi cukup merdu untuk menarik perhatian.</p>\n<p>Beberapa minit kemudian, beberapa pelajar dan seorang guru hadir untuk solat berjemaah.</p>\n<p>Khalid mengiqamahkan, dan guru itu mengimami solat Zuhur.</p>\n<p>Selesai memberi salam, lalu berdoa ringkas. Kemudian guru tersebut berpaling. “Kamu yang azan tadi?”</p>\n<p>Khalid mengangguk sopan. “Ya, cikgu. Saya yang azankan tadi. Saya pelajar baru dekat sini.”</p>\n<p>Guru itu memandangnya seketika. “Khalid, ya?”</p>\n<p class=\"dialogue\">“Ya, cikgu.”</p>\n<p class=\"dialogue\">“Bagus. Tapi… hati-hati ya, nak.”</p>\n<p>Khalid mengangkat wajah, agak keliru. “Hati-hati? Maksud cikgu?”</p>\n<p>Namun guru itu hanya tersenyum kecil, lalu bangun dan keluar dari surau tanpa menjawab.</p>\n<p>Khalid masih terpaku di tempatnya. Hati-hati? Dengan siapa? Dengan apa?</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas solat, Khalid meneruskan perjalanan pulang.</p>\n<p>Rumahnya terletak kira-kira dua kilometer dari sekolah — tidak jauh, tapi cukup untuk membuat peluhnya menitis.</p>\n<p>Dia melalui lorong kedai. Bau makanan bercampur bau asap motor. Panas petang membakar kulit.</p>\n<p>Khalid berhenti di sebuah kedai minuman.</p>\n<p class=\"dialogue\">“Teh ais satu, pakcik,” pesannya sambil duduk di bangku kayu usang.</p>\n<p>Ketika menunggu, fikirannya melayang kepada pesan guru tadi — “Hati-hati.”</p>\n<p>Dia cuba mentafsir maksudnya, tapi gagal.</p>\n<p class=\"dialogue\">“Ini airnya,” ujar pakcik itu sambil meletakkan gelas di hadapan Khalid.</p>\n<p>Khalid mengangkat gelas, meneguk perlahan.</p>\n<p class=\"dialogue\">“Alhamdulillah,” bisiknya. “Yang buat air manusia, tapi yang hilangkan dahaga — Allah.”</p>\n<p>Tiba-tiba, bunyi dentuman kuat memecah tumpuannya.</p>\n<p class=\"dialogue\">“Bang!”</p>\n<p>Seorang remaja lelaki terlanggar seorang lelaki berbadan sasa hingga dulang makanan terbalik, kuah dan nasi tumpah ke baju lelaki itu.</p>\n<p class=\"dialogue\">“Mata kau kat mana?! Kotor baju aku! Siapa nak ganti ni?!” jerkah lelaki sasa itu, suaranya mengaum.</p>\n<p>Remaja itu tunduk ketakutan. “Maaf bang, saya tak sengaja...”</p>\n<p>Pemilik kedai, Pak Yusuf, cepat datang menenangkan.</p>\n<p class=\"dialogue\">“Maaf Datuk Ramli, budak ni pekerja saya. Dia tak sengaja. Saya ganti rugi, ya.”</p>\n<p>Namun kemarahan “Datuk,” itu tidak reda.</p>\n<p>Dengan muka merah padam, dia menumbuk remaja itu bertubi-tubi hingga jatuh tersungkur. Suasana kedai menjadi senyap.</p>\n<p>Khalid berdiri, langkahnya perlahan. Matanya tajam menatap remaja yang kini menggenggam penumbuk, matanya berapi.</p>\n<p>Sesuatu tentangnya terasa ganjil — seperti dia bukan sekadar budak biasa.</p>", "wordCount": 997}, {"num": 3, "fullTitle": "Bab 3 – Pertemuan Tak Terduga", "title": "Pertemuan Tak Terduga", "content": "<p class=\"dialogue\">“Datuk?!” hampir terlepas dari mulut Khalid.</p>\n<p>Dia berdiri terpaku, memerhati pergaduhan yang tercetus di depan matanya. Remaja yang tadi ditumbuk kini sudah bangun, matanya menyala marah.</p>\n<p>Tanpa sebarang amaran, remaja itu menjerit,</p>\n<p class=\"dialogue\">“Arghhh!”</p>\n<p>Tubuh kecilnya meluru ke arah Datuk Ramli lalu menghadiahkan satu penumbuk tepat ke pipinya. Tidak cukup dengan itu, satu tendangan kuat mengenai perut lelaki berusia itu. Serangan bertubi-tubi menghujani Datuk Ramli sehingga tubuh sasa itu rebah ke lantai dengan darah mengalir di tepi bibirnya.</p>\n<p>Pak Yusuf yang berdiri tidak jauh daripada tempat kejadian berasa tergamam. Para pelanggan juga terdiam, seolah-olah dunia berhenti seketika.</p>\n<p>Kedai makan yang sebentar tadi riuh kini menjadi senyap.</p>\n<p>Remaja itu menghela nafas panjang, memandang Datuk Ramli yang terbaring kesakitan. Dia kemudian melangkah ke dalam dapur, keluar semula dengan beg silang di bahunya.</p>\n<p class=\"dialogue\">“Tak kisah kau Datuk ke, Menteri ke, Ayahanda ke. Kalau orang minta maaf dengan cara baik, jangan balas dengan tangan. Aku paling pantang orang macam tu!” katanya lantang sebelum berlalu keluar dari kedai.</p>\n<p>Khalid berdiri tegak, fikirannya berputar. Ada sesuatu pada remaja itu — bukan sekadar marah, tapi maruah yang dilukai.</p>\n<p>Tanpa berfikir panjang, Khalid segera ke kaunter, membayar minumannya, dan mengekori langkah remaja itu dari belakang.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Dia mempercepat langkah, tapi remaja itu berjalan laju, seolah sudah biasa dikejar.</p>\n<p>Ketika mereka melalui bangunan kedai lama, Khalid hilang kelibatnya. Dia menoleh ke kiri dan kanan, dadanya turun naik.</p>\n<p>Ke mana dia pergi?</p>\n<p>Tiba-tiba sesuatu menjerut lehernya dari belakang. Nafasnya tersekat.</p>\n<p class=\"dialogue\">“Kau nak apa cari aku?! Nak cari pasal?!”</p>\n<p>Suara itu garau, marah, tapi terkawal. Khalid cuba menarik nafas, mukanya merah menahan tekanan pada tengkuk.</p>\n<p class=\"dialogue\">“Okay, okay! Minta maaf, lepaskan dulu! Aku tak datang nak cari gaduh!”</p>\n<p>Lelaki itu melepaskan genggaman perlahan-lahan.</p>\n<p>Khalid menarik nafas panjang, terbatuk kecil. “Terima kasih...”</p>\n<p>Remaja itu memandangnya dengan pandangan tajam. “Apa kau nak dari aku?”</p>\n<p>Khalid menggeleng. “Tak ada apa. Aku cuma kagum. Cara kau hadap Datuk tadi... buat aku teringat kawan lama aku. Dia pun berani macam kau.”</p>\n<p>Belum sempat dia menghabiskan ayat, tangan kasar itu menekup mulutnya.</p>\n<p class=\"dialogue\">“Aku tak ada masa nak dengar pujian kosong.” katanya dingin.</p>\n<p>Khalid mengangguk bila dilepaskan. “Baiklah, kalau macam tu, boleh aku tahu nama kau?”</p>\n<p>Remaja itu merenungnya sejenak sebelum menjawab perlahan, “Orang panggil aku Kit.”</p>\n<p>Khalid tersenyum kecil. “Aku Khalid. Selamat berkenalan.”</p>\n<p>Dia menghulurkan tangan. Kit teragak-agak, tapi akhirnya menyambut juga.</p>\n<p>Untuk seketika, suasana di antara mereka menjadi tenang.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Mereka berjalan beriringan menyusuri lorong sempit itu. Langit petang mula bertukar jingga.</p>\n<p class=\"dialogue\">“Sebelum ni aku tak pernah nampak kau kat kawasan ni,” kata Kit.</p>\n<p class=\"dialogue\">“Aku baru pindah ke sini. Dulu tinggal di Shah Alam. Sekarang belajar kat SMK Sri Dian.”</p>\n<p>Kit mengangguk perlahan.</p>\n<p class=\"dialogue\">“Aku dah lama tak ke sekolah. Dalam erti kata lain, aku dah berhenti.”</p>\n<p>Khalid sedikit terkejut. “Oh... maaf kalau aku tanya benda yang salah.”</p>\n<p class=\"dialogue\">“Tak apa. Dah biasa. Hidup ni bukan semua orang dapat peluang yang sama.”</p>\n<p>Nada Kit mendatar, tapi dalam suaranya ada sesuatu — luka lama yang belum sembuh.</p>\n<p class=\"dialogue\">“Kau sekolah mana dulu?” tanya Khalid.</p>\n<p>Kit menoleh sekilas, senyum nipis. “SMK Sri Dian juga.”</p>\n<p>Khalid terhenti langkah. “Hah? Sekolah aku sekarang tu?”</p>\n<p>Kit ketawa kecil, tapi tawanya hambar. “Tunggu kedatangan aku, Khalid. Dah lama aku tak buat huru-hara di sekolah tu.”</p>\n<p>Khalid terpinga, tidak sempat bertanya lanjut.</p>\n<p class=\"dialogue\">“Aku pergi dulu. Kirim salam kat Cikgu Fatimah.”</p>\n<p>Kit menepuk bahunya, kemudian beredar menyusuri jalan kecil, meninggalkan Khalid yang masih terpaku.</p>\n<p>Cikgu Fatimah? Dia kenal Cikgu Fatimah? Bekas pelajar sekolah aku?</p>\n<p>Soalan itu berputar di kepala Khalid tanpa jawapan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Rumah Khalid sunyi sepi.</p>\n<p>Hanya bunyi jam berdetik menemani ruang tamu. Dia tinggal bersama bapanya, Profesor Tarmizi, seorang pensyarah di UTM. Namun lelaki itu jarang berada di rumah — lebih banyak masa dihabiskan di bilik kerjanya.</p>\n<p>Khalid menjatuhkan beg di sofa dan merebahkan diri. Keletihan perjalanan siang tadi terus menenggelamkannya dalam lena yang pendek.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas Maghrib, dia duduk di ruang tamu menonton televisyen. Saluran berganti-ganti — dari sukan ke hiburan, akhirnya berhenti di siaran Astro Awani.</p>\n<p class=\"dialogue\">“Seorang Datuk telah dipukul oleh seorang remaja lelaki yang merupakan pekerja sebuah kedai makan. Pemilik kedai tersebut turut disaman dan diarahkan membayar ganti rugi. Polis kini sedang menjejaki remaja berkenaan untuk membantu siasatan.”</p>\n<p>Khalid tersandar sambil tersenyum kecil. “Haha... padan muka Datuk tu. Marah tak bertempat.”</p>\n<p>Namun senyumannya hilang apabila wajah Pak Yusuf terpampang di skrin — meminta maaf dan merayu agar saman ditarik balik.</p>\n<p class=\"dialogue\">“Kesian Pak Yusuf... tak pasal-pasal kena tempias,” bisik Khalid.</p>\n<p>Dia bangun perlahan, matanya tajam menatap skrin.</p>\n<p class=\"dialogue\">“Aku kena cari Kit.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid segera bersiap. Baru sahaja dia mencapai basikal di depan rumah, suara bapanya bergema dari ruang kerja.</p>\n<p class=\"dialogue\">“Nak ke mana tu, Khalid?”</p>\n<p>Khalid menoleh pantas. “A... ayah. Keluar sekejap, jumpa kawan.”</p>\n<p>Profesor Tarmizi tersenyum nipis. “Baru pindah dah ada kawan, ya.”</p>\n<p class=\"dialogue\">“Hehe... Khalid pergi dulu. Assalamualaikum.”</p>\n<p>Dia segera beredar sebelum sempat bapanya bertanya lebih lanjut.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Kayuhan Khalid laju membelah jalan gelap. Lampu jalan di kiri kanan berkelip malap. Angin malam menampar wajahnya, tapi fikirannya hanya tertumpu pada satu nama — Kit.</p>\n<p>Dia tiba di kawasan perumahan flat lama, tempat terakhir dia melihat remaja itu.</p>\n<p>Suasana sunyi, hanya kedengaran bunyi anjing menyalak dari jauh.</p>\n<p class=\"dialogue\">“Mungkin sini tempat dia,” bisiknya sambil menolak basikal perlahan-lahan.</p>\n<p>Tiba-tiba, dari arah gelap lorong, muncul seorang lelaki berpakaian serba hitam.</p>\n<p>Kepalanya bertopeng, langkahnya tergesa. Di tangan kanannya sebilah parang, di tangan kirinya bungkusan hitam.</p>\n<p>Lelaki itu berlari ke arah Khalid tanpa amaran.</p>\n<p class=\"dialogue\">“Cepat! Bawa aku ke tempat kau!” jeritnya.</p>\n<p class=\"dialogue\">“Hah?! Apa ni?”</p>\n<p class=\"dialogue\">“Cepatlah! Nak tunggu mati ke?!”</p>\n<p>Lelaki itu terus melompat ke tempat duduk belakang basikal Khalid, menekan bahunya agar bergerak.</p>\n<p>Belum sempat Khalid bertanya, tiga orang lelaki lain muncul di hujung jalan, masing-masing memegang parang.</p>\n<p>Khalid tidak punya pilihan. Dia mengayuh sekuat hati, jantungnya berdegup laju.</p>\n<p>Suara jeritan dan langkah kejaran bergema di belakang.</p>\n<p class=\"dialogue\">“Laju lagi!” jerit lelaki bertopeng itu.</p>\n<p>Basikal meluncur laju di jalan sempit. Nafas Khalid sesak, tangannya menggigil.</p>\n<p>Tiba-tiba, tayar depan tersangkut pada batu jalan, dan mereka tergelincir ke dalam semak.</p>\n<p>Tubuh Khalid terhumban ke tanah. Penglihatannya berpinar, bunyi berdesing memenuhi telinga.</p>\n<p>Dalam kabur itu, dia sempat mendengar jeritan, hentakan, dan bunyi logam yang berlaga tajam.</p>\n<p>Sebelum pandangannya gelap sepenuhnya, sepasang tangan pantas menarik kolar jaketnya, mengheret tubuhnya ke sebalik timbunan palet kayu dan dinding konkrit sempit. Nafas Khalid termengah-mengah, hampir menjerit kerana cemas, namun satu tapak tangan kasar menekup kemas mulutnya.</p>\n<p class=\"dialogue\">“Syhh... diam kalau nak hidup!” bisik satu suara yang sangat dikenalinya—Kit.</p>\n<p>Dari celah palet kayu, Khalid dapat melihat tiga lelaki bersenjata tadi meluru melepasi lorong mereka dengan jeritan amarah yang beransur-ansur menjauh ke arah jalan besar. Jantung Khalid berdegup kencang seperti mahu pecah.</p>\n<p>Setelah keadaan kembali hening, Kit melepaskan tekupan tangannya. Wajah remaja itu kelihatan calar-balar, tetapi matanya tetap dingin dan tidak gentar.</p>\n<p class=\"dialogue\">“Kau gila ke ikut aku sampai ke lorong ni, budak baru?” bisik Kit serak.</p>\n<p class=\"dialogue\">“A... aku nak pastikan kau selamat...” jawab Khalid terbatuk-batuk kecil, dadanya masih berombak kencang.</p>\n<p>Kit terdiam seketika, merenung Khalid dengan pandangan yang sukar dimengerti. Dia kemudian membantu Khalid bangkit dan menolak basikal yang sedikit bengkok pemegangnya, memimpin Khalid menyusuri jalan tikus sehingga tiba berhampiran persimpangan lampu jalan taman perumahan Khalid.</p>\n<p class=\"dialogue\">“Sampai sini saja. Balik rumah kau,” kata Kit mendatar.</p>\n<p>Sebelum Khalid sempat mengucapkan apa-apa atau bertanya lanjut, Kit menepuk kasar poket jaket Khalid. “Ingat pesan aku.”</p>\n<p>Dalam sekelip mata, susuk Kit menghilang ke dalam kepekatan malam.</p>\n<p>Khalid melangkah longlai menolak basikalnya masuk ke pintu pagar rumah. Keletihan yang teramat sangat membuatkan dia merebahkan diri di atas katil tanpa sempat menukar pakaian, lalu tenggelam dalam lena yang berat.</p>", "wordCount": 1237}, {"num": 4, "fullTitle": "Bab 4 – Langkah di Ambang Rahsia", "title": "Langkah di Ambang Rahsia", "content": "<p>Khalid terjaga dari lena.</p>\n<p>Kepalanya berdenyut berat, dan seluruh sendi tubuhnya terasa sengal-sengal seperti dihempas batu. Dia membuka mata perlahan-lahan. Siling biliknya yang putih terpampang di depan mata.</p>\n<p class=\"dialogue\">“Semalam... bukan mimpi,” bisiknya perlahan sambil menyentuh lengan kirinya yang berbekas lebam kebiruan.</p>\n<p>Dia duduk di birai katil. Ketika tangannya menyentuh poket jaket yang masih tersarung di badannya, jari-jemarinya merasakan sesuatu yang keras dan berlipat.</p>\n<p>Khalid menarik keluar objek itu. Sekeping cebisan kertas resit yang telah dikoyak, tertera tulisan dakwat pen mata bulat yang ditulis secara tergesa-gesa.</p>\n<p>Matanya tertumpu pada tulisan tangan Kit yang condong dan tajam:</p>\n<p>‘Kau selamat kali ini, budak baru. Kalau kau nak tahu kenapa aku dibuang dari Sri Dian... jangan percaya pada budak pengawas bernama Edy.’</p>\n<p>Nafas Khalid tertahan.</p>\n<p>Edy? Budak pengawas?</p>\n<p>Nama itu begitu asing di telinganya. Namun mengapa Kit—seorang remaja jalanan yang nekad memukul orang berkedudukan tinggi—begitu bersungguh-sungguh memberi amaran tentang seorang pengawas sekolah?</p>\n<p>Khalid melipat kemas cebisan kertas itu dan menyelitkannya ke dalam celah buku catatan peribadinya. Pengalaman di sekolah lama mengajarnya satu perkara: dalam setiap kekusutan yang kelihatan rawak, sentiasa ada benang halus yang tersembunyi.</p>\n<p>Jam di meja kecil menunjukkan pukul 6.30 pagi.</p>\n<p>Dia mencapai tuala, menolak selimut ke tepi, lalu melangkah ke bilik air dengan tekad yang berbeza. Hari kedua di SMK Sri Dian bukan lagi sekadar hari menyesuaikan diri—tetapi permulaan kepada sebuah pemerhatian rahsia.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Hari kedua di sekolah baharunya berjalan lancar.</p>\n<p>Khalid duduk di tempat biasa, menumpukan pandangan ke luar tingkap. Dari situ dia dapat melihat padang bola yang luas, dihiasi deretan pokok rhu dan bunga kertas yang berayun ditiup angin. Pemandangan itu menenangkan — seolah-olah dunia di luar sana tidak punya sebarang rahsia.</p>\n<p>Di dalam kelas, suasana 5 Alfa seperti biasa, riuh dengan perdebatan. Saiful dan beberapa rakan lelaki lain bertekak tentang isu semasa negara, lengkap dengan hujah dan gaya seperti ahli politik muda. Haziq, Fahmi dan Zubir saling menentang pendapat dengan penuh semangat.</p>\n<p>Khalid hanya tersenyum nipis. Tangannya mencapai sehelai kertas kosong dan pensil, lalu mula melakar pemandangan padang yang dilihatnya.</p>\n<p>Setiap garisan dilukis tenang, penuh ketelitian.</p>\n<p class=\"dialogue\">“Eh, kau lukis apa tu?” Suara Saiful tiba-tiba muncul di sebelahnya.</p>\n<p>Khalid sedikit tersentak. Dia tidak menjawab, hanya meneruskan lukisan.</p>\n<p>Saiful yang baru selesai berhujah masih tercungap sedikit.</p>\n<p class=\"dialogue\">“Wow... cantik betul. Gambar padang sekolah ya?” kata Saiful sambil memerhati hasil lukisan yang belum siap itu.</p>\n<p>Khalid sekadar mengangguk perlahan. Dia belum begitu terbuka untuk banyak berbual.</p>\n<p>Namun, senyuman kecilnya cukup memberi isyarat — dia bukan sombong, cuma masih belajar menyesuaikan diri.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Dari jauh, Suria memerhati.</p>\n<p>Pandangan matanya tidak lepas dari wajah Khalid yang serius menunduk di meja.</p>\n<p>Wajah itu tenang, tetapi ada sesuatu padanya — misteri yang sukar dijelaskan.</p>\n<p>Dia lain daripada yang lain...</p>\n<p>Suria menghela nafas kecil. Dia pernah beberapa kali jatuh cinta, dan beberapa kali pula dikecewakan. Tapi kali ini — hatinya berkata lain.</p>\n<p>This is the last one, tekadnya dalam diam.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p class=\"dialogue\">“Cikgu datang, cikgu datang!” jerit Tinesh dari luar kelas.</p>\n<p>Kelas 5 Alfa serta-merta berubah — dari hingar-bingar kepada sunyi sepi dalam masa kurang tiga puluh saat. Suara kerusi diseret, buku dibuka, dan wajah pelajar bertukar sopan.</p>\n<p>Khalid tersenyum kecil melihat reaksi spontan itu.</p>\n<p>Hebat juga semangat bekerjasama kelas ni, bisiknya.</p>\n<p>Tak lama kemudian, Cikgu Mahani masuk dengan senyuman, memulakan sesi pengajaran. Hari itu berjalan seperti biasa — aman dan teratur.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Waktu rehat tiba.</p>\n<p>Kantin sekolah kembali riuh dengan suara pelajar. Bau nasi goreng, bihun, dan ayam goreng menyatu di udara.</p>\n<p>Khalid hanya membeli sebuku roti dan sebotol air mineral. Itu sudah cukup baginya.</p>\n<p>Dia lebih suka makan ringan supaya tidak mengantuk selepas rehat.</p>\n<p>Dia duduk di meja tepi kantin yang agak jauh dari kelompok pelajar lain. Beberapa minit kemudian, Saiful datang sambil membawa sepinggan nasi ayam dan segelas air sirap yang berwap.</p>\n<p>Makanan itu sungguh menyelerakan hingga Khalid menelan air liur tanpa sedar.</p>\n<p>Saiful perasan, lalu tersenyum. “Kau tak lapar ke?”</p>\n<p>Khalid menggeleng. “Tak... cuma tak biasa makan berat waktu rehat.”</p>\n<p class=\"dialogue\">“Dari tadi aku tengok kau termenung pandang padang. Kau ada masalah ke dekat sekolah ni? Cer citer sikit.”</p>\n<p>Khalid mengangkat kening, senyum nipis. “Tak ada apa. Cuma... tengok masa depan. Apa yang dah berlaku, dan apa yang mungkin akan berlaku.”</p>\n<p>Saiful yang sedang menyuap nasi berhenti seketika. “Maksud kau?”</p>\n<p class=\"dialogue\">“Aku cuma tak nak apa yang berlaku di sekolah lama aku berulang lagi. Aku bimbang kejadian tu akan datang balik... di sekolah ni.”</p>\n<p>Nada Khalid tenang, tapi dalam. Ada sesuatu yang disembunyikan.</p>\n<p>Saiful mengerut dahi. “Apa yang kau merepek ni, Khalid? Aku tak faham la.”</p>\n<p>Khalid hanya menggeleng. “Itu nanti kau akan tahu juga. Sekarang, biarlah rahsia dulu.”</p>\n<p>Dia bangun dari tempat duduknya, menyandang beg kecil.</p>\n<p class=\"dialogue\">“Eh, nak ke mana pula?”</p>\n<p class=\"dialogue\">“Perpustakaan.”</p>\n<p class=\"dialogue\">“Tunggu aku!” Saiful tergesa-gesa meneguk air sirapnya, meninggalkan pinggan yang masih berbaki separuh. Dia berlari mengejar Khalid yang sudah beberapa langkah ke hadapan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Perpustakaan sekolah sunyi, hanya dihuni oleh beberapa pelajar yang tekun membaca. Bau buku lama memenuhi ruang.</p>\n<p>Khalid berjalan dari rak ke rak, memerhati judul-judul yang berderet.</p>\n<p>Sebahagian besar buku di situ sudah lusuh, malah ada yang pernah dibacanya sebelum ini.</p>\n<p>Saiful pula sekadar mengikut dari belakang, pura-pura sibuk membelek buku yang tidak difahami isinya.</p>\n<p class=\"dialogue\">“Ruangan novel kat mana, Saiful?” tanya Khalid.</p>\n<p class=\"dialogue\">“Novel? Haa... dekat hujung sana. Macam-macam ada — cinta, seram, thriller pun ada.” jawab Saiful, menunjuk dengan gaya seperti pemandu pelancong.</p>\n<p>Khalid tersenyum kecil dan melangkah ke arah rak yang ditunjukkan. Deretan novel pelbagai warna menyambut matanya. Dia meneliti satu demi satu.</p>\n<p class=\"dialogue\">“Kau memang suka baca novel, ya?” Saiful menegur, masih mengekori.</p>\n<p class=\"dialogue\">“Boleh la. Aku baca bila ada masa lapang. Kadang-kadang tenangkan fikiran.”</p>\n<p>Saiful mengangguk. “Kau suka genre apa?”</p>\n<p>Khalid berhenti. Matanya terpaku pada satu judul. Tangannya mencapai buku itu perlahan. Wajahnya terus berubah — seolah-olah terjumpa sesuatu yang istimewa.</p>\n<p class=\"dialogue\">“Aku rasa... aku dah jumpa apa yang aku cari.”</p>\n<p>Saiful menjenguk tajuk buku itu.</p>\n<p class=\"dialogue\">“Ramlee Awang Murshid? Novelis Thriller Nombor Satu Negara?”</p>\n<p>Khalid mengangguk bangga. “Yup. Dia penulis kegemaran aku. Cara dia bercerita, luar biasa.”</p>\n<p>Saiful tersenyum. “Hebat juga cita rasa kau ni. Aku ingat kau jenis tak baca novel.”</p>\n<p>Khalid ketawa kecil. Dia meminjam novel itu, kemudian mengambil beberapa buku lain untuk dibaca di meja bacaan.</p>\n<p>Mereka duduk bersebelahan.</p>\n<p>Khalid tekun membaca, sementara Saiful cuba meniru sikapnya — namun baru beberapa muka surat, kepalanya mula terasa berat.</p>\n<p>Beberapa minit kemudian, Saiful tertidur di atas meja, buku masih terbuka di hadapannya.</p>\n<p>Khalid memandangnya sambil tersenyum. “Budak ni... cepat betul kalah.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Setelah waktu rehat hampir tamat, Khalid menutup bukunya dan memulangkannya ke rak asal. Dia kemudian menepuk bahu Saiful perlahan.</p>\n<p class=\"dialogue\">“Saiful... bangun. Masa rehat dah habis.”</p>\n<p>Saiful mengeluh kecil tanpa membuka mata. “Dah pukul berapa?”</p>\n<p class=\"dialogue\">“11.15.”</p>\n<p class=\"dialogue\">“Hari ni hari apa?”</p>\n<p>Khalid menahan senyum. “Selasa.”</p>\n<p class=\"dialogue\">“Oh... Selasa.” Saiful mengangguk perlahan — kemudian tersentak.</p>\n<p class=\"dialogue\">“Hah?! Selasa?! Kenapa kau tak kejut awal-awal!”</p>\n<p>Khalid terkejut melihat reaksi kawannya yang tiba-tiba panik.</p>\n<p class=\"dialogue\">“Kenapa ni?”</p>\n<p>Saiful bangun tergesa-gesa. “Cepat! Bahaya sedang menunggu kita!”</p>\n<p>Dia menarik tangan Khalid keluar dari perpustakaan tanpa menjelaskan apa-apa.</p>\n<p>Khalid terpinga-pinga, namun menurut juga.</p>\n<p>Bahaya? Bahaya apa pula kali ni...?</p>", "wordCount": 1157}, {"num": 5, "fullTitle": "Bab 5 – Teguran Pertama", "title": "Teguran Pertama", "content": "<p class=\"dialogue\">“Kenapa kau tergesa-gesa sangat ni? Waktu rehat baru je habis.”</p>\n<p>Khalid sempat bersuara sambil cuba mengejar langkah Saiful yang berlari anak di koridor.</p>\n<p class=\"dialogue\">“Kau tak kenal lagi cikgu yang bakal kau jumpa ni.” Saiful sempat menoleh ke belakang, nafasnya tercungap-cungap. “Dia bukan calang-calang orang, bro. Ini Cikgu Paling Garang dekat sekolah ni!”</p>\n<p>Khalid terdiam mendengar penjelasan itu. Saiful meneruskan dengan wajah cemas.</p>\n<p class=\"dialogue\">“Dia paling pantang pelajar masuk lambat. Lima minit pun dah cukup untuk kau dapat satu karangan motivasi dari dia — depan semua orang!”</p>\n<p>Mereka tiba di depan kelas 5 Alfa tepat ketika loceng tamat rehat berbunyi.</p>\n<p>Saiful mengusap dada, menarik nafas panjang. “Fuh... sempat juga kali ni.”</p>\n<p>Khalid yang berdiri di belakangnya tersenyum kecil, tidak sempat berkata apa-apa —</p>\n<p>PAMM!</p>\n<p>Pintu kelas tertutup rapat, hampir mengenai muka Saiful yang baru hendak masuk.</p>\n<p>Saiful terpaku. Wajahnya pucat serta-merta.</p>\n<p>Khalid yang di belakang terkejut, tidak tahu apa yang berlaku.</p>\n<p>Pintu terbuka sedikit, menampakkan wajah Cikgu Fatimah yang menyeringai di baliknya.</p>\n<p class=\"dialogue\">“Ops, ada lagi yang nak masuk rupanya. Ingatkan dah habis tadi.”</p>\n<p>Suara itu sahaja sudah cukup membuatkan seluruh kelas membisu.</p>\n<p class=\"dialogue\">“Saya paling pantang pelajar saya masuk lewat! Tak ada disiplin langsung! Dah — ambil beg kamu, belajar di luar!”</p>\n<p>Nada suaranya tegas dan menusuk.</p>\n<p>Saiful tunduk tanpa membantah. Wajahnya merah padam menahan malu.</p>\n<p>Sebagai ketua kelas, dia tidak pernah rasa seteruk ini.</p>\n<p>Khalid yang melihat kejadian itu mula terasa bersalah.</p>\n<p>Kalau aku tak lambat tadi, dia pun tak kena macam ni... fikirnya.</p>\n<p>Tidak lama kemudian muncul Haziq dan Zubir, juga berlari-lari kecil ke arah pintu kelas.</p>\n<p class=\"dialogue\">“Hah! Dua ekor lagi datang lambat! Keluar! Berdiri di luar kelas!”</p>\n<p>Suara Cikgu Fatimah bergema lagi.</p>\n<p>Saiful melangkah masuk sekejap untuk mengambil begnya.</p>\n<p>Haziq dan Zubir turut sama.</p>\n<p>Khalid pula melangkah perlahan ke dalam — namun ditahan.</p>\n<p class=\"dialogue\">“Kamu ni siapa pula? Tak pernah nampak pun sebelum ni.”</p>\n<p>Cikgu Fatimah bersilang tangan, memandangnya dari atas ke bawah.</p>\n<p>Belum sempat Khalid menjawab, suara manja kedengaran dari tempat duduk paling dekat dengan pintu.</p>\n<p class=\"dialogue\">“Dia pelajar baru, cikgu. Baru masuk pagi tadi.”</p>\n<p>Itulah Suria, yang tersenyum-senyum seperti hendak menolong.</p>\n<p class=\"dialogue\">“Saya tanya dia, bukan awak! Bisu ke apa?” perli Cikgu Fatimah tajam.</p>\n<p>Khalid segera menunduk dan menjawab sopan, “Saya Khalid, cikgu. Pelajar baru di sini. Saya minta maaf datang lambat.”</p>\n<p class=\"dialogue\">“Oh... kamu yang baru pindah tu. Cikgu Fauziah dah cerita. Kamu ni pelajar yang dibuang dari sekolah berasrama penuh tu kan?”</p>\n<p>Nada sinisnya menikam jantung Khalid.</p>\n<p class=\"dialogue\">“Hmm, patutlah...” tambahnya lagi dengan nada merendah.</p>\n<p>Kata “dibuang,” itu menampar Khalid seperti belati.</p>\n<p>Dia menelan air liur, menahan marah yang cuba naik ke dada.</p>\n<p>Namun dia hanya menunduk — tidak mahu menimbulkan sebarang masalah pada hari kedua persekolahannya.</p>\n<p>Saiful menyerahkan beg Khalid di tangan, lalu mereka berempat — Saiful, Haziq, Zubir dan Khalid — akhirnya berdiri di luar kelas dalam diam.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sesi pembelajaran bersambung semula.</p>\n<p>Cikgu Fatimah menulis di papan putih, menjelaskan tajuk dengan nada tegas.</p>\n<p>Tidak ada siapa berani bersuara, apatah lagi ketawa.</p>\n<p>Kelas 5 Alfa kini seperti makmal sunyi.</p>\n<p>Di luar, empat sahabat baru itu hanya duduk bersandar di dinding.</p>\n<p>Masing-masing diam. Hanya hembusan angin menemani.</p>\n<p class=\"dialogue\">“Saiful, aku minta maaf ya. Semua ni sebab aku.” kata Khalid perlahan.</p>\n<p>Saiful menoleh, lalu tersenyum nipis. “Tak apa la, Khalid. Bukan salah kau pun. Aku dah biasa kena macam ni.”</p>\n<p>Kata-kata itu membuat Khalid sedikit lega.</p>\n<p class=\"dialogue\">“Ha’ah, betul tu,” sampuk Haziq dari sisi. “Kita ni memang geng setia luar kelas. Chill je.”</p>\n<p>Mereka ketawa kecil, cuba mencairkan suasana.</p>\n<p>Bagi Khalid, inilah pengalaman pertamanya di sekolah ini — dan mungkin bukan yang terakhir.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Apabila loceng tamat waktu berbunyi, Cikgu Fatimah menutup bukunya dan keluar dari kelas tanpa banyak bicara.</p>\n<p>Empat pelajar malang itu dibenarkan masuk semula.</p>\n<p>Rasa malu jelas di wajah Khalid, namun dia cuba menenangkan diri.</p>\n<p class=\"dialogue\">“Kau okay, Khalid? Kesian aku tengok kau tadi. Aku lupa nak bagitahu peraturan Cikgu Fatimah. Dia ni lain sikit,” kata Fahmi, ketua pengawas sekolah yang duduk berhampiran.</p>\n<p class=\"dialogue\">“Tak apa. Aku okay je,” jawab Khalid dengan senyuman tipis.</p>\n<p>Belum sempat suasana kembali normal, muncul seorang pelajar lelaki yang baru tiba, berbeg galas dan wajah selamba.</p>\n<p class=\"dialogue\">“Weh, kenapa ramai-ramai dekat meja aku ni?” katanya.</p>\n<p class=\"dialogue\">“Ni ha, budak baru. Khalid. Hari ni baru masuk, terus kena dengan Cikgu Fatimah.” terang Zubir.</p>\n<p>Lelaki itu tersenyum sinis. “Oh, kesian betul. Nama aku Munir — kaki ponteng rasmi kelas ni.”</p>\n<p>Khalid ketawa kecil dan menyambut huluran tangan Munir.</p>\n<p class=\"dialogue\">“Aku Khalid. Budak baru. Nice to meet you.”</p>\n<p>Munir duduk sambil menyandarkan badan di kerusi.</p>\n<p>Saiful ketawa kecil sambil menambah, “Kalau kau nak tahu, Munir ni otai kelas ni. Semua hal dalam sekolah dia tahu.”</p>\n<p>Haziq menyampuk, “Sebenarnya banyak benda dah jadi antara kami dengan Cikgu Fatimah ni. Kami dah kenal dia dari Tingkatan 4 lagi. Tapi ada satu kisah... satu peristiwa yang sampai sekarang kami tak lupa. Sebab tu la Munir tak pernah masuk kelas dia lagi.”</p>\n<p>Safwan mencelah perlahan, “Eh, kau nak cerita benda tu dekat Khalid ke?”</p>\n<p>Munir tersenyum malas. “Ceritakan sahaja. Aku tak kisah.”</p>\n<p>Haziq menarik nafas panjang. “Okay... cerita dia bermula begini—”</p>\n<p class=\"dialogue\">“Assalamualaikum semua! Amboi, meriah sungguh dekat belakang tu.”</p>\n<p>Suara garau bergema dari muka pintu.</p>\n<p>Mereka semua menoleh — Cikgu Bakri sudah masuk dengan senyuman lebar.</p>\n<p>Beberapa pelajar perempuan sudah siap dengan buku di tangan. Yang lelaki pula masih terpinga, kecewa kerana kisah Munir belum sempat disampaikan.</p>\n<p class=\"dialogue\">“Aduh... baru nak dengar cerita menarik.” rungut salah seorang pelajar lelaki.</p>\n<p>Munir menepuk bahu Khalid. “Takpe, nanti aku sambung. Sekarang masa belajar.”</p>\n<p>Cikgu Bakri menepuk tangan dua kali. “Okay semua, sihat ke hari ni?”</p>\n<p>Pelajar perempuan menyahut ceria. Yang lelaki pula masih bermalas-malasan.</p>\n<p class=\"dialogue\">“Oh, cikgu terlupa. Sebelum ni kelas Kimia kan? Maaflah geng, silap timing!” katanya berseloroh, membuat kelas tergelak kecil.</p>\n<p class=\"dialogue\">“Jadi... siapa yang kena tadi?” tanyanya, pura-pura serius.</p>\n<p>Suria segera menjawab dengan senyum manja, “Saiful, Haziq, Zubir... dan...”</p>\n<p>Dia berhenti seketika, tersengih ke arah belakang kelas.</p>\n<p class=\"dialogue\">“Dan Khalid, cikgu,” sampuk Yana, menyambung dengan penuh semangat.</p>\n<p class=\"dialogue\">“Khalid?” Cikgu Bakri mengangkat kening. “Pelajar baru tu?”</p>\n<p>Yana mengangguk.</p>\n<p>Cikgu Bakri menoleh, mencari wajah yang belum dikenalinya.</p>\n<p>Matanya tertumpu pada Khalid di tepi tingkap.</p>\n<p class=\"dialogue\">“Kamu Khalid, ya?”</p>\n<p>Khalid mengangguk perlahan.</p>\n<p>Cikgu Bakri tersenyum. “Mungkin kamu istimewa. Baru dua hari sekolah, dah sempat merasa pengalaman Cikgu Fatimah.”</p>\n<p>Seluruh kelas ketawa kecil.</p>\n<p>Khalid turut tersenyum — tapi jauh di sudut hati, dia tahu... hari-harinya di sekolah ini baru sahaja bermula.</p>", "wordCount": 1040}, {"num": 6, "fullTitle": "Bab 6 – Antara Gelak dan Teka-Teki", "title": "Antara Gelak dan Teka-Teki", "content": "<p class=\"dialogue\">“Okay guys, let’s play some games!”</p>\n<p>Seruan itu disambut sorakan gemuruh pelajar Kelas 5 Alfa. Suasana kembali riuh dan ceria. Selepas diserang badai garang Cikgu Fatimah sebentar tadi, kini mereka seolah-olah mendapat nafas baru.</p>\n<p class=\"dialogue\">“Game apa, cikgu?” tanya Saiful riang, sambil menepuk meja di hadapannya.</p>\n<p class=\"dialogue\">“Hari ni kita main tiga jenis permainan – kuiz pengetahuan am, teka-teki, dan satu soalan matematik.” Cikgu Bakri menulis di papan putih. “Tapi ingat, semua soalan ni ada kaitan antara satu sama lain. Saya nak kamu bahagi tiga kumpulan – satu kumpulan lelaki, dua kumpulan perempuan ikut kedudukan meja masing-masing.”</p>\n<p class=\"dialogue\">“Bereh, boh!” jerit Haziq, disambut gelak ketawa rakan-rakannya.</p>\n<p>Khalid hanya tersenyum kecil melihat telatah mereka. Inilah pertama kali dia benar-benar rasa diterima dalam kelas itu.</p>\n<p class=\"dialogue\">“Okay semua dah sedia?”</p>\n<p>Pelajar-pelajar mengangguk semangat. Cikgu Bakri melukis tiga kotak di papan putih mewakili tiga kumpulan — kumpulan lelaki di bahagian kiri (berhampiran tingkap), dan dua kumpulan perempuan di tengah serta kanan kelas.</p>\n<p class=\"dialogue\">“Soalan pertama – pengetahuan am. Apakah kawasan terluas di dunia?”</p>\n<p>Seluruh kelas senyap seketika. Masing-masing termenung, cuba mengingat.</p>\n<p>Tiba-tiba, Zubir bangun sambil mengangkat tangan tinggi.</p>\n<p class=\"dialogue\">“Russia, cikgu! Negara terbesar di dunia!” katanya yakin.</p>\n<p class=\"dialogue\">“Salah.” jawab Cikgu Bakri tenang.</p>\n<p class=\"dialogue\">“Aduh, apalah Zubir ni. Kalau tak tahu, diam-diam sudah!” herdik Haziq separuh berbisik.</p>\n<p>Zubir bercekak pinggang. “At least aku cuba, okay!”</p>\n<p>Suasana kembali riuh. Tiba-tiba Yana bangun sambil tersengih.</p>\n<p class=\"dialogue\">“Antartika, cikgu! Kawasan paling luas di dunia!”</p>\n<p class=\"dialogue\">“Yes, that’s right! Kawasan paling luas, bukan bermaksud negara paling besar,” balas Cikgu Bakri sambil menanda satu mata pada kumpulan Yana.</p>\n<p class=\"dialogue\">“Seterusnya, soalan dua. Berapakah anggaran keluasan benua Antartika?”</p>\n<p>Pelajar-pelajar mula menggaru kepala masing-masing.</p>\n<p class=\"dialogue\">“Mana nak ingat, cikgu. Tak hafal la pula!” keluh Saiful.</p>\n<p>Fahmi tiba-tiba mengangkat tangan. “Saya rasa saya tahu, cikgu.”</p>\n<p class=\"dialogue\">“Silakan.”</p>\n<p class=\"dialogue\">“Melebihi satu kilometer persegi.” jawab Fahmi sambil tersengih.</p>\n<p>Satu kelas tergamam. Ada yang menepuk dahi.</p>\n<p>Namun Cikgu Bakri tersenyum. “Betul!” katanya.</p>\n<p class=\"dialogue\">“Saya tanya anggaran keluasan, bukan angka sebenar. Logik pun dah cukup.”</p>\n<p>Seluruh kelas ketawa besar. Fahmi bangga tak terkata, manakala kumpulan lelaki bersorak.</p>\n<p class=\"dialogue\">“Yeah! Mata pertama kita!” Haziq meniru gaya Pak Belalang, disambut tepukan kuat oleh rakan-rakannya.</p>\n<p>Khalid tersenyum, menikmati suasana itu.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p class=\"dialogue\">“Baiklah. Soalan seterusnya – Matematik.”</p>\n<p>Cikgu Bakri memegang pen penanda.</p>\n<p class=\"dialogue\">“Zack ada 5 biji guli. Hamdan ada separuh daripada guli Zack. Tinesh pula dua kali ganda guli Hamdan. Fahmi pula ada 3 biji lebih daripada Tinesh. Mereka bercadang nak campurkan semua guli tu untuk bermain. Tapi sebelum sempat bermain, ibu Zack panggil dia balik. Fahmi dapat guli paling banyak, Hamdan paling sedikit. Jadi, berapa guli milik Tinesh sekarang?”</p>\n<p>Suasana kembali senyap. Semua mula mencongak, menulis, mengira.</p>\n<p>Beberapa minit berlalu, tiba-tiba Munir mengangkat tangan tinggi.</p>\n<p class=\"dialogue\">“Cikgu, saya tahu trick dia. Tinesh ada lima biji guli!”</p>\n<p class=\"dialogue\">“Kenapa?” tanya Cikgu Bakri, sengaja menguji.</p>\n<p class=\"dialogue\">“Sebab mereka tak sempat pun campurkan guli tu, cikgu. Ibu Zack dah panggil balik. Jadi jumlah asal tak berubah!”</p>\n<p>Cikgu Bakri tersenyum puas. “That’s right! Bagus, Munir. Kamu memang bijak.”</p>\n<p>Munir menegakkan dada, hidungnya sedikit kembang.</p>\n<p class=\"dialogue\">“Yesss! Mata kedua!” jerit Haziq lagi. Kelas kembali riuh rendah dengan sorakan kumpulan lelaki.</p>\n<p>Pelajar perempuan hanya mampu mendengus kecil.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p class=\"dialogue\">“Okay, soalan terakhir. Siapa yang dapat jawab, saya bagi RM50 tunai.”</p>\n<p>Suasana kembali tegang. Semua memberi tumpuan.</p>\n<p class=\"dialogue\">“Soalan berbunyi begini. Terdapat dua persamaan: 15x + 10y + 5z dan 10x + 8y + 4z. Sila cari nilai X.”</p>\n<p>Seluruh kelas membisu. Ada yang menulis pantas, ada yang mengeluh.</p>\n<p>Tiba-tiba —</p>\n<p>Kring! Kring!</p>\n<p>Loceng akhir hari dibunyikan.</p>\n<p class=\"dialogue\">“Aduh! Baru nak kira!” keluh Fahmi.</p>\n<p>Cikgu Bakri ketawa kecil. “Takpe, sambung next class. Sekarang kita tangguh dengan Tasbih Kafarah dan Surah Al-Asr.”</p>\n<p>Suara pelajar bersatu mengalunkan bacaan pendek itu. Suasana kelas terasa damai.</p>\n<p>Ketika mereka mengemaskan buku, Suria tiba-tiba bertanya,</p>\n<p class=\"dialogue\">“Cikgu, apa jawapan sebenarnya?”</p>\n<p>Cikgu Bakri tersenyum sambil mengangkat beg komputer ribanya.</p>\n<p class=\"dialogue\">“Kamu cari sendiri. Esok kita tengok siapa paling cepat jumpa jawapan.”</p>\n<p>Kelas bergema dengan rengekan kecil dan tawa sebelum beliau melangkah keluar.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Malam Itu</p>\n<p>Khalid duduk bersandar di sofa ruang tamu, menonton televisyen sambil mengunyah biskut dan meneguk air teh panas. Rumah itu sunyi — hanya bunyi kipas siling dan siaran drama Melayu di TV.</p>\n<p>Dia menukar siaran beberapa kali, tapi semuanya hampir sama: kisah cinta yang berakhir dengan air mata. Khalid tersenyum nipis.</p>\n<p>Yang baik pasti menang, yang jahat akhirnya kalah. Begitulah dunia.</p>\n<p>Dia sudah bosan dengan drama cinta yang penuh tangisan dan janji palsu.</p>\n<p>Tiba-tiba pintu utama dibuka.</p>\n<p>Profesor Tarmizi masuk dengan wajah letih, membawa briefcase hitam di tangan. Jam menunjukkan hampir pukul 10 malam.</p>\n<p class=\"dialogue\">“Assalamualaikum.” suaranya perlahan.</p>\n<p>Khalid berpaling seketika. “Waalaikumussalam, ayah.”</p>\n<p>Tarmizi berjalan ke arah anaknya dan cuba mempamerkan senyuman — tapi senyumannya hambar, menampakkan kerisauan yang sukar disembunyikan.</p>\n<p class=\"dialogue\">“Bagaimana sekolah baru kamu? Seronok?” tanya Tarmizi perlahan.</p>\n<p>Itu soalan pertama yang keluar dari mulutnya sejak Khalid berpindah sekolah.</p>\n<p>Khalid hanya tersenyum nipis. “Boleh tahan. Tak banyak beza dengan sekolah lama.”</p>\n<p>Tarmizi mengangguk, tapi wajahnya kekal serius. “Baguslah kalau begitu. Ayah cuma harap kamu...”</p>\n<p>Dia terhenti. Bibirnya seakan berat untuk menyambung.</p>\n<p>Khalid memandangnya, menunggu. “Tak akan apa, ayah?”</p>\n<p>Tarmizi menarik nafas panjang. “Ayah cuma harap kamu tak ulang kesilapan lama. Ayah dah tak sanggup nak hadapi semua tu lagi.”</p>\n<p>Suasana senyap. Hanya bunyi televisyen menemani.</p>\n<p>Khalid memandang wajah ayahnya lama. Kenangan lama datang menghantui.</p>\n<p>Dia masih ingat hari terakhirnya di sekolah lama — darah, jeritan, dan keputusan yang memusnahkan segalanya.</p>\n<p>Namun dia segera tersenyum, menutup luka itu dengan tenang.</p>\n<p class=\"dialogue\">“Jangan risau, ayah. Khalid bukan budak dulu lagi. Khalid dah berubah. Tak panas baran macam dulu.”</p>\n<p>Dia menatap wajah Tarmizi dalam-dalam.</p>\n<p class=\"dialogue\">“Khalid tahu jaga diri. Inikan anak ayah.”</p>\n<p>Tarmizi hanya tersenyum nipis, namun dalam hatinya masih tersisa resah.</p>\n<p>Dia tahu, perubahan bukan datang semudah kata-kata.</p>\n<p>Dan Khalid pula tahu —</p>\n<p>masa silamnya belum benar-benar selesai memburunya.</p>", "wordCount": 939}, {"num": 7, "fullTitle": "Bab 7 – Bentesan Pertama", "title": "Bentesan Pertama", "content": "<p>Pagi itu, Khalid hadir ke sekolah dengan berpakaian sukan. Mengikut jadual, kelas pertamanya ialah Pendidikan Jasmani — salah satu subjek kegemarannya. Sudah agak lama dia tidak bersukan dan mengeluarkan peluh.</p>\n<p>Semua pelajar Kelas 5 Alfa dikumpulkan di padang sekolah. Mereka dibahagikan kepada dua kumpulan — pelajar lelaki diajar oleh Cikgu Zul, manakala pelajar perempuan bersama Cikgu Salamiah. Cikgu Zul juga telah menggabungkan Kelas 5 Alfa dengan Kelas 5 Beta, menjadikannya dua kelas besar yang dikendalikan serentak pagi itu.</p>\n<p>Barisan pelajar disusun rapi di hadapan Cikgu Zul. Dari jauh, guru itu memerhatikan sesuatu yang ganjil.</p>\n<p class=\"dialogue\">“Saiful, ke mari sekejap,” arah Cikgu Zul dengan nada tegas. Mukanya serius, jarang sekali menampakkan senyum.</p>\n<p>Saiful, yang hanya mengenakan pakaian seragam sekolah, melangkah perlahan ke hadapan. Wajahnya jelas cemas.</p>\n<p class=\"dialogue\">“Kenapa kamu tak pakai baju sukan?” soal Cikgu Zul.</p>\n<p class=\"dialogue\">“Saya terlupa bawa, cikgu. Saya minta maaf.”</p>\n<p class=\"dialogue\">“Minta maaf saja tak cukup. Lari tiga pusingan padang — pakai baju sekolah kamu ni. Jangan balik ke kelas sebelum cukup pusingan.”</p>\n<p>Mendengar hukuman itu, suasana jadi senyap. Wajah Saiful merah menahan malu. Dengan tubuhnya yang agak gempal, larian tiga pusingan bukan perkara mudah.</p>\n<p class=\"dialogue\">“Haha, makin kuruslah kau lepas ni!” jerit seorang pelajar Kelas 5 Beta. Gelak tawa mereka pecah memecah pagi yang nyaman itu.</p>\n<p>Khalid yang berdiri di barisan hadapan menggenggam penumbuk. Hatinya panas. Mujur Fahmi sempat menepuk bahunya.</p>\n<p class=\"dialogue\">“Sabar, Khalid. Budak 5 Beta memang macam tu.”</p>\n<p>Saiful akhirnya memulakan larian. Wajahnya menunduk, langkahnya perlahan, tapi dia tetap cuba menghabiskan pusingan yang diberi.</p>\n<p>Sementara itu, Cikgu Zul menyerahkan sebiji bola kepada pelajar lelaki.</p>\n<p class=\"dialogue\">“Okey, 5 Alfa lawan 5 Beta. Main dengan semangat kesukanan. Jangan gaduh.”</p>\n<p>Perlawanan dimulakan. 5 Beta yang memiliki lebih ramai pemain mendominasi padang, namun semangat 5 Alfa tidak kalah. Khalid yang bermain di posisi tengah berjaya membawa bola ke kawasan lawan. Dua pemain cuba menghalang, namun dia cekap menggelecek dan melepasi mereka.</p>\n<p>Namun ketika berdepan pemain ketiga, kakinya tiba-tiba dibentes kuat dari sisi. Khalid jatuh berguling di atas rumput.</p>\n<p class=\"dialogue\">“Arghh!” jeritnya menahan sakit, tangannya memegang betis kanan yang berdenyut.</p>\n<p class=\"dialogue\">“Ala, manja betul budak ni!” sindir pemain 5 Beta yang membentesnya.</p>\n<p>Kemarahan mula membuak. Munir dan beberapa pelajar 5 Alfa meluru ke arah pemain itu. Hanya Fahmi yang cepat menenangkan mereka.</p>\n<p class=\"dialogue\">“Hei, sabar! Benda boleh selesai elok-elok.”</p>\n<p>Khalid dipapah keluar padang oleh Zubir dan Safwan. Perlawanan diteruskan dengan seorang pemain 5 Beta dikeluarkan untuk mengimbangi jumlah pasukan. Hasil sepakan percuma yang diberikan, Fahmi berjaya menjaringkan gol untuk 5 Alfa.</p>\n<p class=\"dialogue\">“Goal!” jerit Haziq sambil melompat kegirangan. Khalid yang duduk di tepi padang turut tersenyum puas melihat rakan-rakannya meraikan gol pertama mereka.</p>\n<p>Beberapa minit kemudian, Saiful muncul semula di tepi padang. Bajunya lencun, mukanya merah padam, dan nafasnya tercungap-cungap.</p>\n<p class=\"dialogue\">“Eh, cepatnya habis tiga pusingan,” usik Khalid dengan senyuman nakal.</p>\n<p>Saiful hanya sempat menjeling sebelum rebah duduk di sebelahnya, keletihan.</p>\n<p class=\"dialogue\">“Jangan baring! Bahaya. Sejukkan badan dulu.” nasihat Khalid.</p>\n<p>Saiful akur dan mula menarik nafas dalam-dalam.</p>\n<p class=\"dialogue\">“Kau ni pandai main bola rupanya,” puji Saiful setelah tenang sedikit.</p>\n<p class=\"dialogue\">“Boleh la sikit-sikit,” jawab Khalid merendah diri.</p>\n<p class=\"dialogue\">“Sikit-sikit apa? Aku tengok gaya kau macam Di Maria dah,” balas Saiful sambil ketawa.</p>\n<p class=\"dialogue\">“Ah, kau ni lebih-lebih. Dah jom tukar baju. Bau peluh kau dah boleh pengsan aku,” usik Khalid pula.</p>\n<p class=\"dialogue\">“Haha! Nak bau tak? Percuma ni!” balas Saiful sambil mengangkat ketiaknya ke arah Khalid.</p>\n<p class=\"dialogue\">“Weh sudah la!” Khalid menepis sambil ketawa dan terus bangun. Mereka berdua beriringan menuju ke bilik persalinan.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sementara itu, Fahmi dan rakan-rakannya berehat di pondok berhampiran padang selepas perlawanan tamat. Turut berada di situ ialah Khalid dan Saiful yang sudah siap menukar pakaian.</p>\n<p class=\"dialogue\">“Eh, berapa skor akhir tadi?” tanya Saiful.</p>\n<p class=\"dialogue\">“Kalah 3–1 bro. Diorang main tipu,” rungut Haziq sambil meneguk air.</p>\n<p class=\"dialogue\">“Tak apa la, yang penting kita main bersih,” sahut Fahmi tenang.</p>\n<p>Dia kemudian menoleh kepada Khalid.</p>\n<p class=\"dialogue\">“Kaki kau okay tak? Serius ke cedera tu?”</p>\n<p>Khalid menggeleng kecil. “Entah la. Baru nak lepas gian main bola, dah kena terjah,” katanya bersahaja.</p>\n<p class=\"dialogue\">“Meh aku tengok,” kata Fahmi, duduk mencangkung di hadapan Khalid. Setelah memeriksa seketika, dia menghela nafas.</p>\n<p class=\"dialogue\">“Mungkin luka lama. Tak serius, tapi kau kena rehat.”</p>\n<p>Khalid mengangguk. Dia masih teringat zaman lamanya sebagai pemain sekolah sebelum kecederaan itu menghancurkan impiannya.</p>\n<p class=\"dialogue\">“Okey geng, jom masuk kelas. Dah lewat ni,” arah Saiful sambil menepuk tangan.</p>\n<p class=\"dialogue\">“Baik, bos!” serentak mereka menjawab sambil ketawa.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Pelajar lelaki memasuki kelas dengan wajah puas. Namun pelajar perempuan menjerit kecil sambil menutup hidung.</p>\n<p class=\"dialogue\">“Eiii busuknya! Macam kambing!” jerit Yana. Suasana kelas jadi riuh rendah dengan rungutan mereka.</p>\n<p>Khalid dan Saiful yang masuk terakhir hanya mampu tersenyum. Berbeza dengan rakan-rakan lain, mereka berdua sudah menukar pakaian dan nampak kemas.</p>\n<p class=\"dialogue\">“Kau tengok Suria, segak betul dia. Tak macam yang lain,” kata Yana sambil tersenyum ke arah Khalid.</p>\n<p>Namun Suria tidak membalas. Wajahnya tersembunyi di meja, lena dibuai mimpi.</p>\n<p class=\"dialogue\">“Woi! Orang lain bising, kau boleh tidur?” jerit Yana sambil menepuk bahu Suria. Kelas kembali gamat dengan tawa kecil para pelajar.</p>\n<p>Dan di tengah-tengah hiruk pikuk itu, Khalid hanya tersenyum — satu hari lagi berlalu, dan dia tahu, sedikit demi sedikit, dia mula menyesuaikan diri dengan dunia barunya.</p>", "wordCount": 833}, {"num": 8, "fullTitle": "Bab 8 – Saksi Tanpa Sengaja", "title": "Saksi Tanpa Sengaja", "content": "<p>Seperti hari-hari sebelumnya, Khalid kembali ke perpustakaan pada waktu rehat. Tempat itu kini menjadi zon tenangnya — jauh daripada riuh rendah kantin dan hiruk-pikuk pelajar lelaki yang gemar bergurau kasar.</p>\n<p>Dia memang begitu. Sejak di sekolah lama, dunia buku adalah tempat dia menyorok daripada bising dunia luar.</p>\n<p>Khalid menyukai novel, tetapi minatnya terhadap buku-buku ilmiah lebih mendalam. Buku sejarah, sains, dan inovasi — semuanya menjadi hidangan minda yang tidak pernah menjemukannya. Banyak ilmu yang terkandung di luar silibus, dan bagi Khalid, di situlah letaknya pengetahuan sebenar.</p>\n<p>Saiful pula tidak kelihatan hari ini. Sejak pagi dia masih kepenatan akibat denda berlari tiga pusingan padang yang dikenakan oleh Cikgu Zul. Tambahan pula, Saiful memang tidak gemar membaca. Katanya, “bau buku boleh buat aku mengantuk.” Maka, kantinlah syurga rehatnya.</p>\n<p>Ketika Khalid melangkah masuk ke perpustakaan, matanya menangkap sosok seorang pelajar perempuan yang sedang khusyuk membaca di sudut paling hujung. Seketika kemudian, dia mengenali wajah itu.</p>\n<p>Mariam…</p>\n<p>Gadis pendiam dari kelasnya. Tidak banyak bercakap, tidak banyak bergerak. Tetapi ada sesuatu pada kehadirannya — tenang, misterius, dan sukar ditafsir. Selalu duduk sendirian, seolah-olah dunia luar tidak penting baginya. Khalid pernah mendengar guru-guru memuji tugasan Mariam yang kemas dan sempurna. Itu sahaja yang membuatkan dia dikenali.</p>\n<p class=\"dialogue\">“Dia mungkin seorang yang istimewa,” bisik Khalid kepada dirinya sendiri.</p>\n<p>Namun sebaik Mariam mengangkat kepala dan memandang ke arahnya, Khalid segera menunduk. Wajahnya terasa panas, seperti tertangkap melakukan sesuatu yang salah. Cepat-cepat dia berpura-pura meneliti buku di rak berhampiran.</p>\n<p>Beberapa minit kemudian, dia menemui sebuah buku sains penerokaan — tajuknya berkaitan tenaga suria dan inovasi masa hadapan. Dia duduk di kerusi tepi tingkap dan mula membaca penuh minat.</p>\n<p>Suasana perpustakaan sunyi. Cuma bunyi kipas siling dan sesekali helaian kertas dibalik.</p>\n<p>Tiba-tiba seekor lalat hinggap di kepalanya. Khalid menepis perlahan. Tidak lama kemudian, lalat itu datang semula.</p>\n<p>Sekali, dua kali, tiga kali.</p>\n<p class=\"dialogue\">“Eh, degil betul kau ni…,” rungut Khalid sambil mengibas tangannya.</p>\n<p>Namun saat dia menghalaunya lagi, matanya tertumpu kepada sesuatu di luar tingkap. Melalui celahan cermin yang sedikit terbuka, Khalid nampak sesuatu yang tidak sepatutnya berlaku.</p>\n<p>Di blok seberang — blok pelajar Tingkatan Tiga, seorang pelajar lelaki dilihat menyelinap masuk ke sebuah kelas yang kosong. Lelaki itu melangkah berhati-hati, kemudian menghampiri satu barisan meja. Tindak-tanduknya mencurigakan.</p>\n<p>Khalid menajamkan pandangan. Dari posisinya, dia tidak dapat melihat wajah pelajar itu dengan jelas, hanya bentuk tubuhnya dan cara dia memeriksa setiap beg di atas meja.</p>\n<p>Jantung Khalid berdegup pantas.</p>\n<p class=\"dialogue\">“Masya-Allah…,” bisiknya perlahan. “Apakah sebab Allah tunjukkan semua ini… dengan seekor lalat?”</p>\n<p>Dia segera mengeluarkan telefon bimbit dari poket. Dengan hati-hati, Khalid merakamkan kejadian itu melalui celahan tingkap. Degupan jantungnya semakin kuat, tetapi tangannya kekal stabil. Dia tidak mahu kehilangan bukti terhadap sesuatu yang pelik sedang berlaku di hadapannya.</p>\n<p class=\"dialogue\">“Ehem… ehem…”</p>\n<p>Suara lembut tetapi tegas itu membuat Khalid tersentak. Hampir-hampir sahaja telefon di tangannya terjatuh. Dia segera menghentikan rakaman.</p>\n<p>Apabila menoleh, wajah yang dilihatnya membuat jantungnya berdegup lebih kencang.</p>\n<p class=\"dialogue\">“Mariam…”</p>\n<p>Gadis itu berdiri di belakangnya, memeluk beberapa buah buku. Pandangannya lurus, tenang — tetapi penuh tanda tanya. Khalid serba salah.</p>\n<p class=\"dialogue\">“Kau… buat apa sorang-sorang?” tanya Mariam tanpa ekspresi jelas di wajahnya.</p>\n<p class=\"dialogue\">“Oh, aku… err…” Khalid gagap. Tidak tahu sama ada mahu berbohong atau berterus terang. Dia sempat menyembunyikan telefon bimbitnya di bawah meja dan berpura-pura membaca buku semula.</p>\n<p>Mariam tidak menunggu jawapan. Tangannya sibuk membelek buku-buku di rak berhampiran. Namun sebelum berlalu, dia berhenti seketika.</p>\n<p class=\"dialogue\">“Kau dah nampak apa yang berlaku, kan?” katanya perlahan, tetapi cukup untuk membuat darah Khalid terasa beku.</p>\n<p>Khalid menoleh, terkejut.</p>\n<p class=\"dialogue\">“Apa maksud kau?”</p>\n<p class=\"dialogue\">“Aku lihat apa yang kau lihat,” jawab Mariam, masih dengan nada tenang, sebelum melangkah pergi dengan sebuah buku di tangan.</p>\n<p>Khalid terpaku di tempat duduknya. Suara kipas siling kembali kedengaran — lembut tetapi menekan. Kata-kata Mariam berulang dalam fikirannya.</p>\n<p class=\"dialogue\">“Aku lihat apa yang kau lihat.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas tamat waktu rehat, Khalid kembali ke kelas. Fikirannya tidak tenang. Sejak pertemuan singkat dengan Mariam tadi, dia dihantui persoalan. Apa sebenarnya yang dimaksudkan oleh gadis itu?</p>\n<p>Adakah dia juga melihat kejadian kecurian itu? Atau adakah sesuatu yang lebih besar sedang berlaku?</p>\n<p>Khalid menarik kerusi dan duduk di tempatnya. Kelas sunyi. Kebanyakan pelajar lelaki belum kembali, manakala pelajar perempuan sibuk membaca atau berbual perlahan. Angin dari tingkap berhembus lembut, membawa aroma hujan yang mula turun renyai-renyai di luar.</p>\n<p>Untuk menenangkan diri, Khalid mencapai buku catatannya dan mula melakar.</p>\n<p>Garisan demi garisan membentuk panorama padang sekolah — rumput hijau, langit mendung, dan bendera sekolah yang separuh berkibar.</p>\n<p>Melukis membuatkannya tenang.</p>\n<p class=\"dialogue\">“Cantiknya…”</p>\n<p>Suara lembut itu datang dari belakangnya. Khalid menoleh. Yana sedang memerhati lukisannya dengan senyum kecil.</p>\n<p class=\"dialogue\">“Hehe, lawa kau lukis. Padang sekolah kan?” puji Yana.</p>\n<p class=\"dialogue\">“Alhamdulillah. Terima kasih,” jawab Khalid ringkas.</p>\n<p>Tidak lama selepas itu, Suria pula menghampiri. Dua-duanya berdiri di sisi meja Khalid, berbisik sesama sendiri sambil sesekali tersenyum kecil. Khalid pura-pura tidak perasan, meneruskan lakarannya.</p>\n<p>Namun sebelum Suria sempat membuka mulut, Khalid mendahului dengan pertanyaan, “Yana, kelas ni kenapa sunyi sangat? Budak-budak lelaki mana semua?”</p>\n<p class=\"dialogue\">“Eh, lupa nak bagitahu kau,” jawab Yana cepat. “Kelas Biologi dan Bahasa Inggeris batal hari ni. Jadi kira-kira sampai waktu balik ni, tak ada kelas dah. Mereka semua lepak di kantin.”</p>\n<p class=\"dialogue\">“Oh, macam tu…” Khalid mengangguk. Dia menutup buku catatannya dan mula mengemaskan meja.</p>\n<p class=\"dialogue\">“Eh, kau nak ke mana?” tanya Yana lagi.</p>\n<p class=\"dialogue\">“Nak ke kantin, jumpa mereka sekejap.” Khalid tersenyum sopan sebelum melangkah keluar.</p>\n<p>Suria sempat menjeling ke arah Yana dengan wajah tidak puas hati.</p>\n<p class=\"dialogue\">“Kenapa kau biarkan dia pergi? Aku belum sempat nak berbual pun!” katanya dengan nada separuh marah.</p>\n<p>Yana hanya menjawab selamba, “Biarkan saja. Kalau betul jodoh, jumpa juga nanti.”</p>\n<p>Suria menjulingkan mata, lalu menghempaskan punggung ke kerusi.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khalid melangkah di koridor yang sunyi. Setiap kelas yang dilalui tenang, hanya suara guru yang kedengaran sayup-sayup dari dalam.</p>\n<p>Namun ketika melalui satu kelas di hujung blok, langkahnya terhenti.</p>\n<p>Kelas itu riuh. Tiada guru di dalam, dan pelajar-pelajarnya kelihatan berkumpul di satu sudut, heboh memperkatakan sesuatu. Dari luar, Khalid dapat mendengar dengan jelas — perbualan tentang kes kecurian yang baru sahaja berlaku.</p>\n<p class=\"dialogue\">“Kelas ni…,” bisik Khalid. “Bukankah ini kelas yang aku nampak tadi dari tingkap perpustakaan?”</p>\n<p>Jantungnya kembali berdegup kencang. Dia berdiri senyap di balik dinding, memasang telinga. Potongan kata yang didengarnya seakan mengesahkan apa yang dilihatnya tadi.</p>\n<p>Namun sebelum sempat dia mendengar lebih lanjut, bahunya tiba-tiba ditepuk dari belakang.</p>\n<p class=\"dialogue\">“Hai, Khalid! Apa buat kat sini?”</p>\n<p>Saiful muncul bersama beberapa pelajar lelaki lain — Munir, Haziq, Fahmi dan Safwan. Senyuman mereka lebar, namun langkah mereka mengejutkan Khalid yang masih dalam keadaan resah.</p>\n<p class=\"dialogue\">“Aku…” Khalid tersenyum hambar. “Tak ada apa-apa. Tengah jalan-jalan je.”</p>\n<p class=\"dialogue\">“Sampai hati kau tinggal aku sorang kat kelas,” seloroh Saiful sambil menepuk bahunya.</p>\n<p class=\"dialogue\">“Eh, bukan kawan Saiful je. Kawan kami juga,” sampuk Fahmi dengan ketawa kecil.</p>\n<p>Khalid hanya mampu tersenyum. Dalam hatinya, rasa bersalah menebal — kerana masih belum benar-benar membuka diri kepada mereka. Dia sedar, sikapnya yang terlalu suka menyendiri membuatkan dia mudah terasing.</p>\n<p class=\"dialogue\">“Jomlah balik kelas. Ada ‘projek’ nak buat,” kata Saiful sambil menjeling nakal kepada rakan-rakannya.</p>\n<p class=\"dialogue\">“Projek?” Khalid berkerut.</p>\n<p class=\"dialogue\">“Ha, ikut je la. Baru kau tahu.” tambah Haziq pula sambil tertawa kecil.</p>\n<p>Mereka berjalan seiringan menyusuri koridor. Gurau-senda mula kedengaran, memecah kesunyian. Untuk pertama kali sejak berpindah, Khalid terasa dirinya benar-benar diterima.</p>\n<p>Namun kegembiraan itu tidak lama.</p>\n<p>Di hadapan sekali, langkah Saiful tiba-tiba terhenti.</p>\n<p class=\"dialogue\">“Eh, kenapa berhenti?” tanya Munir dari belakang.</p>\n<p>Saiful berpaling, wajahnya serius. “Kita dalam bahaya.”</p>\n<p class=\"dialogue\">“Ha? Kenapa pula?” Khalid terpinga.</p>\n<p>Saiful menelan liur sebelum bersuara perlahan — cukup untuk membuat semua rakannya diam membatu.</p>\n<p class=\"dialogue\">“We are dead.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Ketika loceng rehat bergema, Khalid melangkah melintasi laluan berbumbung di hadapan bilik bimbingan dan kaunseling. Langkahnya terhenti seketika apabila melihat sekumpulan pengawas bertali leher kemas sedang berbaris mendengar taklimat ringkas.</p>\n<p>Di hadapan mereka, berdiri seorang guru lelaki bertubuh tegap, berambut kemas dan berkaca mata bingkai perak—Cikgu Muzammil, guru penasihat lembaga disiplin dan pengawas yang cukup disegani kerana auranya yang tenang dan berwibawa.</p>\n<p class=\"dialogue\">“Pastikan rondaan minggu ini diperketatkan, terutamanya di kawasan belakang blok bengkel dan laluan surau lama,” suara Cikgu Muzammil bergema tenang namun tegas. “Pihak sekolah mahu imej dan ketenteraman sentiasa terpelihara.”</p>\n<p class=\"dialogue\">“Baik, cikgu,” sahut Fahmi selaku ketua pengawas dengan penuh hormat.</p>\n<p>Namun pandangan Khalid terpaku pada dua orang pengawas di barisan tepi yang berbisik perlahan sesama mereka. Salah seorang daripada mereka berbadan tegap dengan tanda nama bersulam kemas pada poket baju: EDY. Di sebelahnya ialah Zamani, yang sentiasa memegang buku catatan pengawas.</p>\n<p>Cikgu Muzammil menghampiri Edy, menepuk bahunya dengan senyuman mesra yang tampak amat akrab. “Edy, kunci bilik stor peralatan sukan ada pada kamu, kan? Pastikan hanya kamu dan Zamani yang memegang rekod itu.”</p>\n<p class=\"dialogue\">“Beres, cikgu. Jangan risau,” balas Edy sambil tersengih penuh keyakinan.</p>\n<p>Jantung Khalid berdetik halus. Tulisan pada cebisan kertas pesanan Kit di dalam biliknya seolah-olah terngiang kembali di cuping telinga:</p>\n<p>‘...jangan percaya pada budak pengawas bernama Edy.’</p>\n<p>Kenapa seorang guru berwibawa seperti Cikgu Muzammil memberi kepercayaan khas kepada Edy? Dan apakah hubungan antara amaran Kit dengan gerak-geri pengawas itu?</p>\n<p>Persoalan itu terus membayangi fikirannya sepanjang melangkah kembali ke kelas.</p>", "wordCount": 1473}, {"num": 9, "fullTitle": "Bab 9 – Janji di Sebalik Rotan", "title": "Janji di Sebalik Rotan", "content": "<p class=\"dialogue\">“Erm… budak-budak saya semua dah balik rupanya. Ingatkan nak melepak sampai habis waktu sekolah.”</p>\n<p>Nada suara Cikgu Bakar kedengaran perlahan tapi tajam. Di tangannya sudah tersedia sebatang rotan yang cukup untuk membuat sesiapa pun berpeluh sebelum dirotan.</p>\n<p class=\"dialogue\">“Sudah, semua berbaris depan saya. Sekapal kamu datang, sekapal juga kamu kena.”</p>\n<p>Suasana kelas 5 Alfa bertukar tegang. Dua belas pelajar lelaki berdiri dalam satu barisan panjang — dimulai dengan Saiful di hadapan. Masing-masing sudah bersedia menanggung akibat kerana keluar beramai-ramai semasa waktu rehat tamat.</p>\n<p class=\"dialogue\">“Saiful!”</p>\n<p>Nada Cikgu Bakar meninggi. “Kamu ketua kelas, tapi kamu pula yang jadi ketua mereka melepak. Patutnya kamu pantau, bukan ikut sama.”</p>\n<p>Saiful tunduk, wajahnya merah padam. “Minta maaf, cikgu…”</p>\n<p>Rotan diangkat. Semua pelajar serentak menelan liur.</p>\n<p class=\"dialogue\">“Baiklah,” ujar Cikgu Bakar dengan nada tegas, “kamu semua saya sebat tiga kali setiap seorang sebab gagal ikut peraturan. Kalau rasa tak cukup, saya boleh tambah lima lagi.”</p>\n<p>Cepat-cepat semua menggeleng.</p>\n<p class=\"dialogue\">“Janji dengan saya, lepas ni waktu rehat tamat kamu semua mesti masuk kelas. Tak kira ada guru atau tidak!”</p>\n<p>Serentak mereka menjawab, “Baik, cikgu!”</p>\n<p class=\"dialogue\">“Bagus. Sekarang pusing belakang. Saya nak sebat buntut kamu semua.”</p>\n<p>Terpinga-pinga mereka dibuatnya. Tiada siapa sangka hukuman hari itu jadi luar biasa.</p>\n<p>Sebatan pertama jatuh pada Saiful.</p>\n<p class=\"dialogue\">“Argh!” jeritnya spontan, tapi dia cuba menahan air mata yang sudah bergenang. Sebatan kedua dan ketiga menyusul. Saiful menggigit bibir — cuba kekal ‘macho’ di depan pelajar perempuan yang sedang menonton dari dalam kelas.</p>\n<p>Selepas itu, Fahmi pula ke depan. Walau digelar pelajar contoh sekolah, wajahnya jelas pucat. Cikgu Bakar memegang rotan seperti pahlawan zaman silam.</p>\n<p class=\"dialogue\">“Fahmi, ketua pelajar sekolah. Orang kepercayaan saya… tapi hari ni pun buat hal!”</p>\n<p>Zass!</p>\n<p>Satu, dua, tiga. Fahmi menggenggam hujung meja menahan perit, mukanya tertunduk.</p>\n<p>Hukuman diteruskan. Ada yang menjerit, ada yang cuba bergurau menutup rasa malu, dan ada yang langsung tak tahan — memohon rehat sekejap antara sebatan.</p>\n<p>Akhirnya tinggal Khalid.</p>\n<p class=\"dialogue\">“Nama kamu siapa?” tanya Cikgu Bakar sambil merenung wajah pelajar yang belum dikenalinya.</p>\n<p>Khalid menunduk sopan. “Nama saya Khalid, cikgu. Pelajar baru kelas ni.”</p>\n<p class=\"dialogue\">“Oh, Khalid.” Cikgu Bakar mengangguk perlahan. “Budak baru pindah tu ya? Yang kena pindah sebab kes gaduh di sekolah lama?”</p>\n<p>Nada suaranya berubah — ada sindiran halus yang menikam ego Khalid.</p>\n<p class=\"dialogue\">“Huh. Hebat juga kamu ya. Tak apa, hukuman tetap hukuman. Sekurang-kurangnya mungkin lepas ni kamu fikir dua kali sebelum bertumbuk.”</p>\n<p>Khalid hanya tunduk diam. Rotan pun hinggap tiga kali. Sakit, tapi dia tahan. Bukan kerana mahu nampak kuat, tetapi kerana dia tahu — ini harga yang harus dibayar untuk menjadi “orang baru”.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas hukuman selesai, Cikgu Bakar tidak terus beredar. Dia mula berkhutbah panjang.</p>\n<p class=\"dialogue\">“Kamu semua ni masih muda. Kalau nak berjaya dalam hidup, kena ada disiplin. Tanpa disiplin, kamu tak akan ke mana-mana. Ingat, orang yang berjaya semuanya berdisiplin!”</p>\n<p>Nada petuahnya bergema hampir satu jam. Ramai yang sudah lena di meja masing-masing. Ada yang berpura-pura menulis nota, ada yang termenung menunggu waktu berlalu.</p>\n<p>Saiful cuba fokus, tapi matanya sudah berat. Dia menjeling ke arah Khalid yang nampak tunduk — disangka tidur.</p>\n<p class=\"dialogue\">“Eh, kau tidur ke?” bisiknya perlahan.</p>\n<p>Khalid mengangkat kepala sedikit. Senyumnya nipis. “Jangan percaya sangat cakap Cikgu Bakar tu. Bahaya.”</p>\n<p>Saiful terpinga. “Kenapa pula?”</p>\n<p class=\"dialogue\">“Disiplin penting, tapi kejayaan sebenar bukan datang dari disiplin saja. Ia datang dari sejauh mana kita taat pada Allah, ikut cara Nabi.” Suara Khalid perlahan tapi jelas.</p>\n<p class=\"dialogue\">“Aku tak berapa faham…” Saiful menggaru kepala.</p>\n<p class=\"dialogue\">“Nanti aku cerita,” balas Khalid, kemudian menyambung tidur semula.</p>\n<p>Saiful hanya mampu tersenyum kecil. “Budak ni pelik betul,” bisiknya sendiri.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Akhirnya, khutbah Cikgu Bakar tamat juga.</p>\n<p class=\"dialogue\">“Baiklah, saya ada kelas di 5 Bestari. Sebelum saya keluar, saya nak bagi kerja rumah sikit. Tak susah pun.”</p>\n<p>Keluhan bergema dari seluruh kelas.</p>\n<p class=\"dialogue\">“Aduh, bagi kerja lagi…,” rungut Saiful perlahan. Khalid pula mencatat arahan di papan putih tanpa banyak reaksi.</p>\n<p>Sebaik Cikgu Bakar melangkah keluar, kelas kembali hidup. Suara bising menggantikan kesunyian.</p>\n<p class=\"dialogue\">“Saiful,” panggil Khalid perlahan.</p>\n<p class=\"dialogue\">“Ha, kenapa?”</p>\n<p class=\"dialogue\">“Jom keluar sekejap.”</p>\n<p class=\"dialogue\">“Eh, sejak bila kau suka keluar ni?” usik Saiful sambil tersengih.</p>\n<p class=\"dialogue\">“Sejak kawan dengan kau,” jawab Khalid selamba.</p>\n<p class=\"dialogue\">“Haha, bagus la tu. Tapi—”</p>\n<p class=\"dialogue\">“Chop! Chop!” Suara garang Yati memotong perbualan mereka. Tangan gadis itu terangkat tinggi, menghalang laluan mereka.</p>\n<p class=\"dialogue\">“Ha, nak ke mana dua orang ni?” tanyanya dengan gaya seperti pegawai disiplin.</p>\n<p>Saiful bercekak pinggang. “Adalah. Kau duduk ja situ buat kerja kau.”</p>\n<p class=\"dialogue\">“Ha, teringat pula aku. Duit kelas bulan ni mana? Dah tiga bulan tak bayar, tahu tak?” Yati menegakkan keningnya.</p>\n<p class=\"dialogue\">“Mak aih, garangnya…” Khalid sempat terlepas cakap, menyebabkan Yati terus berpaling padanya.</p>\n<p class=\"dialogue\">“Ha, memang aku garang. Kalau tak garang, siapa nak bayar?” balasnya dengan mata tajam.</p>\n<p>Saiful tergelak kecil. “Aku tak bawa duit la hari ni, Yati. Lain kali ya.”</p>\n<p class=\"dialogue\">“Lain kali, lain kali. Minggu lepas pun sama.” Yati mengeluh panjang.</p>\n<p>Dia berpaling ke arah Khalid pula. “Kamu ni pelajar baru kan? Jangan ingat terlepas. RM25.”</p>\n<p class=\"dialogue\">“RM25?!” Khalid hampir terbatuk.</p>\n<p>Saiful cepat menyampuk. “Yati, agak-agak la. Bagi diskaun budak baru ni.”</p>\n<p class=\"dialogue\">“Hmph, baiklah. RM5 dulu bulan ni,” kata Yati akhirnya — tapi matanya masih menjeling tajam.</p>\n<p>Tanpa banyak bicara, Khalid keluarkan not RM5 dan hulurkan. Yati menyambutnya seperti pegawai cukai.</p>\n<p class=\"dialogue\">“Ha, macam ni la senang. Tak payah tunggu aku kejar. Jenuh,” katanya sambil berlalu menuju ke kumpulan pelajar lain.</p>\n<p class=\"dialogue\">“Tu dia, Kak Yong mai kutip cukai!” jerit Haziq dari belakang. Satu kelas ketawa.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Selepas suasana kembali tenang, Khalid menarik Saiful ke tepi.</p>\n<p class=\"dialogue\">“Saiful, aku nak tunjuk sesuatu. Tapi kau kena janji dengan aku, rahsiakan benda ni.”</p>\n<p>Saiful memandang pelik. “Rahsia apa ni? Bunyi macam berat saja.”</p>\n<p class=\"dialogue\">“Serius ni, Saiful. Antara kita dua je.”</p>\n<p class=\"dialogue\">“Haish… macam drama la kau ni,” katanya sambil tersengih, tapi melihat wajah Khalid yang serius, dia terus mengangkat tangan. “Okay, aku janji.”</p>\n<p class=\"dialogue\">“Bagus,” Khalid menepuk bahunya. “Sekarang bawa aku ke tempat yang tak ramai orang. Cikgu pun jarang datang.”</p>\n<p>Saiful mengangkat kening. “Tempat t
