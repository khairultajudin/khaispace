pagi menembus masuk, mencipta bayangan tajam di lantai.</p>\n<p>Cikgu Bakar membuka fail merah di hadapannya. Di dalamnya, terselit beberapa helaian laporan bertulis dan salinan gambar kecil — dompet milik Balkis.</p>\n<p>Tanpa memandang Khalid, beliau bersuara dengan nada perlahan tapi tajam.</p>\n<p class=\"dialogue\">“Khalid, awak tahu kenapa saya panggil awak ke sini, kan?”</p>\n<p>Khalid mengangguk perlahan. “Ya, cikgu.”</p>\n<p class=\"dialogue\">“Dompet pelajar perempuan ditemui dalam beg awak.”</p>\n<p class=\"dialogue\">“Dan itu bukan kali pertama nama awak dikaitkan dengan kejadian pelik di sekolah ni.”</p>\n<p>Nada suaranya semakin meninggi, seperti menahan marah.</p>\n<p class=\"dialogue\">“Awak ada apa-apa nak jelaskan?”</p>\n<p>Khalid mengangkat wajahnya, memandang terus ke arah mata Cikgu Bakar.</p>\n<p class=\"dialogue\">“Cikgu, saya tahu bagaimana rupa keadaan tu dari luar nampak macam saya bersalah… tapi saya tak curi apa-apa.”</p>\n<p class=\"dialogue\">“Jadi awak nak kata awak difitnah?”</p>\n<p class=\"dialogue\">“Kalau ya, siapa yang fitnah awak?”</p>\n<p>Khalid diam. Bukan kerana takut, tetapi kerana dia tahu setiap perkataannya kini akan ditimbang dan mungkin disalah ertikan.</p>\n<p>Cikgu Bakar menutup fail itu perlahan, lalu bersandar di kerusinya.</p>\n<p class=\"dialogue\">“Awak tahu, Khalid, sejak minggu lepas saya dah terima banyak laporan tentang awak—awak sering dilihat sendirian di kawasan yang pelik, awak banyak bertanya tentang kes lama sekolah ini, awak juga pernah didenda. Awak fikir semua itu tak mencurigakan?</p>\n<p>Malah, fail peribadi dari MRSM lama awak masih ada di atas meja saya. Awak ingat saya tak tahu tentang insiden huru-hara yang menyebabkan awak terpaksa berpindah keluar dari sana? Jangan bawa tabiat lama ke SMK Sri Dian!”</p>\n<p>Nada suara itu bukan lagi sekadar pertanyaan — ia seperti hukuman sebelum keputusan.</p>\n<p>Namun Khalid tetap menundukkan kepala dan menarik nafas panjang.</p>\n<p class=\"dialogue\">“Cikgu,” katanya perlahan, “saya tahu ada yang cuba jatuhkan saya. Tapi saya ada sebab kenapa saya buat semua tu.”</p>\n<p>Cikgu Bakar mengetap bibir, menunggu sambungan kata-kata itu.</p>\n<p class=\"dialogue\">“Sejak hari pertama saya masuk ke sekolah ni, saya dah perasan sesuatu yang tak kena. Bermula dengan kes kecurian, kemudian kejadian di kelas 5 Beta, dan yang terbaru… pencerobohan lima kelas minggu lepas.”</p>\n<p>Khalid bersuara tenang, tapi matanya menampakkan kesungguhan yang tidak dibuat-buat.</p>\n<p class=\"dialogue\">“Saya mula mengumpul semua maklumat. Setiap kali berlaku kejadian, saya catat siapa yang ada di tempat kejadian, bila masa kejadian berlaku, dan di mana. Dari situ saya nampak satu corak yang sama…”</p>\n<p class=\"dialogue\">“Corak?” Cikgu Bakar menyampuk, berkerut dahi.</p>\n<p class=\"dialogue\">“Ya, cikgu. Setiap kali berlaku kes — kecurian, pencerobohan, atau kehilangan barang — mesti ada dua individu yang berada berhampiran tempat kejadian.</p>\n<p>Dan dua individu itu… ialah Edy dan Zamani.”</p>\n<p>Nama itu bergema di ruang pejabat yang tiba-tiba senyap.</p>\n<p>Cikgu Bakar mendongak, pandangannya tajam menembusi Khalid.</p>\n<p class=\"dialogue\">“Awak sedar tak apa yang awak sedang tuduh ni, Khalid? Mereka tu pengawas sekolah! Malah salah seorang daripada mereka kapten pasukan bola sepak!”</p>\n<p class=\"dialogue\">“Saya tahu, cikgu,” balas Khalid cepat, “dan sebab itu saya tak pernah buka mulut sebelum ni. Tapi saya ada bukti — bukan untuk menjatuhkan mereka, cuma untuk buktikan saya tak bersalah.”</p>\n<p>Khalid mengeluarkan telefon bimbit dari poketnya, mengaktifkan aplikasi yang digunakannya sebelum ini — paparan berbentuk radar muncul di skrin.</p>\n<p class=\"dialogue\">“Ini, cikgu. Aplikasi ni saya gunakan untuk jejak pergerakan gajet yang saya sorokkan di tempat tertentu dalam kelas selepas kejadian pertama dulu.</p>\n<p>Dan kalau cikgu perhatikan,” Khalid menunjukkan pada skrin, “setiap kali berlaku kecurian, isyarat daripada alat ini akan bergerak ke arah yang sama — ke bilik penyimpanan sukan, dan kadang-kadang, ke kawasan padang.”</p>\n<p>Cikgu Bakar menatap skrin itu lama. Walaupun wajahnya masih tegas, riak matanya sedikit berubah — dari marah kepada ragu.</p>\n<p>Khalid menyambung dengan nada yang lebih perlahan tapi kukuh.</p>\n<p class=\"dialogue\">“Saya tak mahu menuduh sesiapa tanpa bukti. Tapi apa yang berlaku hari ni, bila dompet tu tiba-tiba ada dalam beg saya… saya tahu seseorang cuba buat saya nampak bersalah.”</p>\n<p>Cikgu Bakar terdiam. Suasana pejabat itu sunyi, hanya kedengaran kipas berpusing perlahan di siling.</p>\n<p>Tiba-tiba, pintu pejabat diketuk dari luar.</p>\n<p class=\"dialogue\">“Masuk!” arah Cikgu Bakar.</p>\n<p>Pintu terbuka — dan Fahmi, ketua pengawas sekolah, melangkah masuk.</p>\n<p>Wajahnya serius, tapi matanya tenang.</p>\n<p class=\"dialogue\">“Maaf ganggu, cikgu,” katanya sambil memegang beberapa helai kertas di tangan. “Saya baru terima laporan daripada pasukan pengawas yang memeriksa beg pelajar lain sebentar tadi.”</p>\n<p>Cikgu Bakar mengangguk. “Ya, Fahmi. Duduk. Saya tengah siasat kes Khalid ini.”</p>\n<p>Fahmi berpaling ke arah Khalid, kemudian ke Cikgu Bakar.</p>\n<p class=\"dialogue\">“Kalau begitu, biar saya teruskan sedikit, cikgu. Sebab laporan ni mungkin akan ubah segalanya.”</p>\n<p>Cikgu Bakar mengerutkan kening. “Apa maksud awak?”</p>\n<p>Fahmi menarik nafas dalam, kemudian meletakkan satu helaian di atas meja.</p>\n<p class=\"dialogue\">“Dompet milik Balkis yang kononnya ditemui dalam beg Khalid sebenarnya telah dilaporkan hilang dua hari lebih awal — sebelum spot-check dijalankan.</p>\n<p>Dan lebih menarik… salah seorang pengawas yang mengendalikan pemeriksaan tadi — Edy — dilihat memasuki bilik simpanan pelajar tanpa kebenaran pagi tadi.”</p>\n<p>Cikgu Bakar tersentak kecil. “Apa?”</p>\n<p>Fahmi menatap terus ke arah pengetua disiplin itu.</p>\n<p class=\"dialogue\">“Kami dah sahkan melalui rakaman CCTV koridor. Khalid tak bersalah, cikgu. Orang yang kita cari sebenarnya dah pun dikenal pasti.”</p>\n<p>Cikgu Bakar memandang Khalid — kali ini tiada lagi kemarahan, hanya kebisuan panjang yang disertai rasa bersalah.</p>\n<p>Khalid tidak berkata apa-apa. Dia hanya menghela nafas panjang dan menunduk sedikit.</p>\n<p class=\"dialogue\">“Saya dah kata, cikgu,” katanya perlahan, “kadang-kadang bukan semua yang nampak tenang itu benar. Tapi bukan semua yang nampak salah itu bersalah.”</p>\n<p>Fahmi menepuk bahunya dengan senyuman tenang. “Kau dah buat lebih daripada cukup, Khalid. Sekarang biar kami teruskan siasatan ini.”</p>\n<p>Khalid mengangguk perlahan. Beban yang menekan dadanya selama ini akhirnya terasa terangkat.</p>\n<p>Namun jauh di sudut hatinya, dia tahu — walaupun kebenaran sudah mula terbuka, ini baru permulaan kepada sesuatu yang lebih besar.</p>", "wordCount": 951}, {"num": 32, "fullTitle": "Bab 32 – Penutup Sebuah Rahsia", "title": "Penutup Sebuah Rahsia", "content": "<p>Pagi itu, suasana sekolah kembali seperti sedia kala — sekurang-kurangnya pada pandangan luar.</p>\n<p>Burung-burung berterbangan di langit biru, dan suara pelajar yang sedang beratur di dewan terbuka kedengaran ceria seperti biasa. Namun, di sebalik tawa dan perbualan itu, ada sesuatu yang masih menggantung di udara — bayang semalam yang belum benar-benar hilang.</p>\n<p>Khalid berjalan perlahan menuju ke kelasnya, beg galas tersandang di bahu, wajahnya tenang namun sarat dengan pelbagai fikiran. Dia masih terasa debar semalam, ketika dirinya disoal siasat oleh Cikgu Bakar — sebelum akhirnya dibersihkan nama oleh Fahmi.</p>\n<p>Hanya Fahmi yang mengetahui seluruh cerita itu. Tiada seorang pun antara rakan-rakan lain yang tahu apa yang telah berlaku.</p>\n<p class=\"dialogue\">“Khalid!”</p>\n<p>Suara ceria Saiful menyapa dari hujung koridor.</p>\n<p>Dia melambai sambil tersenyum, wajahnya langsung tidak menampakkan sebarang tanda bahawa sesuatu yang besar baru saja berlaku sehari sebelumnya.</p>\n<p class=\"dialogue\">“Awal kau hari ni,” katanya riang sambil menepuk bahu Khalid. “Biasanya aku dulu yang sampai dulu.”</p>\n<p>Khalid tersenyum kecil. “Hari ini rasa nak datang awal. Nak tenangkan fikiran.”</p>\n<p class=\"dialogue\">“Haha, tenangkan fikiran? Macam pelik je dengar dari kau. Kau ni selalu tenang,” Saiful mengusik.</p>\n<p class=\"dialogue\">“Jom masuk, nanti lambat pula.”</p>\n<p>Mereka melangkah masuk ke kelas 5 Alfa.</p>\n<p>Suasana pagi itu tampak biasa — beberapa pelajar masih berbual, ada yang sibuk menyiapkan kerja rumah, dan seperti selalu, Suria sedang berbincang dengan rakan-rakannya di meja hadapan.</p>\n<p>Khalid duduk di tempatnya, membuka buku, dan cuba menyesuaikan diri dengan suasana yang tenang itu. Tapi di hatinya, dia tahu, badai belum benar-benar reda.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Sekitar jam sepuluh pagi, ketika sesi pembelajaran sedang berlangsung, satu bunyi kuat dari luar kelas mengejutkan semua pelajar.</p>\n<p>Bunyi enjin kereta yang berhenti secara mengejut di perkarangan sekolah, disusuli dengan hon pendek dua kali.</p>\n<p>Semua mata berpaling ke arah tingkap.</p>\n<p>Di luar sana, kelihatan sebuah kereta polis berhenti betul-betul di hadapan bangunan pentadbiran. Dua anggota berpakaian seragam keluar dari kenderaan itu, diikuti seorang lelaki berpakaian kemas — Cikgu Muzammil.</p>\n<p>Suasana kelas berubah serta-merta.</p>\n<p>Suara-suara berbisik mula kedengaran.</p>\n<p class=\"dialogue\">“Eh, tu kan Cikgu Muzammil?”</p>\n<p class=\"dialogue\">“Kenapa ada polis?”</p>\n<p class=\"dialogue\">“Dia kena tangkap ke?”</p>\n<p>Khalid mendongak perlahan. Degupan jantungnya mula berubah rentak. Dia tahu nama itu terlalu dekat dengan misteri yang cuba diselongkarnya selama ini.</p>\n<p>Tidak lama kemudian, kedengaran bunyi kasut bergema di koridor. Dua anggota polis berjalan mengiringi Cikgu Muzammil ke arah pejabat pengetua.</p>\n<p>Wajah cikgu itu tampak tegang — bukan garang seperti biasa, tapi resah, seperti seseorang yang tahu rahsianya akhirnya terbongkar.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Khabar itu tersebar dengan pantas — dari satu kelas ke satu kelas, dari mulut ke mulut.</p>\n<p>Pelajar-pelajar berkumpul di tepi tingkap, mengintai dengan rasa ingin tahu yang membuak-buak.</p>\n<p>Cikgu Fatimah yang masuk mengajar waktu seterusnya hanya mampu menggeleng kepala.</p>\n<p class=\"dialogue\">“Sudah, duduk semua,” katanya lembut tapi tegas. “Apa pun yang berlaku, biarlah pihak sekolah yang uruskan.”</p>\n<p>Namun bisikan itu tidak pernah berhenti.</p>\n<p class=\"dialogue\">“Katanya Cikgu Muzammil yang rancang semua ni.”</p>\n<p class=\"dialogue\">“Dia yang arahkan Edy dan Zamani.”</p>\n<p class=\"dialogue\">“Patutlah semua kes pelik tu berlaku dekat kawasan dia.”</p>\n<p>Khalid hanya diam, menunduk di tempat duduknya. Dia tidak perlu berkata apa-apa.</p>\n<p>Semuanya sedang berlaku tepat seperti yang dia jangka.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Tengah hari itu, pengumuman rasmi dibuat oleh pengetua sendiri melalui pembesar suara sekolah.</p>\n<p class=\"dialogue\">“Kepada semua pelajar, pihak sekolah ingin memaklumkan bahawa guru bernama Cikgu Muzammil telah diserahkan kepada pihak berkuasa untuk siasatan lanjut.</p>\n<p>Beliau disyaki menjadi dalang di sebalik beberapa kejadian kecurian dan pencerobohan yang berlaku di sekolah sejak kebelakangan ini.”</p>\n<p>Satu keheningan menyelubungi seluruh sekolah.</p>\n<p>Masing-masing terpaku mendengar.</p>\n<p>Ramai yang tidak percaya — seorang guru yang disegani, rupanya menyimpan niat yang tidak disangka.</p>\n<p>Dan hanya ketika itu barulah ramai mula berpaling ke arah Khalid, yang duduk tenang di hujung kelas.</p>\n<p>Saiful memandangnya dengan mata terbeliak.</p>\n<p class=\"dialogue\">“Jadi... kau...?”</p>\n<p>Khalid menghela nafas, kemudian tersenyum kecil. “Aku cuma buat apa yang sepatutnya aku buat, Saiful.”</p>\n<p class=\"dialogue\">“Maknanya, selama ni kau yang... selesaikan semua ni?” Suara Saiful kedengaran antara kagum dan tidak percaya.</p>\n<p>Khalid hanya tersenyum lagi, kali ini lebih tenang.</p>\n<p class=\"dialogue\">“Bukan aku yang selesaikan, Saiful. Allah yang tunjuk jalan. Aku cuma ikut petunjuk.”</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Beberapa pelajar lain mula menghampirinya.</p>\n<p>Ada yang menepuk bahunya, ada yang mengucapkan tahniah, malah ada yang memujinya sebagai wira sekolah.</p>\n<p>Khalid hanya mengangguk kecil, tidak terlalu selesa dengan perhatian itu.</p>\n<p class=\"dialogue\">“Terima kasih, tapi ingatlah,” katanya perlahan, namun cukup kuat untuk didengari rakan-rakan di sekeliling.</p>\n<p class=\"dialogue\">“Makhluk tak ada kuasa. Kalau Allah tak izinkan, takkan bergerak walau satu pun rahsia terbuka. Semua ini… milik Dia.”</p>\n<p>Suasana kelas terdiam seketika.</p>\n<p>Ada sesuatu pada cara Khalid mengucapkannya — satu ketenangan yang jarang ada pada usia muda sepertinya.</p>\n<p>Fahmi yang berdiri di pintu masuk kelas sekadar mengangguk sambil tersenyum bangga.</p>\n<p>Dia tahu perjuangan Khalid bukan sekadar mencari kebenaran di sekolah ini — tapi mengenali erti tawakal dan hikmah di sebalik setiap ujian.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>Ketika loceng akhir hari berbunyi, Khalid berjalan perlahan keluar dari kelas.</p>\n<p>Langit petang mula jingga, dan dari jauh, surau lama berdiri teguh di hujung blok — tempat di mana segalanya bermula.</p>\n<p>Dia berhenti seketika, memandang bangunan itu dengan senyuman kecil di wajah.</p>\n<p>Angin petang menyapa lembut, membawa bayangan kenangan dan suara-suara doa yang masih bergema di dindingnya.</p>\n<p class=\"dialogue\">“Alhamdulillah…,” bisiknya perlahan. “Segala puji hanya bagi-Mu, ya Allah.”</p>\n<p>Dan dengan langkah yang tenang, Khalid meninggalkan halaman sekolah — meninggalkan kisah gelap yang akhirnya menemukan cahaya.</p>\n<p>Ketika melangkah keluar melepasi pintu pagar utama sekolah, pandangan Khalid tertancap ke seberang jalan. Di bawah bayang redup pohon angsana berhampiran kedai runcit lama, seorang remaja lelaki sedang bersandar pada motosikalnya.</p>\n<p>Remaja berjaket lusuh itu memerhatikan suasana sekolah—memerhatikan kereta peronda polis yang tadi membawa Cikgu Muzammil pergi.</p>\n<p>Kit.</p>\n<p>Mata mereka bertembung seketika merentasi jalan raya. Tiada kata-kata yang diucapkan, namun Kit mengangkat dua jarinya ke pelipis tanda tabik hormat yang tenang—seolah-olah mengakui bahawa keadilan atas nama lamanya yang pernah tercalar akhirnya tertebus.</p>\n<p>Khalid tersenyum kecil, membalas dengan anggukan hormat.</p>\n<p>Kit menghidupkan enjin motosikalnya, memulas pendikit perlahan, lalu beredar membelah angin petang.</p>\n<p>Sebuah permulaan baru menantinya.</p>\n<div class=\"scene-divider\">✦ ✦ ✦</div>\n<p>✨TAMAT–Memburu Jejak: Langkah Pertama✨</p>", "wordCount": 964}];
    let currentIdx = -1; // -1 means cover slide
    let currentFontSize = 19;
    const themes = ['sepia', 'light', 'dark'];
    let themeIdx = 0;

    function renderTOC() {
      const container = document.getElementById('tocList');
      container.innerHTML = '';
      
      // Cover item
      const coverItem = document.createElement('div');
      coverItem.className = 'toc-item ' + (currentIdx === -1 ? 'active' : '');
      coverItem.onclick = () => { showCover(); toggleDrawer(); };
      coverItem.innerHTML = `<span class="toc-item-num">MUKA DEPAN</span><span class="toc-item-title">Kulit Buku &amp; Pengenalan</span>`;
      container.appendChild(coverItem);

      chapters.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'toc-item ' + (currentIdx === idx ? 'active' : '');
        div.onclick = () => { goToChapter(idx); toggleDrawer(); };
        div.innerHTML = `
          <span class="toc-item-num">BAB ${String(c.num).padStart(2, '0')}</span>
          <span class="toc-item-title">${c.title}</span>
        `;
        container.appendChild(div);
      });
    }

    function showCover() {
      currentIdx = -1;
      document.getElementById('coverSlide').style.display = 'flex';
      document.getElementById('chapterArticle').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateProgress();
      renderTOC();
    }

    function goToChapter(idx) {
      if (idx < 0 || idx >= chapters.length) return;
      currentIdx = idx;
      const c = chapters[idx];

      document.getElementById('coverSlide').style.display = 'none';
      document.getElementById('chapterArticle').style.display = 'block';

      document.getElementById('chapterBadge').innerText = `BAB ${String(c.num).padStart(2, '0')}`;
      document.getElementById('chapterTitle').innerText = c.title;
      
      const readMins = Math.max(1, Math.round(c.wordCount / 220));
      document.getElementById('chapterMeta').innerText = `~${readMins} minit bacaan &bull; ${c.wordCount} patah perkataan`;
      
      document.getElementById('proseContent').innerHTML = c.content;
      document.getElementById('chapterIndicator').innerText = `${idx + 1} / ${chapters.length}`;

      document.getElementById('prevBtn').disabled = (idx === 0);
      document.getElementById('nextBtn').disabled = (idx === chapters.length - 1);

      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateProgress();
      renderTOC();
    }

    function prevChapter() {
      if (currentIdx > 0) goToChapter(currentIdx - 1);
    }

    function nextChapter() {
      if (currentIdx < chapters.length - 1) goToChapter(currentIdx + 1);
    }

    function toggleDrawer() {
      document.getElementById('drawerOverlay').classList.toggle('open');
      document.getElementById('tocDrawer').classList.toggle('open');
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(15, Math.min(26, currentFontSize + delta));
      document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
    }

    function cycleTheme() {
      themeIdx = (themeIdx + 1) % themes.length;
      const t = themes[themeIdx];
      document.documentElement.setAttribute('data-theme', t);
      
      const btn = document.getElementById('themeBtn');
      if (t === 'sepia') btn.innerHTML = '📜 Sepia';
      else if (t === 'light') btn.innerHTML = '☀️ Terang';
      else btn.innerHTML = '🌙 Gelap';
    }

    function updateProgress() {
      const bar = document.getElementById('progressBar');
      if (currentIdx === -1) {
        bar.style.width = '0%';
        return;
      }
      const pct = Math.round(((currentIdx + 1) / chapters.length) * 100);
      bar.style.width = `${pct}%`;
    }

    window.addEventListener('scroll', () => {
      if (currentIdx !== -1) {
        const h = document.documentElement.scrollHeight - window.innerHeight;
        if (h > 0) {
          const scrollPct = (window.scrollY / h);
          const basePct = (currentIdx / chapters.length);
          const chPct = (1 / chapters.length) * scrollPct;
          const totalPct = Math.min(100, Math.round((basePct + chPct) * 100));
          document.getElementById('progressBar').style.width = `${totalPct}%`;
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderTOC();
    });
  </script>
