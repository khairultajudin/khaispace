[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kai-cad"
version = "0.1.0"
description = "KAI CAD Studio — Deterministic Parametric CAD Engine (OpenSCAD) for Khaispace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kai-cad = "kai_cad.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["kai_cad*"]
